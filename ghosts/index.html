    box(FD, 0.1, 0.03, skirtMat, FW / 2 - 0.015, 0.05, zc).rotation.y = Math.PI / 2;

    // the far wall opens where the entrance was, onto a stair: one flight up and away, a landing,
    // then a second flight turning right along the back wall and climbing out of sight
    const sw = 2.2, sh = 2.7;                                                // the opening, and the flights' width
    const segW = (FW - sw) / 2;
    slab(segW, FH, wallMat(segW), -(sw / 2 + segW / 2), FH / 2, z1, Math.PI);
    slab(segW, FH, wallMat(segW), sw / 2 + segW / 2, FH / 2, z1, Math.PI);
    slab(sw, FH - sh, wallMat(sw), 0, sh + (FH - sh) / 2, z1, Math.PI);
    box(0.08, sh + 0.04, 0.24, trimMat, -(sw / 2 + 0.04), (sh + 0.04) / 2, z1);
    box(0.08, sh + 0.04, 0.24, trimMat, sw / 2 + 0.04, (sh + 0.04) / 2, z1);
    box(sw + 0.16, 0.08, 0.24, trimMat, 0, sh + 0.04, z1);

    const rise = 0.17, going = 0.28, stepsA = 14, stepsB = 10, landing = sw;
    const runA = stepsA * going, topA = stepsA * rise, runB = stepsB * going, topB = stepsB * rise;
    const zs = z1 + 0.12;                                                    // foot of the first flight, just past the threshold
    const zL = zs + runA, zBack = zL + landing;                              // the landing band, and the back wall
    const xR = sw / 2 + runB + 0.3;                                          // how far the well extends to the right for the second flight
    const wellTop = FH + topA + topB + 0.6;
    const stone = matte(COLORS.foyerWall, null, { roughness: 0.85 });
    const tread = matte(COLORS.foyerFloor, null, { roughness: CONFIG.floorGloss + 0.15, envMapIntensity: 0.8 });
    for (let i = 0; i < stepsA; i++) {
      const h = (i + 1) * rise, z = zs + (i + 0.5) * going;
      box(sw - 0.04, h - 0.04, going, stone, 0, (h - 0.04) / 2, z);             // the mass of the step
      box(sw - 0.04, 0.04, going + 0.03, tread, 0, h - 0.02, z - 0.015);         // an oak tread with a little nosing
    }
    box(sw - 0.04, topA - 0.04, landing, stone, 0, (topA - 0.04) / 2, zL + landing / 2);
    box(sw - 0.04, 0.04, landing, tread, 0, topA - 0.02, zL + landing / 2);
    for (let j = 0; j < stepsB; j++) {                                        // the second flight, running right along the back wall
      const h = topA + (j + 1) * rise, x = sw / 2 + (j + 0.5) * going;
      box(going, h - 0.04, landing - 0.04, stone, x, (h - 0.04) / 2, zL + landing / 2);
      box(going + 0.03, 0.04, landing - 0.04, tread, x - 0.015, h - 0.02, zL + landing / 2);
    }

    // the L-shaped stairwell: tall walls, a ceiling high above, daylight over the landing and over the head of the second flight
    const wellMat = (len) => matte(COLORS.foyerWall, wallShade(len, wellTop, { bottom: false }));
    const depth = zBack - z1;
    slab(depth, wellTop, wellMat(depth), -sw / 2, wellTop / 2, z1 + depth / 2, Math.PI / 2);        // left wall, full depth
    slab(runA + 0.12, wellTop, wellMat(runA), sw / 2, wellTop / 2, z1 + (runA + 0.12) / 2, -Math.PI / 2); // right wall, up to the landing
    slab(xR - sw / 2, wellTop, wellMat(xR), sw / 2 + (xR - sw / 2) / 2, wellTop / 2, zL, 0);        // the return, facing into the extension
    slab(landing, wellTop, wellMat(landing), xR, wellTop / 2, zL + landing / 2, -Math.PI / 2);     // far right wall
    slab(xR + sw / 2, wellTop, wellMat(xR + sw / 2), (xR - sw / 2) / 2, wellTop / 2, zBack, Math.PI); // back wall, across both
    slab(sw, depth, matte(COLORS.foyerCeiling), 0, wellTop, z1 + depth / 2, 0, Math.PI / 2);
    slab(xR - sw / 2, landing, matte(COLORS.foyerCeiling), sw / 2 + (xR - sw / 2) / 2, wellTop, zL + landing / 2, 0, Math.PI / 2);
    const glow = (w, d, x, z) => {
      box(w + 0.1, 0.012, d + 0.1, matte(COLORS.fixture, null, { roughness: 0.5 }), x, wellTop - 0.006, z);
      slab(w, d, sky(2.3, 2.25, 2.1, glowTex), x, wellTop - 0.02, z, 0, Math.PI / 2);
    };
    glow(sw - 0.7, landing - 0.7, 0, zL + landing / 2);
    glow(1.2, landing - 0.7, xR - 0.9, zL + landing / 2);
    const upLight = new THREE.PointLight(0xfff0dc, 1.2, 11, 2);
    upLight.position.set(xR - 0.9, wellTop - 1.2, zL + landing / 2);             // brightest where the stair goes out of sight
    room.add(upLight);

    // handrails: up the left wall for the first flight, along the back wall for the second
    const rail = matte(COLORS.trim, null, { metalness: 0.6, roughness: 0.4 });
    const railA = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, Math.hypot(runA, topA), 12), rail);
    railA.position.set(-sw / 2 + 0.08, topA / 2 + 0.9, zs + runA / 2);
    railA.rotation.x = Math.atan2(runA, topA);
    railA.castShadow = true;
    room.add(railA);
    [2, 7, 12].forEach((i) => box(0.08, 0.03, 0.03, rail, -sw / 2 + 0.04, (i + 0.5) * rise + 0.85, zs + (i + 0.5) * going));
    const railB = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, Math.hypot(runB, topB), 12), rail);
    railB.position.set(sw / 2 + runB / 2, topA + topB / 2 + 0.9, zBack - 0.08);
    railB.rotation.z = -Math.atan2(runB, topB);
    railB.castShadow = true;
    room.add(railB);
    [2, 6].forEach((j) => box(0.03, 0.03, 0.08, rail, sw / 2 + (j + 0.5) * going, topA + (j + 0.5) * rise + 0.85, zBack - 0.04));

    // pendant
    const fixture = matte(COLORS.pendant, null, { roughness: 0.4 });
    const pendantAt = { x: 0, y: 2.0, z: zc };
    box(0.006, FH - 2.1, 0.006, fixture, 0, FH - (FH - 2.1) / 2, zc);
    const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.2, 0.16, 48, 1, true), fixture);
    shade.material = shade.material.clone();
    shade.material.side = THREE.DoubleSide;
    shade.position.set(0, 2.05, zc);
    shade.castShadow = true;
    room.add(shade);
    const cap = new THREE.Mesh(new THREE.CircleGeometry(0.12, 48), shade.material);   // closed at the top, so no light escapes upward
    cap.rotation.x = -Math.PI / 2;
    cap.position.set(0, 2.13, zc);
    cap.castShadow = true;
    room.add(cap);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035, 16, 12), new THREE.MeshBasicMaterial({ color: new THREE.Color(4, 3.1, 2) }));
    bulb.position.set(0, 2.0, zc);
    room.add(bulb);
    // the pendant throws real shadows: the shade cuts its light to a cone below and a disc above, and
    // the bench and pictures take their shadows from it directly. A coarse map keeps the edges soft,
    // and a second, shadowless lamp fills them in so nothing goes black
    const lamp = new THREE.PointLight(0xffd9ad, 0.42, 9, 2);
    lamp.position.set(0, 2.0, zc);
    lamp.castShadow = renderer.shadowMap.enabled;
    lamp.shadow.mapSize.set(1024, 1024);
    lamp.shadow.bias = -0.006;
    lamp.shadow.normalBias = 0.03;
    lamp.shadow.camera.near = 0.05;
    lamp.shadow.camera.far = 12;
    room.add(lamp);
    const fill = new THREE.SpotLight(0xffd9ad, 0.3, 10, 1.35, 0.9, 2);   // a wide, soft, shadowless cone downward: lifts the shadows without touching the ceiling
    fill.position.set(0, 2.1, zc);
    fill.target.position.set(0, 0, zc);
    room.add(fill, fill.target);

    // a bench along the side wall
    // the benches: one bent slab of ply each, the seat curving down at both ends to meet the floor,
    // with a slight fall to the seat and a taper toward the feet
    const wood = matte(COLORS.wood, woodMap(1.2, 0.5), { roughness: 0.55, envMapIntensity: 0.9 });
    wood.map.repeat.set(1, 0.4);
    [-1].forEach((side) => {
      const bx = side * (FW / 2 - 0.75);
      const L = 1.6, Hs = 0.44, r = 0.16, t = 0.035, w = 0.42;
      const path = new THREE.CurvePath();
      path.add(new THREE.LineCurve3(v3(0, 0, -L / 2 - 0.06), v3(0, Hs - 0.9*r, -L / 2)));                    // a foot, leaning in slightly as it rises
      path.add(new THREE.QuadraticBezierCurve3(v3(0, Hs - r, -L / 2), v3(0, Hs, -L / 2), v3(0, Hs, -L / 2 + r)));
      path.add(new THREE.QuadraticBezierCurve3(v3(0, Hs, -L / 2 + r), v3(0, Hs - 0.02, 0), v3(0, Hs, L / 2 - r)));  // the seat, with a shallow dip in the middle
      path.add(new THREE.QuadraticBezierCurve3(v3(0, Hs, L / 2 - r), v3(0, Hs, L / 2), v3(0, Hs - 0.9*r, L / 2)));
      path.add(new THREE.LineCurve3(v3(0, Hs - r, L / 2), v3(0, 0, L / 2 + 0.06)));
      const section = new THREE.Shape();                                                                 // the slab's cross-section, swept along that line
      section.moveTo(-w / 2, -t / 2); section.lineTo(w / 2, -t / 2); section.lineTo(w / 2, t / 2); section.lineTo(-w / 2, t / 2); section.closePath();
      const geo = new THREE.ExtrudeGeometry(section, { steps: 172, bevelEnabled: false, extrudePath: path });
      const bench = new THREE.Mesh(geo, wood);
      bench.position.set(bx, 0, zc);
      bench.castShadow = bench.receiveShadow = true;
      room.add(bench);
      if (!renderer.shadowMap.enabled) castShadow(pendantAt, [
        { x: bx, y: Hs, z: zc, w, h: t, d: L },
        { x: bx, y: Hs / 2, z: zc - L / 2, w, h: Hs, d: t },
        { x: bx, y: Hs / 2, z: zc + L / 2, w, h: Hs, d: t },
      ], side < 0 ? -FW / 2 : bx - 0.9, side < 0 ? bx + 0.9 : FW / 2, zc - 1.5, zc + 1.5, 0.35, 0.08);
    });

    // a few of the house placeholders hang here permanently: one over each bench,
    // one either side of the stair. They're furniture, not part of the show, so they aren't in the tour.
    // A manifest "foyer.works" entry overrides a slot by position; anything left unspecified keeps
    // the house placeholder, so a partial override (say, just the two over the bench) works fine
    const houseDecor = placeholders();
    // decor[0]: over the bench, decor[1]: the wall opposite it (skipped if a sculpture stands there),
    // decor[2]/[3]: either side of the stair, decor[4]: the stair landing, facing back down the first
    // flight. A manifest "foyer.works" entry overrides a slot by position; anything left unspecified
    // keeps the house placeholder
    const houseSlots = [houseDecor[4], houseDecor[7], houseDecor[0], houseDecor[1], houseDecor[2]];
    const decor = houseSlots.map((d, i) => (foyerSpec && foyerSpec.works[i]) || d);
    const hang = (i, size, x, z, normal, yaw, y) => {
      const w = makeWork(Object.assign({ size }, decor[i]), v3(x, y != null ? y : 1.55, z), normal, yaw, -1);
      w.pool.visible = false;
    };
    // a sculpture, mirroring the bench on the room's other side; also furniture, not part of the tour,
    // but still labelled if the manifest gives it a title or caption
    const foyerSculptures = (foyerSpec && foyerSpec.sculptures) || [];
    hang(0, 1.1, -FW / 2, zc, v3(1, 0, 0), Math.PI / 2);         // the pale square over one bench
    if (!foyerSculptures.length) hang(1, 1.1, FW / 2, zc, v3(-1, 0, 0), -Math.PI / 2);  // the dark moon over the other, unless a sculpture now stands in front of it
    hang(2, 0.9, -(sw / 2 + segW / 2), z1, v3(0, 0, -1), Math.PI);
    hang(3, 0.9, sw / 2 + segW / 2, z1, v3(0, 0, -1), Math.PI);
    // on the back wall of the landing, at the landing's own (elevated) floor height, facing anyone
    // still climbing the first flight
    hang(4, 0.9, 0, zBack, v3(0, 0, -1), Math.PI, topA + 1.5);

    foyerSculptures.forEach((sd, i) => {
      sculpture(sd, { index: -1 }, FW / 2 - 0.75, zc + (i - (foyerSculptures.length - 1) / 2) * 3.4, FH);
    });
  }

  // two posts and a rope across the doorway
  function buildBarrier(z) {
    const metal = matte(COLORS.metal, null, { metalness: 0.9, roughness: 0.3 });
    const rope = matte(COLORS.rope, null, { roughness: 0.95 });
    const xs = [-CONFIG.door.width / 2 - 0.25, CONFIG.door.width / 2 + 0.25];
    xs.forEach((x) => {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.95, 18), metal);
      post.position.set(x, 0.475, z);
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.17, 0.025, 28), metal);
      base.position.set(x, 0.0125, z);
      const knob = new THREE.Mesh(new THREE.SphereGeometry(0.034, 18, 14), metal);
      knob.position.set(x, 0.96, z);
      post.castShadow = base.castShadow = knob.castShadow = true;
      room.add(post, base, knob);
      groundShadow(0.34, 0.34, 0.1, 0.4, x, z, true);
    });
    const curve = new THREE.QuadraticBezierCurve3(v3(xs[0], 0.9, z), v3(0, 0.52, z), v3(xs[1], 0.9, z));
    const cord = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.016, 10, false), rope);
    cord.castShadow = true;
    room.add(cord);
  }

  // ceiling track above each wall, with one spot head aimed at each picture
  function buildTracks(walls, W, D, roomWorks) {
    const H = CONFIG.wallHeight;
    const fixture = matte(COLORS.fixture, null, { roughness: 0.45, emissive: col(COLORS.fixture), emissiveIntensity: 0.55 });
    const headGeo = new THREE.CylinderGeometry(0.05, 0.04, 0.16, 16);
    headGeo.rotateX(Math.PI / 2);
    const lensGeo = new THREE.CircleGeometry(0.042, 20);
    const lensMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(4.5, 4.0, 3.2) });
    const inset = 1.3, railW = 0.05;
    walls.forEach((wall) => {
      const len = (wall.key === 'back' || wall.key === 'front') ? W : D;
      const centre = wall.at(0).addScaledVector(wall.normal, inset);
      const rail = box(len - 2 * inset + railW, 0.03, railW, fixture, centre.x, H - 0.015, centre.z);
      rail.rotation.y = wall.yaw;
    });
    roomWorks.forEach((w) => {
      const p = w.group.position.clone().addScaledVector(w.normal, inset);
      const stem = box(0.012, 0.1, 0.012, fixture, p.x, H - 0.08, p.z);
      const head = new THREE.Mesh(headGeo, fixture);
      head.position.set(p.x, H - 0.18, p.z);
      head.lookAt(w.group.position);
      const lens = new THREE.Mesh(lensGeo, lensMat);
      lens.position.z = 0.081;
      head.add(lens);
      room.add(head);
      w.fixtures = [stem, head];
    });
  }

  // how a picture is framed. Per work in the manifest: "frame": float | thin | wide | canvas | none,
  // "mount": metres of mount around the picture inside the frame, "frameColor": black | white | oak | walnut | grey | any hex.
  // The same keys at the top of the manifest or on a room set the defaults.
  const FRAME_COLORS = { black: '#1f1c19', white: '#efebe4', oak: '#a8895f', walnut: '#5a4534', grey: '#8a8580' };
  const frameMats = {};
  // oak and walnut carry grain, running along each bar; the others are painted
  const frameMat = (c, vertical) => {
    const hex = FRAME_COLORS[c] || c || COLORS.frame;
    const woody = c === 'oak' || c === 'walnut';
    const key = hex + (woody ? (vertical ? '|v' : '|h') : '');
    if (frameMats[key]) return frameMats[key];
    let map = null;
    if (woody) {
      map = woodMap(4.8, 1.2);
      map.repeat.set(0.4, 0.05);                        // a long run of grain along the bar, a sliver of one board across it
      map.offset.set(Math.random() * 0.5, 0.3 + Math.random() * 0.4);
      if (vertical) { map.center.set(0.5, 0.5); map.rotation = Math.PI / 2; }
    }
    return (frameMats[key] = matte(hex, map, { roughness: woody ? 0.5 : 0.45 }));
  };
  const frameBits = () => frameMats.__bits || (frameMats.__bits = {
    mount: matte('#f3f0ea', null, { roughness: 0.95 }),
    backing: matte('#cfc9be', null, { roughness: 0.9 }),
    edge: matte('#3a3632', null, { roughness: 0.9 }),
  });

  function dressFrame(w) {
    const style = w.data.frame || 'float', mount = Math.max(0, +w.data.mount || 0), mat = frameMat(w.data.frameColor), matV = frameMat(w.data.frameColor, true), bits = frameBits();
    const g = w.frame;
    while (g.children.length) { const c = g.children.pop(); c.geometry.dispose(); }
    const add = (geo, m, x, y, z, noShadow) => {
      const mesh = new THREE.Mesh(geo, m);
      mesh.position.set(x, y, z);
      mesh.castShadow = !noShadow;
      g.add(mesh);
    };
    let outerW = w.w, outerH = w.h, imgZ;
    if (style === 'none') {
      imgZ = 0.006;                                                       // a print pinned to the wall
    } else if (style === 'canvas') {
      add(new THREE.BoxGeometry(w.w, w.h, 0.035), bits.edge, 0, 0, 0.0175);   // a stretched canvas, dark at the edges
      imgZ = 0.036;
    } else if (style === 'float') {
      const f = 0.03;
      outerW = w.w + 2 * f; outerH = w.h + 2 * f;
      add(new THREE.BoxGeometry(outerW, outerH, 0.04), mat, 0, 0, 0.04);      // a slab the picture floats on
      imgZ = 0.061;
    } else {
      const wide = style === 'wide';
      const fw = wide ? 0.07 : 0.025, fd = wide ? 0.045 : 0.032, inset = 0.012;
      const iw = w.w + 2 * mount, ih = w.h + 2 * mount;                       // inside the rebate
      outerW = iw + 2 * fw; outerH = ih + 2 * fw;
      add(new THREE.BoxGeometry(outerW, fw, fd), mat, 0, ih / 2 + fw / 2, fd / 2);   // four bars of moulding
      add(new THREE.BoxGeometry(outerW, fw, fd), mat, 0, -(ih / 2 + fw / 2), fd / 2);
      add(new THREE.BoxGeometry(fw, ih, fd), matV, -(iw / 2 + fw / 2), 0, fd / 2);
      add(new THREE.BoxGeometry(fw, ih, fd), matV, iw / 2 + fw / 2, 0, fd / 2);
      add(new THREE.BoxGeometry(iw, ih, 0.008), bits.backing, 0, 0, 0.004, true);
      if (mount > 0) add(new THREE.PlaneGeometry(iw, ih), bits.mount, 0, 0, fd - inset - 0.003, true);
      imgZ = fd - inset;
    }
    w.img.position.z = imgZ;
    w.outer = { w: outerW, h: outerH };
    if (w.mirror) {
      w.mirror.frame.clear();
      g.children.forEach((c) => { const m = c.clone(); m.castShadow = false; w.mirror.frame.add(m); });
      w.mirror.img.position.z = imgZ;
    }
  }

  // a sculpture: a glTF/GLB from Blender (or a placeholder form) on a plinth, lit by its own spot,
  // labelled on the plinth, captioned like a picture and visited by the tour. Sits where it is put;
  // the ghosts leave it alone.
  const gltfLoader = THREE.GLTFLoader ? new THREE.GLTFLoader() : null;
  // the figure-eight immersion of a Klein bottle — built directly from its parametric equations,
  // since ParametricGeometry is an examples/addon, not part of core three.js, and isn't loaded here
  function kleinBottleGeometry(segsU, segsV) {
    const positions = [], indices = [];
    for (let i = 0; i <= segsU; i++) {
      const u = (i / segsU) * Math.PI * 2;
      for (let j = 0; j <= segsV; j++) {
        const v = (j / segsV) * Math.PI * 2;
        const half = u / 2;
        const r = 2 + Math.cos(half) * Math.sin(v) - Math.sin(half) * Math.sin(2 * v);
        positions.push(r * Math.cos(u), r * Math.sin(u), Math.sin(half) * Math.sin(v) + Math.cos(half) * Math.sin(2 * v));
      }
    }
    for (let i = 0; i < segsU; i++) {
      for (let j = 0; j < segsV; j++) {
        const a = i * (segsV + 1) + j, b = a + segsV + 1, c = a + 1, d = b + 1;
        indices.push(a, b, c, b, d, c);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }
  function sculpture(data, rm, x, z, ceilH) {
    ceilH = ceilH || CONFIG.wallHeight;
    const size = data.size || 0.7, plinthH = data.plinth != null ? data.plinth : 1.0, turn = (data.turn || 0) * Math.PI / 180;
    const centreY = plinthH + size / 2;
    const group = new THREE.Group();
    group.position.set(x, centreY, z);
    room.add(group);
    const plinthMat = matte(data.plinthColor || '#e9e5dd', null, { roughness: 0.85 });
    const pw = data.plinthWidth || 0.5;
    const plinth = new THREE.Mesh(new THREE.BoxGeometry(pw, plinthH, pw), plinthMat);
    plinth.position.y = -centreY + plinthH / 2;
    plinth.castShadow = plinth.receiveShadow = true;
    group.add(plinth);
    groundShadow(pw, pw, 0.12, 0.35, x, z);
    blocks.push({ x0: x - pw / 2, x1: x + pw / 2, z0: z - pw / 2, z1: z + pw / 2 });
    // an invisible box the size of the sculpture, so it can be clicked
    const pick = new THREE.Mesh(new THREE.BoxGeometry(size, size, size), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
    group.add(pick);
    const w = { data, group, img: pick, normal: v3(0, 0, 1), yaw: 0, index: works.length, room: rm.index, sculpture: true, w: size, h: size, size,
      pool: { material: { opacity: 0 }, visible: false, scale: new THREE.Vector3() }, shadow: { material: { opacity: 1, map: null } } };
    if (CONFIG.wallLabels && (data.title || data.caption || metaLine(data))) {
      const label = labelCard(data);
      label.position.set(0, -centreY + plinthH - 0.1 - label.userData.height / 2, pw / 2 + 0.004);
      group.add(label);
      w.label = label;
    }
    // the model: normalised so its longest side is `size`, standing on the plinth, turned as asked
    const seat = (obj) => {
      const box = new THREE.Box3().setFromObject(obj);
      const dims = box.getSize(new THREE.Vector3()), k = size / Math.max(dims.x, dims.y, dims.z);
      obj.scale.multiplyScalar(k);
      const box2 = new THREE.Box3().setFromObject(obj), c = box2.getCenter(new THREE.Vector3());
      obj.position.sub(new THREE.Vector3(c.x, box2.min.y, c.z)).add(new THREE.Vector3(0, -centreY + plinthH, 0));
      obj.rotation.y = turn;
      obj.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach((m) => { if (m.isMeshStandardMaterial) daylit.push({ mat: m, base: m.envMapIntensity }); }); } });
      group.add(obj);
      const h = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3()).y;
      w.h = h; w.w = Math.max(dims.x, dims.z) * k;
    };
    const stone = () => new THREE.Mesh(kleinBottleGeometry(96, 24), matte(data.color || '#b9b2a6', null, { roughness: 0.65, side: THREE.DoubleSide }));
    if (data.src && gltfLoader) {
      pendingTextures++;
      gltfLoader.load(data.src, (gltf) => { pendingTextures--; seat(gltf.scene); renderer.shadowMap.needsUpdate = true; }, undefined, () => {
        pendingTextures--;
        console.warn('could not load ' + data.src);
        missing.push(data.src);
        const s = stone(); s.material.color.set(col('#8a8378'));
        seat(s);
        showNote(missing.length + (missing.length === 1 ? ' item' : ' items') + ' could not be loaded. check the paths in the manifest: ' + missing.slice(0, 3).join(', ') + (missing.length > 3 ? ', ...' : ''));
      });
    } else {
      if (data.src) showNote('the model loader did not load, so ' + data.src + ' is standing in as stone');
      seat(stone());
    }
    // its own spot, hung a little to the door side and aimed at it
    const head = new THREE.Group();
    head.position.set(x, ceilH, z + 0.9);
    const fixture = matte(COLORS.fixture, null, { roughness: 0.45, emissive: col(COLORS.fixture), emissiveIntensity: 0.55 });
    const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.1, 8), fixture); stem.position.y = -0.05; head.add(stem);
    const can = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.04, 0.16, 16), fixture); can.geometry.rotateX(Math.PI / 2); can.position.y = -0.18; head.add(can);
    room.add(head);
    head.updateMatrixWorld(true);
    can.lookAt(new THREE.Vector3(x, centreY, z));
    const light = new THREE.SpotLight(0xfff0da, 1.9, 8, Math.min(0.9, Math.atan2(size * 0.7 + 0.3, ceilH - centreY)), 0.75, 2);
    light.position.copy(head.position).add(new THREE.Vector3(0, -0.2, 0));
    light.target.position.set(x, centreY, z);
    light.castShadow = renderer.shadowMap.enabled;
    light.shadow.mapSize.set(1024, 1024);
    light.shadow.bias = -0.0004;
    light.shadow.normalBias = 0.03;
    light.shadow.camera.near = 0.4; light.shadow.camera.far = 8;
    room.add(light, light.target);
    return w;
  }

  function setDims(w, aspect) {
    const size = w.size;
    w.w = aspect >= 1 ? size : size * aspect;
    w.h = aspect >= 1 ? size / aspect : size;
    const m = 0.2;
    w.img.scale.set(w.w, w.h, 1);
    dressFrame(w);
    w.pool.scale.set(Math.max(w.w, w.h) * 2.4, Math.max(w.w, w.h) * 2.6, 1);
    spots.forEach((sp) => { if (sp.work === w) { aimSpot(sp.light, w); renderer.shadowMap.needsUpdate = true; } });   // a spot already on it widens or narrows with it
    if (w.shadow.material.map) w.shadow.material.map.dispose();
    w.shadow.material.map = frameShadow(w.outer.w, w.outer.h, m);
    w.shadow.material.needsUpdate = true;
    w.shadow.scale.set(w.outer.w + 2 * m, w.outer.h + 2 * m, 1);
    if (w.label) w.label.position.set(w.outer.w / 2 + 0.1 + 0.15, -w.label.userData.height / 2, 0.004);
    if (w.mirror) w.mirror.img.scale.copy(w.img.scale);
  }

  function makeWork(data, pos, normal, yaw, index) {
    const group = new THREE.Group();
    group.position.copy(pos);
    group.rotation.y = yaw;

    const pool = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ map: poolTex, transparent: true, depthWrite: false, opacity: CONFIG.spot, toneMapped: false }));
    pool.position.set(0, 0.45, 0.006);
    pool.renderOrder = 1;
    group.add(pool);

    const shadow = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false, toneMapped: false }));
    shadow.position.set(0, -0.01, 0.01);
    shadow.renderOrder = 2;
    group.add(shadow);

    const frame = new THREE.Group();   // filled in by dressFrame once the picture's size is known
    group.add(frame);

    const mat = new THREE.MeshBasicMaterial({ color: col(COLORS.placeholder), toneMapped: false });
    const img = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    img.position.z = 0.061;
    img.castShadow = true;
    group.add(img);

    const w = { data, group, img, frame, pool, shadow, normal, yaw, index, size: data.size || CONFIG.workSize, w: 1, h: 1 };

    if (CONFIG.wallLabels && index >= 0 && (data.title || data.caption || metaLine(data))) {
      w.label = labelCard(data);
      group.add(w.label);
    }
    if (CONFIG.floorReflection > 0 && index >= 0) {
      // the picture's reflection: a copy hung upside down beneath the floor, seen through it
      const mg = new THREE.Group();
      mg.position.set(pos.x, -pos.y, pos.z);
      mg.rotation.y = yaw;
      mg.scale.y = -1;
      // (three.js notices the flipped scale and keeps the faces the right way out, so the materials stay single-sided)
      const mf = new THREE.Group();
      const mi = new THREE.Mesh(img.geometry, new THREE.MeshBasicMaterial({ color: col(COLORS.placeholder), toneMapped: false }));
      mi.position.z = 0.061;
      mg.add(mf, mi);
      room.add(mg);
      w.mirror = { group: mg, img: mi, frame: mf };
    }
    setDims(w, data.aspect || 1);   // if the manifest gives the true ratio, the frame never has to resize once the image lands
    if (!data.aspect) {
      probePngAspect(data.src).then((aspect) => {
        if (aspect) setDims(w, aspect);   // safe even if the real image already loaded and set the same thing
      });
    }

    pendingTextures++;
    loadTexture(data.src, (tex) => {
      pendingTextures--;
      mat.map = tex;
      if (behindCurtain) {
        mat.color.copy(fadeToCol);           // hidden behind the curtain — arrives fully formed, nothing to fade for
      } else {
        mat.color.copy(fadeFromCol);
        w.fadeIn = 0;                        // gains its true colour over the next moment, rather than snapping in
        fadingWorks.push(w);
      }
      mat.needsUpdate = true;
      if (w.mirror) {
        w.mirror.img.material.map = tex;
        w.mirror.img.material.color.copy(behindCurtain ? fadeToCol : fadeFromCol);
        w.mirror.img.material.needsUpdate = true;
      }
      setDims(w, tex.image.width / tex.image.height);
    }, undefined, () => {
      pendingTextures--;
      console.warn('could not load ' + data.src);
      missing.push(data.src);
      const tex = labelTexture('could not load', data.src);
      mat.map = tex;
      mat.color.set(0xffffff);
      mat.needsUpdate = true;
      setDims(w, 0.8);
      showNote(missing.length + (missing.length === 1 ? ' picture' : ' pictures') + ' could not be loaded. check the paths in the manifest, and that the files are beside it: ' + missing.slice(0, 3).join(', ') + (missing.length > 3 ? ', ...' : ''));
    });

    room.add(group);
    return w;
  }

  function build(roomSpecs, title, subtitle, intro, note) {
    if (room) disposeGroup(room);
    room = new THREE.Group();
    scene.add(room);
    daylit.length = 0;
    skyMats.length = 0;
    Object.keys(frameMats).forEach((k) => delete frameMats[k]);
    spots.forEach((s) => { s.work = null; s.weight = 0; s.light.intensity = 0; });
    works = [];
    dictates = [];
    textures.clear();
    rooms = [];
    doorways = [];
    blocks = [];
    missing = [];
    current = -1;
    arrived = -1;
    currentRoom = 0;
    focus = null;
    closeFlat();
    setCaption(null);
    ui.title.textContent = title || CONFIG.title;
    ui.subtitle.textContent = subtitle || '';
    ui.roomTitle.textContent = '';
    document.title = ui.title.textContent;
    scene.background = col(COLORS.wall);
    scene.fog.color = col(COLORS.wall);

    const S = CONFIG.spacing;
    const base = Object.assign({}, COLORS);
    let nextX = 0;
    roomSpecs.forEach((spec, ri) => {
      Object.assign(COLORS, base, spec.colors || {});
      const list = spec.works;
      const first = ri === 0, last = ri === roomSpecs.length - 1;

      // a picture that names its wall goes there; the rest are dealt so the sides take twice
      // as many as the ends and the room reads as a hall
      // the entrance wall keeps its wall text company only when a picture asks for it by name
      const deal = first && (intro || note) ? ['back', 'left', 'right', 'left', 'right'] : ['back', 'left', 'right', 'front', 'left', 'right'];
      const counts = { back: 0, right: 0, front: 0, left: 0 };
      const onWall = { back: [], right: [], front: [], left: [] };
      let dealt = 0;
      list.forEach((d, i) => {
        const key = Object.keys(counts).includes(d.wall) ? d.wall : deal[dealt++ % deal.length];
        counts[key]++;
        onWall[key].push(i);
      });

      // walls with a doorway hang their pictures either side of it
      // pictures either side of a doorway start just clear of its frame, unless wall text is there,
      // in which case they start beyond the text. On the front wall the text side is negative t
      // (left of the door as you face it), the note's side positive
      const gapPlain = CONFIG.door.width / 2 + 0.05, gapText = CONFIG.door.width / 2 + 1.1;
      const split = (n, gapA, gapB) => {
        const b = Math.ceil(n / 2), a = n - b, slots = [];   // an odd one out goes to the positive side
        for (let i = 0; i < a; i++) slots.push(-(gapA + S * (i + 0.5)));
        for (let i = 0; i < b; i++) slots.push(gapB + S * (i + 0.5));
        slots.sort((p, q) => p - q);
        return { slots, len: n ? 2 * Math.max(gapA + S * a, gapB + S * b) + 1.5 : 0 };
      };
      const plain = (n) => ({ slots: Array.from({ length: n }, (_, i) => (i - (n - 1) / 2) * S), len: n * S + 3 });
      const front = first ? split(counts.front, intro ? gapText : gapPlain, note ? gapText : gapPlain) : plain(counts.front);
      const left = ri > 0 ? split(counts.left, gapPlain, gapPlain) : plain(counts.left);
      const right = last ? plain(counts.right) : split(counts.right, gapPlain, gapPlain);
      const back = plain(counts.back);
      const roomFloor = (last && !list.length) ? CONFIG.emptyRoomSize : 9;
      const W = Math.max(roomFloor, back.len, front.len);
      const sculpt = spec.sculptures || [];
      const D = Math.max(roomFloor, left.len, right.len, sculpt.length ? sculpt.length * 3.4 + 4 : 0);
      const cx = first ? 0 : nextX + W / 2;
      nextX = cx + W / 2;
      const rm = { index: ri, cx, W, D, x0: cx - W / 2, x1: cx + W / 2, z0: -D / 2, z1: D / 2, frontInset: first ? 0.7 : 0.55, title: spec.title || '', works: [] };
      rooms.push(rm);
      if (!last) doorways.push({ x: rm.x1, z: 0, w: CONFIG.door.width });

      originX = cx;
      buildShell(W, D, { doorLeft: ri > 0, doorRight: !last, foyer: first, smallDoor: !!(secret && last),
        skylight: spec.skylight === false || Math.min(W, D) < 4.5 ? false : true });
      if (first && intro) {
        const panel = wallText(title || CONFIG.title, subtitle, intro, 1.3);
        panel.position.set(CONFIG.door.width / 2 + 0.3 + 0.65, 2.4 - panel.userData.height / 2, D / 2 - 0.006);
        panel.rotation.y = Math.PI;
        room.add(panel);
      }
      // a second panel, mirrored on the far side of the door, for a note that isn't the main intro (e.g. on the makers)
      if (first && note) {
        const notePanel = wallText('', 'the collective', note, 1.3);
        notePanel.position.set(-(CONFIG.door.width / 2 + 0.3 + 0.65), 2.4 - notePanel.userData.height / 2, D / 2 - 0.006);
        notePanel.rotation.y = Math.PI;
        room.add(notePanel);
      }
      originX = 0;

      // clockwise tour: back wall left to right, then right, front, left
      const walls = [
        { key: 'back', slots: back.slots, at: (t) => v3(cx + t, 0, -D / 2), normal: v3(0, 0, 1), yaw: 0 },
        { key: 'right', slots: right.slots, at: (t) => v3(cx + W / 2, 0, t), normal: v3(-1, 0, 0), yaw: -Math.PI / 2 },
        { key: 'front', slots: front.slots, at: (t) => v3(cx - t, 0, D / 2), normal: v3(0, 0, -1), yaw: Math.PI },
        { key: 'left', slots: left.slots, at: (t) => v3(cx - W / 2, 0, -t), normal: v3(1, 0, 0), yaw: Math.PI / 2 },
      ];
      walls.forEach((wall) => {
        onWall[wall.key].forEach((j, i) => {
          const p = wall.at(wall.slots[i]);
          p.y = CONFIG.hangHeight;
          const w = makeWork(list[j], p, wall.normal, wall.yaw, works.length);
          w.room = ri;
          works.push(w);
          rm.works.push(w);
        });
      });
      if (rm.works.length) buildTracks(walls, W, D, rm.works);
      rm.slots = rm.works.map((w) => ({ pos: w.group.position.clone(), normal: w.normal.clone(), yaw: w.yaw }));
      rm.occupants = rm.works.slice();
      // sculptures stand down the middle of the room unless the manifest places them
      sculpt.forEach((sd, i) => {
        const at = sd.at || [0, (i - (sculpt.length - 1) / 2) * 3.4];
        works.push(sculpture(sd, rm, cx + at[0], at[1]));
      });
    });
    Object.assign(COLORS, base);

    const x0 = rooms[0].x0, x1 = rooms[rooms.length - 1].x1 + (secret ? secret.corridor.length + 3 : 0), maxD = Math.max.apply(null, rooms.map((r) => r.D));   // the sun's shadow must cover the corridor too, or it would light it through the roof
    buildSky(x0, x1, maxD);
    placeSun(x0, x1, maxD);
    renderer.shadowMap.needsUpdate = true;

    pos.set(0, CONFIG.eyeHeight, Math.min(rooms[0].z1 - rooms[0].frontInset, -rooms[0].D / 2 + 6.5));
    for (let tries = 0; tries < 20 && !canStand(pos.x, pos.z); tries++) pos.x += 0.4;   // step aside from a plinth on the spawn point
    yaw = 0; pitch = 0;
    ui.pager.classList.toggle('hidden', works.length < 2);
    showRoomTitle();
    nameWorks();
    applyHash(false);
    if (!opened) reveal();
    ghostTimer = 4;
    ghostMoves = 0;
  }

  // the first time in: hold a curtain in the wall's colour until the pictures are on the walls, then
  // lift it slowly while the camera takes a step into the room
  let opened = false;
  function reveal() {
    opened = true;
    ui.curtain.style.background = COLORS.wall;
    ui.curtainTitle.textContent = ui.title.textContent;
    const started = performance.now();
    const totalToLoad = pendingTextures;   // everything the manifest asked for is already in flight by now
    const drift = !reducedMotion && !focus;
    if (drift) {
      const to = pos.clone();
      pos.x += Math.sin(yaw) * 0.7;   // a step back along the line of sight
      pos.z += Math.cos(yaw) * 0.7;
      focus = { legs: [{ fromPos: pos.clone(), toPos: to, fromYaw: yaw, toYaw: yaw, fromPitch: pitch - 0.04, toPitch: pitch, t: 0, dur: 2.6 }], leg: 0 };
    }
    // waits for every picture (and model) queued at build time, not just whatever's still pending after
    // a fixed window, so nothing is left to pop or fade in once the curtain's actually gone; a generous
    // cap is kept only as a safety net against a request that never resolves at all
    const tryLift = () => {
      const waited = performance.now() - started;
      if (pendingTextures > 0 && waited < 120000) {
        if (waited > 700) { ui.curtainTitle.classList.add('show'); ui.curtainBar.classList.add('show'); }
        if (totalToLoad > 0) ui.curtainFill.style.width = Math.min(100, 100 * (totalToLoad - pendingTextures) / totalToLoad) + '%';
        setTimeout(tryLift, 100);
        return;
      }
      ui.curtainFill.style.width = '100%';
      behindCurtain = false;
      ui.curtain.classList.add('gone');
      setTimeout(() => ui.curtain.remove(), 1800);
    };
    setTimeout(tryLift, 250);
  }

  /* ------------------------------- live lighting --------------------------------- */
  // A handful of real spotlights, with shadow maps, follow the viewer: they land on the
  // nearest pictures, spilling light onto the floor and throwing true shadows, while the
  // painted pools on the rest of the room fade out under them and back in as they leave.
  const SUN_INTENSITY = renderer.shadowMap.enabled ? 0.75 : 0; // without shadows it would light the whole floor through the roof
  const sun = new THREE.DirectionalLight(0xfff2dc, SUN_INTENSITY);
  sun.castShadow = renderer.shadowMap.enabled;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0003;
  sun.shadow.normalBias = 0.02;
  scene.add(sun, sun.target);
  function placeSun(x0, x1, maxD) {
    const dir = new THREE.Vector3(0.32, 1, 0.2).normalize();
    const mid = (x0 + x1) / 2;
    // far enough out that no ceiling in a long run of rooms is ever behind the shadow camera
    sun.position.copy(dir).multiplyScalar(80).add(new THREE.Vector3(mid, 0, 0));
    sun.target.position.set(mid, 0, 0);
    sun.target.updateMatrixWorld();
    const c = sun.shadow.camera, r = Math.hypot(x1 - x0, maxD) * 0.6 + 4;
    c.left = -r; c.right = r; c.top = r; c.bottom = -r; c.near = 1; c.far = 160;
    c.updateProjectionMatrix();
    const size = r > 18 ? 4096 : 2048;
    if (sun.shadow.mapSize.x !== size) {
      sun.shadow.mapSize.set(size, size);
      if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
    }
  }

  const SPOT_INTENSITY = 2.3;
  // a spot's cone opens or narrows to suit the picture it is on: the pool it throws is always about
  // a fifth wider than the picture's longest side, whatever that is
  function aimSpot(light, w) {
    const head = w.group.position.clone().addScaledVector(w.normal, 1.3);
    head.y = CONFIG.wallHeight - 0.2;
    const throwLen = head.distanceTo(w.group.position);
    const half = Math.max(w.w, w.h) * 0.6 + 0.35;
    light.angle = Math.min(1.0, Math.max(0.25, Math.atan2(half, throwLen)));
    light.penumbra = 0.8;
  }
  const spots = [];
  for (let i = 0; i < (coarsePointer ? 3 : CONFIG.liveSpots); i++) {
    const light = new THREE.SpotLight(0xfff0da, 0, 9, 0.5, 0.8, 2);
    light.castShadow = !coarsePointer;
    light.shadow.mapSize.set(1024, 1024);
    light.shadow.bias = -0.0004;
    light.shadow.normalBias = 0.03;
    light.shadow.camera.near = 0.4;
    light.shadow.camera.far = 9;
    scene.add(light, light.target);
    spots.push({ light, work: null, wanted: false, weight: 0 });
  }
  let spotTimer = 0;

  function assignSpots() {
    const near = works.filter((w) => !w.sculpture).map((w) => ({ w, d: w.group.position.distanceTo(pos) + (w.room === currentRoom ? 0 : 20) }))
      .filter((e) => e.d < 36).sort((a, b) => a.d - b.d).slice(0, spots.length).map((e) => e.w);
    spots.forEach((s) => { s.wanted = !!s.work && near.includes(s.work); });
    let moved = false;
    near.forEach((w) => {
      if (spots.some((s) => s.work === w)) return;
      const free = spots.find((s) => !s.work);
      if (!free) return;
      const head = w.group.position.clone().addScaledVector(w.normal, 1.3);
      free.light.position.set(head.x, CONFIG.wallHeight - 0.2, head.z);
      free.light.target.position.copy(w.group.position).add(new THREE.Vector3(0, 0.25, 0));
      free.light.target.updateMatrixWorld();
      aimSpot(free.light, w);
      free.work = w;
      free.wanted = true;
      moved = true;
    });
    if (moved) renderer.shadowMap.needsUpdate = true;
  }

  function updateLighting(dt, t) {
    spotTimer += dt;
    if (spotTimer > 0.25) { spotTimer = 0; assignSpots(); }
    spots.forEach((s) => {
      if (!s.work) return;
      const target = s.wanted ? 1 : 0;
      s.weight += (target - s.weight) * Math.min(1, dt * 3.5);
      s.light.intensity = SPOT_INTENSITY * s.weight;
      s.work.pool.material.opacity = CONFIG.spot * (1 - s.weight);
      s.work.shadow.material.opacity = 1 - 0.75 * s.weight;
      if (!s.wanted && s.weight < 0.02) {
        s.light.intensity = 0;
        s.work.pool.material.opacity = CONFIG.spot;
        s.work.shadow.material.opacity = 1;
        s.work = null;
      }
    });
    // clouds drifting over the skylight, and their light crossing the room: sample the same density
    // field the shader draws, along the path from here up through the actual cloud layer toward the
    // sun, so the room dims exactly when — not merely around when — a cloud sits in front of the sun
    const t0cloud = (CLOUD_BASE - pos.y) / sunDirCPU.y, t1cloud = (CLOUD_TOP - pos.y) / sunDirCPU.y;
    const cloudStep = (t1cloud - t0cloud) / 6;
    let ld = 0;
    for (let i = 0; i < 6; i++) {
      const tt = t0cloud + cloudStep * (i + 0.5);
      ld += cloudShapeAt(pos.x + sunDirCPU.x * tt, pos.y + sunDirCPU.y * tt, pos.z + sunDirCPU.z * tt, t);
    }
    const sunSeen = Math.exp(-ld * cloudStep * 0.014 * CONFIG.cloudHeaviness);
    const targetK = 1 - CONFIG.daylightDrift * (1 - sunSeen);
    sunK += (targetK - sunK) * Math.min(1, dt * 2);
    const k = sunK;
    daylit.forEach((e) => { e.mat.envMapIntensity = e.base * k; });
    sun.intensity = SUN_INTENSITY * k;
    skyMats.forEach((e) => { e.mat.color.copy(e.base).multiplyScalar(k); });
    skyMat.uniforms.time.value = t;
    skyMat.uniforms.daylight.value = k;
  }

  /* --------------------------------- movement ------------------------------------ */
  const pos = new THREE.Vector3(0, CONFIG.eyeHeight, 3);
  let yaw = 0, pitch = 0;
  let focus = null;    // in-flight camera move toward a picture
  let current = -1;    // index of the captioned picture
  let arrived = -1;    // the picture the camera has glided to and not moved from since
  let flatOpen = false;
  let locked = false;  // pointer captured for mouse-look
  const keys = new Set();
  const stick = { x: 0, y: 0 };
  const scratch = new THREE.Vector3();

  /* ----------------------------------- ghosts ------------------------------------ */
  // 鬼打墙: the building rearranges itself behind your back, in two ways. Within a room, two pictures
  // that are out of your sight change places. And two whole rooms can trade their contents, when
  // nothing in either is in view: you look up at the skylight, or at a bare stretch of wall, or the
  // large view is covering the screen, and when you look again you are standing in the other room.
  // Nothing ever moves in front of you; you only find that what you remember is no longer where it was.
  let ghost = false, ghostTimer = 3, ghostMoves = 0;
  const seen = new THREE.Vector3();
  function inView(w) {
    const d = seen.copy(w.group.position).sub(pos);
    if (-d.x * Math.sin(yaw) - d.z * Math.cos(yaw) < 0) return false;       // behind you
    const p = w.group.position.clone().project(camera);
    return Math.abs(p.x) < 1.45 && Math.abs(p.y) < 1.45;                    // a margin beyond the frame, so nothing pops at its edge
  }
  const unseen = (w) => flatOpen || !inView(w);
  // every room remembers its hooks; a picture is hung on one by index
  function place(w, r, i) {
    const slot = rooms[r].slots[i];
    w.group.position.copy(slot.pos);
    w.normal = slot.normal;
    w.yaw = slot.yaw;
    w.room = r;
    w.group.rotation.y = w.yaw;
    if (w.mirror) { w.mirror.group.position.set(slot.pos.x, -slot.pos.y, slot.pos.z); w.mirror.group.rotation.y = w.yaw; }
  }
  function afterMove(movedWorks) {
    spots.forEach((sp) => {                                                  // a live spot follows its picture
      if (!movedWorks.includes(sp.work)) return;
      const head = sp.work.group.position.clone().addScaledVector(sp.work.normal, 1.3);
      sp.light.position.set(head.x, CONFIG.wallHeight - 0.2, head.z);
      sp.light.target.position.copy(sp.work.group.position).add(new THREE.Vector3(0, 0.25, 0));
      sp.light.target.updateMatrixWorld();
      aimSpot(sp.light, sp.work);
    });
    renderer.shadowMap.needsUpdate = true;                                   // their shadows go with them
    if (current >= 0 && movedWorks.includes(works[current]) && !inView(works[current])) { current = -1; setCaption(null); }
    if (arrived >= 0 && movedWorks.includes(works[arrived])) arrived = -1;
    ghostMoves++;
  }
  function swapPictures() {
    const candidates = rooms.filter((r) => r.occupants.filter((w) => w !== works[current] && unseen(w)).length >= 2);
    if (!candidates.length) return false;
    const r = candidates[Math.floor(Math.random() * candidates.length)];
    const pool = r.occupants.map((w, i) => ({ w, i })).filter((e) => e.w !== works[current] && unseen(e.w));
    const a = pool[Math.floor(Math.random() * pool.length)], b = pool[Math.floor(Math.random() * pool.length)];
    if (a === b) return false;
    r.occupants[a.i] = b.w; r.occupants[b.i] = a.w;
    place(b.w, r.index, a.i); place(a.w, r.index, b.i);
    afterMove([a.w, b.w]);
    return true;
  }
  function swapRooms() {
    const quietRooms = rooms.filter((r) => r.occupants.every(unseen));
    const pairs = [];
    quietRooms.forEach((a, i) => quietRooms.slice(i + 1).forEach((b) => { if (a.occupants.length === b.occupants.length) pairs.push([a, b]); }));
    if (!pairs.length) return false;
    const [a, b] = pairs[Math.floor(Math.random() * pairs.length)];
    const oa = a.occupants, ob = b.occupants;
    a.occupants = ob; b.occupants = oa;
    ob.forEach((w, i) => place(w, a.index, i));
    oa.forEach((w, i) => place(w, b.index, i));
    afterMove(oa.concat(ob));
    return true;
  }
  function haunt(dt) {
    if (!ghost || works.length < 2) return;
    ghostTimer -= dt;
    if (ghostTimer > 0) return;
    ghostTimer = CONFIG.ghostEvery[0] + Math.random() * (CONFIG.ghostEvery[1] - CONFIG.ghostEvery[0]);
    if (rooms.length > 1 && Math.random() < (flatOpen ? 0.6 : 0.35) && swapRooms()) return;
    swapPictures();
  }
  let noteTimer = null;
  function setGhost(on, quiet) {
    ghost = on;
    if (ghost && !/Ghosts: g/.test(ui.help.textContent)) ui.help.textContent += '';   // the key is only advertised in a show that uses it, change '' to '\nGhosts: g'
    if (quiet) return;
    showNote(ghost ? 'ghosts' : 'no ghosts');
    clearTimeout(noteTimer);
    noteTimer = setTimeout(() => { if (!missing.length) ui.note.classList.add('hidden'); }, 2200);
  }

  /* ------------------------------- the small doors ------------------------------- */
  let secret = null;      // { code, door, door2, dictates, corridor: { length, period, loops, repeat, code }, cellEnd }
  let foyerSpec = null;   // optional: { works, sculptures } for the foyer's own decor, from manifest "foyer"
  let crouching = false, eyeH = CONFIG.eyeHeight;
  const doors = () => (secret ? [secret.door, secret.door2].filter(Boolean) : []);
  // the walkable length behind the first door: the corridor, and the cell beyond the second door once it is open
  const inCorridor = (x, z) => {
    // the corridor is there once its door has ever been unlocked; only the doorways themselves depend on the leaves
    if (!secret || !secret.door || !secret.door.unlocked) return false;
    const far = secret.door2 && secret.door2.unlocked ? secret.door2.x + 0.6 : secret.door.x + secret.corridor.length - 0.35;
    return x > secret.door.x - 0.75 && x < far && Math.abs(z - secret.door.z) < 0.22
      && (x > secret.door.x + 0.45 || secret.door.hinge.rotation.y > 1.0)
      && !(secret.door2 && Math.abs(x - secret.door2.x) < 0.45 && secret.door2.hinge.rotation.y <= 1.0);
  };
  // the black room beyond: yours once the second door is unlocked, and tall enough to stand in
  const inBlack = (x, z) => !!(secret && secret.black && secret.door2 && secret.door2.unlocked
    && x > secret.black.x0 + 0.35 && x < secret.black.x1 - 0.35 && Math.abs(z) < secret.black.half - 0.35);
  const stooped = () => eyeH < SMALL.h - 0.15;
  let lockPinned = false;   // the prompt was opened by clicking a door; it stays until you walk off
  let lockDoor = null;      // which door the prompt is for
  function pickDoor(clientX, clientY) {
    ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    return doors().find((d) => raycaster.intersectObject(d.hinge, true).length > 0) || null;
  }
  function askForCode(d) {
    if (locked && document.exitPointerLock) document.exitPointerLock();
    lockDoor = d;
    lockPinned = true;
    ui.lock.classList.remove('hidden');
    ui.lockInput.disabled = false;
    ui.lockInput.value = '';
    ui.lockInput.focus();
  }
  function tryCode(text) {
    const clean = String(text || '').trim().replace(/^#/, '').toLowerCase();
    const d = lockDoor;
    if (!d || d.open) return;
    d.spin = 1;                                                      // the dials turn over
    if (clean && clean === d.code) {
      d.open = true;
      d.unlocked = true;
      ui.lockInput.blur();
      ui.lockInput.disabled = true;
      setTimeout(() => { ui.lock.classList.add('hidden'); ui.lockInput.value = ''; }, 4000);
    } else {
      ui.lock.classList.remove('wrong'); void ui.lock.offsetWidth; ui.lock.classList.add('wrong');
    }
  }
  ui.lockInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { tryCode(ui.lockInput.value); e.preventDefault(); }
    if (e.key === 'Escape') { ui.lockInput.blur(); e.preventDefault(); }
    e.stopPropagation();
  });
  function updateLock() {
    if (!secret || !secret.door) return;
    let near = null;
    doors().forEach((d) => {
      if (d.open || d.unlocked) return;
      const dx = d.x - pos.x, dz = d.z - pos.z, dist = Math.hypot(dx, dz);
      const facing = (-dx * Math.sin(yaw) - dz * Math.cos(yaw)) / (dist || 1);
      if (dist < 2.4 && facing > 0.6 && dx > 0) near = d;                // approached from its own side
    });
    if (lockPinned && lockDoor && (Math.hypot(lockDoor.x - pos.x, lockDoor.z - pos.z) > 6 || lockDoor.open)) lockPinned = false;
    const show = lockPinned ? lockDoor : near;
    if (show && !lockPinned) lockDoor = show;
    const shown = !ui.lock.classList.contains('hidden');
    if (!!show === shown) return;
    ui.lock.classList.toggle('hidden', !show);
    if (show) { ui.lockInput.disabled = false; ui.lockInput.value = ''; } else ui.lockInput.blur();
  }
  // the crab and the sign: dark until the visitor shuts the door behind them, reset the moment
  // they open it again, so the whole thing can be replayed as many times as they like
  function updateReveal(dt) {
    const r = secret && secret.reveal;
    if (!r) return;
    const d = secret.door2;
    const justClosed = r.prevOpen && !d.open;
    r.prevOpen = d.open;
    if (inBlack(pos.x, pos.z) && justClosed) { r.timer = 0; r.revealed = false; }
    else if (d.open) { r.timer = -1; r.revealed = false; }
    if (r.timer >= 0) { r.timer += dt; if (r.timer > 1.2) r.revealed = true; }
    if (r.revealed && !r.sign.visible) { r.crabParts.forEach((m) => { m.visible = true; }); r.sign.visible = true; }
    if (!r.revealed && r.sign.visible && r.light.intensity < 0.01) { r.crabParts.forEach((m) => { m.visible = false; }); r.sign.visible = false; }
    const targetLight = r.revealed ? 1.8 : 0;
    r.light.intensity += (targetLight - r.light.intensity) * Math.min(1, dt * 5);
    const targetOpacity = r.revealed ? 1 : 0;
    r.sign.material.opacity += (targetOpacity - r.sign.material.opacity) * Math.min(1, dt * 6);
  }
  function stepDoor(dt) {
    doors().forEach((d) => {
      const target = d.open ? 1.52 : 0;   // just short of square, so the leaf lies along the corridor wall instead of through it
      const before = d.hinge.rotation.y;
      d.hinge.rotation.y += (target - d.hinge.rotation.y) * Math.min(1, dt * 2.2);
      // the shadow maps are only redrawn on demand, so a moving leaf has to ask: a few times on the way,
      // and once more when it settles, or the sun keeps shining through the doorway as it last saw it
      if (Math.abs(before - d.hinge.rotation.y) > 1e-4) {
        d.shadowDue = (d.shadowDue || 0) - dt;
        if (d.shadowDue <= 0) { renderer.shadowMap.needsUpdate = true; d.shadowDue = 0.3; }
        d.settling = true;
      } else if (d.settling) { d.settling = false; renderer.shadowMap.needsUpdate = true; }
      d.dials.forEach((dl, i) => { dl.rotation.x += dt * (0.12 + i * 0.03); });  // a slow, constant creep — the mechanism never quite settles
      if (d.spin > 0) {                                                  // a tried code sets the dials spinning down, on top of that creep
        const k = d.spin;
        d.dials.forEach((dl, i) => { dl.rotation.x += dt * (6 + i * 1.5) * k; });
        d.spin = Math.max(0, k - dt * 0.9);

    if (secret && inCorridor(pos.x, pos.z)) crouching = true;

  let currentRoom = 0;
  const inset = 0.55;

  const inRoom = (r, x, z) => x > r.x0 + inset && x < r.x1 - inset && z > r.z0 + inset && z < r.z1 - r.frontInset;
  const inDoorway = (d, x, z) => Math.abs(x - d.x) < 0.9 && Math.abs(z - d.z) < d.w / 2 - 0.3;
  const blocked = (x, z) => blocks.some((b) => x > b.x0 - 0.35 && x < b.x1 + 0.35 && z > b.z0 - 0.35 && z < b.z1 + 0.35);
  const canStand = (x, z) => !blocked(x, z) && (rooms.some((r) => inRoom(r, x, z)) || doorways.some((d) => inDoorway(d, x, z)) || (inCorridor(x, z) && stooped()) || inBlack(x, z));
  const roomAt = (x, z) => rooms.findIndex((r) => x >= r.x0 && x <= r.x1 && z >= r.z0 && z <= r.z1);

  function clampToRoom(v, r) {
    v.x = Math.max(r.x0 + inset, Math.min(r.x1 - inset, v.x));
    v.z = Math.max(r.z0 + inset, Math.min(r.z1 - r.frontInset, v.z));

  const unwrap = (target, from) => from + (((target - from + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI);
  function showRoomTitle() {
    if (rooms.length < 2 || !rooms[currentRoom]) { ui.roomTitle.textContent = ''; return; }
    const t = rooms[currentRoom].title;
    // a bare numeral reads as a stray letter on its own, so say what it is
    ui.roomTitle.textContent = !t ? '' + (currentRoom + 1) : /^[ivxlc0-9]{1,5}$/i.test(t) ? '' + t : t;
  }

  function focusOn(i) {
    const w = works[i];
    if (!w) return;
    if (!inCorridor(pos.x, pos.z)) crouching = false;
    const dist = 1.3 + Math.max(w.w, w.h) * 1.15;
    const target = clampToRoom(w.group.position.clone().addScaledVector(w.normal, dist), rooms[w.room]);
    target.y = CONFIG.eyeHeight;
    const toPitch = Math.atan2(w.group.position.y - CONFIG.eyeHeight, dist);
    // if the picture is in another room, go through the doorways between here and there
    const points = [];
    const here = Math.max(0, roomAt(pos.x, pos.z) < 0 ? currentRoom : roomAt(pos.x, pos.z));
    const step = w.room > here ? 1 : -1;
    for (let r = here; r !== w.room; r += step) {
      const d = doorways[Math.min(r, r + step)];
      points.push(v3(d.x, CONFIG.eyeHeight, d.z));
    }
    points.push(target);
    const legs = [];
    let from = pos.clone(), fromYaw = yaw, fromPitch = pitch;
    points.forEach((p, j) => {
      const lastLeg = j === points.length - 1;
      const next = lastLeg ? null : points[j + 1];
      const toYaw = unwrap(lastLeg ? w.yaw : yawToward(next.x - p.x, next.z - p.z), fromYaw);
      const tp = lastLeg ? toPitch : 0;
      const travel = from.distanceTo(p);
      legs.push({ fromPos: from, toPos: p, fromYaw, toYaw, fromPitch, toPitch: tp, t: 0,
        dur: reducedMotion ? 0 : Math.min(3, 0.35 + travel * 0.16 + Math.abs(toYaw - fromYaw) * 0.25) });
      from = p; fromYaw = toYaw; fromPitch = tp;
    });
    focus = { legs, leg: 0 };
    current = i;
    setCaption(w);
    setHash(w.slug);
  }

  function stepFocus(dt) {
    const L = focus.legs[focus.leg];
    L.t += dt;
    const k = L.dur > 0 ? Math.min(1, L.t / L.dur) : 1;
    const mid = focus.leg < focus.legs.length - 1;
    const e = mid ? k : k * k * (3 - 2 * k); // glide straight through doorways, ease into the picture
    pos.lerpVectors(L.fromPos, L.toPos, e);
    yaw = L.fromYaw + (L.toYaw - L.fromYaw) * (mid ? Math.min(1, k * 2) : e);
    pitch = L.fromPitch + (L.toPitch - L.fromPitch) * e;
    if (k >= 1) {
      focus.leg++;
      if (focus.leg >= focus.legs.length) { focus = null; arrived = current; }
    }
  }

  function walk(dt) {
    let mx = 0, mz = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) mz -= 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) mz += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) mx -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) mx += 1;
    mx += stick.x; mz += stick.y;
    const len = Math.hypot(mx, mz);

    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);
    const rx = Math.cos(yaw), rz = -Math.sin(yaw);
    const step = CONFIG.walkSpeed * dt * (crouching ? 0.55 : 1);
    const nx = pos.x + (fx * -mz + rx * mx) * step, nz = pos.z + (fz * -mz + rz * mx) * step;

    else if (canStand(pos.x, nz)) pos.z = nz;

  /* --------------------------------- captions ------------------------------------ */

  function nameWorks() {
    const used = new Set();

      const base = slugify(w.data.id || w.data.title || 'work') || 'work';

  // stand in front of a picture straight away, with no glide (for a link that opens on it)
  function jumpTo(w) {

    pos.set(target.x, CONFIG.eyeHeight, target.z);
    yaw = w.yaw;

    ui.capMeta.textContent = metaLine(w.data);
    ui.capText.textContent = w.data.caption || '';
    ui.count.textContent = w.dictate ? '' : (w.index + 1) + ' of ' + works.length;
    ui.pager.classList.toggle('hidden', !!w.dictate || works.length < 2);
    ui.enlarge.classList.toggle('hidden', !!w.dictate || !!(w.sculpture && !w.data.image));
    ui.caption.classList.remove('hidden');
  }

  function qualifies(w, maxDist, minDot) {
    scratch.copy(w.group.position).sub(pos);

    const d = scratch.length();
    if (d > maxDist) return false;
    scratch.divideScalar(d);
    const dot = -scratch.x * Math.sin(yaw) - scratch.z * Math.cos(yaw);
    return dot >= minDot ? d * (1.6 - dot) : false;

    if (at >= 0 && at !== currentRoom) { currentRoom = at; showRoomTitle(); }
    if (focus) return;
    if (inCorridor(pos.x, pos.z)) {                                          // in the corridor only the dictates speak
      let bestD = null, bestS = Infinity;
      dictates.forEach((w) => { const s = qualifies(w, 2.6, 0.45); if (s !== false && s < bestS) { bestS = s; bestD = w; } });
      if (bestD !== shownDictate) { shownDictate = bestD; current = -1; setCaption(bestD); }
      return;

    if (shownDictate) { shownDictate = null; setCaption(null); }
    if (current >= 0 && qualifies(works[current], 5, 0.55) !== false) return;
    let best = -1, bestScore = Infinity;
    works.forEach((w) => {

      const s = qualifies(w, 4.2, 0.72);
      if (s !== false && s < bestScore) { bestScore = s; best = w.index; }
    });
    if (best !== current) { current = best; setCaption(best >= 0 ? works[best] : null); }
  }
  let shownDictate = null;

  // the picture flat on the screen, at full resolution, for reading
  function openFlat(w) {
    if (!w) return;
    if (w.sculpture && !w.data.image) return;               // a sculpture shows large only if given a photograph
    if (locked && document.exitPointerLock) document.exitPointerLock();
    ui.flatImage.src = w.data.image || w.data.src;
    ui.flatImage.alt = w.data.title || '';
    ui.flatTitle.textContent = w.dictate ? (w.data.title || '') : (w.data.title || 'untitled');
    ui.flatMeta.textContent = metaLine(w.data);
    ui.flatCaption.textContent = w.data.caption || '';
    ui.flatDescription.textContent = w.data.description || '';
    ui.flatCount.textContent = w.index >= 0 && works.length > 1 ? (w.index + 1) + ' of ' + works.length : '';
    ui.flatPrev.classList.toggle('hidden', works.length < 2 || w.index < 0);
    ui.flatNext.classList.toggle('hidden', works.length < 2 || w.index < 0);

  }
  function closeFlat() {
    if (!flatOpen) return;

    document.body.classList.remove('flat');
    flatOpen = false;
    if (current >= 0 && works[current] && works[current].slug) setHash(works[current].slug);

  ui.flatClose.addEventListener('click', closeFlat);
  ui.flatPrev.addEventListener('click', () => { focusOn(prevIndex()); openFlat(works[current]); });
  ui.flatNext.addEventListener('click', () => { focusOn(nextIndex()); openFlat(works[current]); });
  ui.flat.addEventListener('click', (e) => { if (e.target === ui.flat) closeFlat(); });
  ui.enlarge.addEventListener('click', () => openFlat(works[current]));
  ui.helpToggle.addEventListener('click', () => ui.help.classList.toggle('faded'));

  /* ---------------------------------- input -------------------------------------- */
  let helpTimer = null;
  function noteFirstMove() {
    if (helpTimer !== null) return;

  const nextIndex = () => (current < 0 ? 0 : (current + 1) % works.length);

    const isPrev = e.code === 'BracketLeft' || e.code === 'KeyP';

      if (e.code === 'Escape' || e.code === 'Enter') { closeFlat(); e.preventDefault(); }

      return;
    }
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space') { if (!inCorridor(pos.x, pos.z)) crouching = !crouching; return; }
    if (e.code === 'Enter' && !ui.lock.classList.contains('hidden') && !ui.lockInput.disabled) { ui.lockInput.focus(); return; }
    if (['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
      keys.add(e.code);
      focus = null;
      arrived = -1;
    } else if (isNext) {
      focusOn(nextIndex());
    } else if (isPrev) {
      focusOn(prevIndex());
    } else if (e.code === 'Enter' && current >= 0) {
      openFlat(works[current]);
    } else if (e.code === 'KeyG') {
      setGhost(!ghost);
    } else if (e.code === 'KeyM' && (music.list.length || secretMusic.list.length)) {
      ui.musicToggle.click();
    } else if (e.code === 'Escape') {

    }
  });
  window.addEventListener('keyup', (e) => keys.delete(e.code));
  window.addEventListener('blur', () => keys.clear());

  ui.next.addEventListener('click', () => focusOn(nextIndex()));
  ui.prev.addEventListener('click', () => focusOn(prevIndex()));

  // drag to look, click to approach a picture
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  function pickWork(clientX, clientY) {
    ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const all = works.concat(dictates);
    const hit = raycaster.intersectObjects(all.map((w) => w.img))[0];
    return hit ? all.find((w) => w.img === hit.object) : null;
  }
  function pickSign(clientX, clientY) {
    if (!secret || !secret.reveal || !secret.reveal.sign.visible) return false;
    ndc.set((clientX / innerWidth) * 2 - 1, -(clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    return raycaster.intersectObject(secret.reveal.sign).length > 0;
  }

  // optional mouse capture for first-person looking; falls back to dragging where it isn't allowed
  function tryLock() {
    if (coarsePointer || locked || !canvas.requestPointerLock) return;
    try {
      const r = canvas.requestPointerLock();
      if (r && r.catch) r.catch(() => {});
    } catch (err) { /* not permitted here; dragging still works */ }
  }

    locked = document.pointerLockElement === canvas;
    ui.crosshair.classList.toggle('hidden', !locked);
    canvas.classList.toggle('locked', locked);
    canvas.classList.remove('over');
  });
  document.addEventListener('mousemove', (e) => {
    if (!locked || flatOpen) return;
    yaw -= e.movementX * CONFIG.lookSpeed;
    pitch = Math.max(-1.2, Math.min(1.2, pitch - e.movementY * CONFIG.lookSpeed));
    if (Math.abs(e.movementX) + Math.abs(e.movementY) > 2) { focus = null; arrived = -1; }

      focus = null;
      arrived = -1;

        if (!dr.unlocked) askForCode(dr);
        else if (!dr.sealed) {

          if (dr === secret.door2 && !dr.open) dr.sealed = true; // the second door only ever closes once
        }
        look = null; canvas.classList.remove('dragging'); return;
      }
      if (pickSign(cx, cy)) {
        window.open('https://heptar.ch', '_blank');
        look = null; canvas.classList.remove('dragging'); return;
      }

      if (w && w.dictate) openFlat(w);
      else if (w && w.index === arrived) openFlat(w);

    canvas.classList.remove('dragging');
  }

  canvas.addEventListener('pointercancel', endLook);

  // on-screen stick for touch devices
  let stickPointer = null;
  const STICK_R = 34;
  ui.stick.addEventListener('pointerdown', (e) => {
    stickPointer = e.pointerId;
    ui.stick.setPointerCapture(e.pointerId);
    focus = null;
    arrived = -1;
  });
  ui.stick.addEventListener('pointermove', (e) => {
    if (e.pointerId !== stickPointer) return;

    let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > STICK_R) { dx *= STICK_R / len; dy *= STICK_R / len; }
