<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gallery</title>
<style>
  :root {
    --wall: #e9e5dd;
    --ink: #2b2622;
    --muted: #7a736b;
    --knob: #ece8e1;
  }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--wall); color: var(--ink);
    font-family: var(--font, Cardo, serif);
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene.dragging { cursor: grabbing; }
  #scene.over { cursor: pointer; }

  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { position: absolute; }

  #top-left { left: 24px; top: 20px; max-width: 44ch; }
  #gallery-title { font-size: 18px; letter-spacing: 0.01em; font-weight:bold;}
  #gallery-subtitle { font-size: 13px; color: var(--muted); margin-top: 2px; font-style:italic}
  #gallery-subtitle:empty, #room-title:empty, #caption-meta:empty, #caption-text:empty { display: none; }
  #room-title { font-size: 13px; color: var(--muted); margin-top: -17.5px; margin-left: 120px; transition: opacity 0.4s; display:none}
  #caption-meta { font-size: 13px; color: var(--muted); margin-top: 3px; font-style:italic}
  #caption { margin-top: 16px; transition: opacity 0.35s}
  #caption.hidden { opacity: 0; }
  #lock { margin-top: 16px; }
  #lock.hidden { display: none; }
  #lock-title { font-size: 18px; line-height: 1.3; margin-top: -15px}
  #lock-text, #lock-hint { font-size: 14px; line-height: 1.5; color: var(--muted); margin-top: 3px; }
  #lock-input {
    pointer-events: auto; display: block; margin-top: 8px; font: inherit; font-size: 16px; letter-spacing: 0.12em;
    color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--muted); padding: 2px 0; width: 9ch; outline: none;
  }
  #lock-input:focus { border-bottom-color: var(--ink); }
  #lock.wrong #lock-input { animation: shake 0.35s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  #caption-title { font-size: 18px; line-height: 1.3; margin-top: -15px;}
  #caption-title:empty { display: none; }
  #caption-text { font-size: 14px; line-height: 1.5; color: var(--muted); margin-top: 3px; white-space: pre-line; display: none}
  #nav { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 2px; margin-left: -8px; }
  #pager.hidden { display: none; }
  #pager { display: flex; align-items: center; gap: 2px; }
  #nav button {
    pointer-events: auto; font: inherit; font-size: 20px; line-height: 1; color: var(--ink);
    background: none; border: 0; padding: 2px 8px 4px; cursor: pointer; border-radius: 3px;
  }
  #nav button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 1px; }
  #nav #enlarge.hidden { display: none; }
  #nav #enlarge { font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 2px 6px 4px; margin-left: 8px; }
  #pager.hidden + #enlarge { margin-left: 0; padding-left: 8px; }
  #music { margin-top: 18px; font-size: 13px; line-height: 1.6; color: var(--muted); }
  #music.hidden { display: none; }
  #music button {
    pointer-events: auto; font: inherit; color: var(--ink); background: none; border: 0; padding: 0;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  #music button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  #music-track:empty { display: none; }
  #help-toggle {
    pointer-events: auto; font: inherit; font-size: 15px; color: var(--muted); background: none; border: 0;
    padding: 0 0 8px 8px; cursor: pointer; margin-top: 10px
  }
  #help-toggle:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  #crosshair {
    left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border: 1.5px solid rgba(43, 38, 34, 0.6); border-radius: 50%;
  }
  #crosshair.hidden { display: none; }
  #scene.locked { cursor: none; }

  #flat {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 44px 32px 32px; background: rgba(27, 25, 23, 0.94); color: #ece8e1;
  }
  #flat.hidden { display: none; }
  body.flat #ui { visibility: hidden; }
  #flat:focus { outline: none; }
  #flat-image { max-width: min(92vw, 1400px); max-height: 72vh; object-fit: contain; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); }
  #flat-copy { max-width: 60ch; text-align: center; font-size: 14px; line-height: 1.6; color: rgba(236, 232, 225, 0.78); }
  #flat-title { font-size: 20px; color: #ece8e1; }
  #flat-meta { margin-top: 2px; font-style:italic}
  #flat-caption { margin-top: 8px; white-space: pre-line; color: #ece8e1;}
  #flat-description { margin-top: 10px; white-space: pre-line; }
  #flat-meta:empty, #flat-caption:empty, #flat-description:empty { display: none; }
  .flat-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); font: inherit; font-size: 44px; line-height: 1;
    color: rgba(236, 232, 225, 0.7); background: none; border: 0; cursor: pointer; padding: 12px 18px;
  }
  .flat-arrow:hover, .flat-arrow:focus-visible { color: #ece8e1; outline: none; }
  #flat-prev { left: 10px; }
  #flat-next { right: 10px; }
  .flat-arrow.hidden { display: none; }
  #flat-count { margin-top: 12px; font-size: 13px; color: rgba(236, 232, 225, 0.55); }
  #flat-count:empty { display: none; }
  @media (pointer: coarse) { .flat-arrow { font-size: 36px; padding: 10px 12px; } }
  #flat-close {
    position: absolute; top: 14px; right: 20px; font: inherit; font-size: 28px; line-height: 1; color: rgba(236, 232, 225, 0.8);
    background: none; border: 0; cursor: pointer; padding: 4px 8px;
  }
  #flat-close:focus-visible { outline: 1.5px solid #ece8e1; outline-offset: 2px; }

  #top-right { right: 24px; top: 20px; text-align: right; max-width: 44ch; }
  #help { font-size: 13px; line-height: 1.6; color: var(--muted); white-space: pre-line; transition: opacity 1.4s; }
  #help.faded { opacity: 0; }

  #note { margin-top: 18px; font-size: 13px; line-height: 1.6; color: var(--muted); }
  #note button {
    pointer-events: auto; font: inherit; color: var(--ink); background: none; border: 0; padding: 0;
    text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
  }
  #note button:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; }
  #note.hidden { display: none; }

  #stick {
    display: none; left: 24px; bottom: 28px; width: 112px; height: 112px; border-radius: 50%;
    border: 1px solid rgba(236, 232, 225, 0.6); pointer-events: auto; touch-action: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border-radius: 50%; background: var(--knob); opacity: 0.85;
  }
  @media (pointer: coarse) {
    #stick { display: block; }
    #top-right { max-width: 52vw; }
    #flat { gap: 16px; padding: 56px 16px 24px; }
    #flat-image { max-height: 58vh; max-width: 100%; }
  }

  body.dragover::after { content: ""; position: fixed; inset: 12px; border: 1px dashed var(--ink); pointer-events: none; }
  #curtain {
    position: fixed; inset: 0; z-index: 20; background: var(--wall); display: grid; place-items: center;
    transition: opacity 1.6s ease; pointer-events: none;
  }
  #curtain.gone { opacity: 0; }
  #curtain-inner { display: flex; flex-direction: column; align-items: center; }
  #curtain-title { font-size: 15px; color: var(--muted); opacity: 0; transition: opacity 0.8s; }
  #curtain-title.show { opacity: 1; }
  #curtain-bar {
    margin-top: 16px; width: 140px; height: 1px; background: rgba(122, 115, 107, 0.25);
    opacity: 0; transition: opacity 0.8s;
  }
  #curtain-bar.show { opacity: 1; }
  #curtain-fill { height: 100%; width: 0%; background: var(--muted); transition: width 0.2s ease; }
  #fallback { display: none; position: fixed; inset: 0; place-items: center; padding: 24px; font-size: 15px; line-height: 1.5; text-align: center; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<canvas id="scene" aria-label="Walkable 3D gallery"></canvas>

<div id="ui">
  <div id="top-left">
    <div id="lock" class="hidden">
      <div id="lock-title">Ghost Door</div>
      <div id="lock-text"><i>David Wakeham, 2026</i></div>
      <input id="lock-input" type="text" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#______" aria-label="Code for the small door">
      <div id="lock-hint"></div>
    </div>
    <div id="caption" class="hidden" aria-live="polite">
      <div id="caption-title"></div>
      <div id="caption-meta"></div>
      <div id="caption-text"></div>
      <div id="nav">
        <span id="pager">
          <button id="prev" type="button" aria-label="Previous picture">‹</button>
          <span id="count"></span>
          <button id="next" type="button" aria-label="Next picture">›</button>
        </span>
        <button id="enlarge" type="button">(enlarge)</button>
      </div>
    </div>
  </div>
  <div id="top-right">
    <div id="gallery-title"></div>
    <div id="gallery-subtitle"></div>
    <div id="room-title"></div>
    <button id="help-toggle" type="button" aria-label="Show or hide the controls">?</button>
    <div id="help"></div>
    <div id="note" class="hidden"></div>
    <div id="music" class="hidden">
      <button id="music-toggle" type="button"></button>
      <div id="music-track"></div>
    </div>
  </div>
  <div id="crosshair" class="hidden" aria-hidden="true"></div>
  <div id="stick" aria-hidden="true"><div id="knob"></div></div>
</div>
<div id="flat" class="hidden" role="dialog" aria-modal="true" aria-label="Picture, larger" tabindex="-1">
  <button id="flat-close" type="button" aria-label="Close">×</button>
  <button id="flat-prev" type="button" class="flat-arrow" aria-label="Previous picture">‹</button>
  <button id="flat-next" type="button" class="flat-arrow" aria-label="Next picture">›</button>
  <img id="flat-image" alt="">
  <div id="flat-copy">
    <div id="flat-title"></div>
    <div id="flat-meta"></div>
    <div id="flat-caption"></div>
    <div id="flat-description"></div>
    <div id="flat-count"></div>
  </div>
</div>
<div id="curtain" aria-hidden="true">
  <div id="curtain-inner">
    <div id="curtain-title"></div>
    <div id="curtain-bar"><div id="curtain-fill"></div></div>
  </div>
</div>
<div id="fallback">This gallery needs WebGL, which your browser has turned off or does not support.</div>
<input id="picker" type="file" accept="image/*" multiple>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------
     Settings. Edit these, or edit images.json to change what hangs.
     ------------------------------------------------------------------ */
  const CONFIG = {
    manifest: ['images.json', 'gallery.json'], // first one found is used. { "title", "subtitle", "intro", "colors": {...}, "music": [...], "musicVolume", "works": [ { "src", "title", "artist", "year", "caption", "description", "size", "wall" } ] }  or  "rooms": [ { "title", "colors", "works": [...] }, ... ]
    title: 'gallery',        // used when the manifest has no title
    eyeHeight: 1.4,          // metres
    hangHeight: 1.5,         // centre of each picture above the floor, metres
    wallHeight: 4.2,
    spacing: 3.2,            // metres between picture centres along a wall
    workSize: 1.5,           // default longest side of a picture, metres (override per work with "size")
    walkSpeed: 2.4,          // metres per second
    maxPixelRatio: 1.5,      // render density on high-dpi screens: 2 is sharpest, 1 is fastest; it drops on its own if frames fall behind
    crouchHeight: 0.9,       // eye height when crouched (space); the small door needs it
    lookSpeed: 0.0042,       // radians per pixel of drag
    door: { width: 2.0, height: 2.4 },        // opening in the front wall, roped off
    foyer: { width: 6.4, depth: 5.2, height: 3.1 },
    exposure: 1.2,
    ambient: 0.8,            // overall room light from the skylight; lower is moodier
    spot: 0.85,              // strength of the pool each spot throws on the wall, 0 to 1
    liveSpots: 0,            // how many nearby pictures get a real, shadow-casting spotlight (fewer on phones)
    daylightDrift: 0.4,      // how much the room dims when a cloud fully hides the sun, 0 for no effect
    cloudSpeed: 0.0025,      // how fast the clouds drift; 0.0025 is a light breeze
    cloudScale: 100,         // size of the big cloud shapes, in metres
    cloudCover: 0.45,        // how much of the sky is cloud, 0 to 1
    cloudHeaviness: 2.0,     // how much thick clouds self-shadow toward dark grey; 1 is the old default, 0 flattens them out
    skylightMargin: 2.0,     // total dark ceiling left at each room's skylight, regardless of the room's own size, so they line up room to room
    emptyRoomSize: 3,        // floor for the last room's own width/depth, if it's empty — separate from the normal 9m floor every other room uses
    cloudSteps: 20,          // samples per ray through the cloud layer; more is smoother and slower (phones use half)
    showTrackName: false,    // print the playing track's name under the music control
    floor: 'wood',           // 'wood' for oak boards, or a number 0 to 40 for speckled concrete (0 is smooth)
    floorGloss: 0.45,        // roughness of the floor finish: 0.3 is a lacquer, 0.8 is matte
    floorReflection: 0.02,    // how much of the pictures shows in the floor: 0 is none, 0.2 is a lot
    ghost: false,            // pictures change places while you aren't looking; "ghost": true in a manifest turns it on for that show, g toggles it
    ghostEvery: [30, 90],    // seconds between hauntings, chosen at random within this range each time
    wallLabels: true,        // a printed label beside each picture
    font: 'Cardo',     // used for the screen text, the wall labels and the wall text
    fontUrl: 'https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap', // a Google Fonts stylesheet for it, or '' for a font already on the machine
    fontFallback: 'Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif',
  };

  const COLORS = {
    wall: '#e4e0d8',
    ceiling: '#e6e3dd',
    floor: '#98785a',
    trim: '#cdc3b5',
    frame: '#1f1c19',
    fixture: '#d3cec5',    // track, spot heads, skylight border: a shade under the wall
    skylightBars: '#d3cec5', // the glazing bars, seen from below against the sky
    skirting: '#d3cec5',
    foyerSkirting: '#bdb3a5',
    foyerTrim: '#cdc3b5',      // the frame round the stair opening; the same as foyerWall, so it disappears into it
    pendant: '#26231f',
    metal: '#44454a',
    rope: '#2a2320',
    foyerWall: '#cdc3b5',
    foyerCeiling: '#d5cfc5',
    foyerFloor: '#8e7457',
    wood: '#7f6a52',
    placeholder: '#d6d1c8',
  };

  const params = new URLSearchParams(location.search);
  if (params.has('lite')) { CONFIG.liveSpots = 3; CONFIG.cloudSteps = 10; CONFIG.floorReflection = 0; }
  if (params.get('manifest')) CONFIG.manifest = [params.get('manifest')];

  const $ = (id) => document.getElementById(id);
  const ui = {
    title: $('gallery-title'), help: $('help'), caption: $('caption'), capTitle: $('caption-title'),
    capText: $('caption-text'), nav: $('nav'), count: $('count'), prev: $('prev'), next: $('next'),
    note: $('note'), stick: $('stick'), knob: $('knob'), picker: $('picker'),
    lock: $('lock'), lockText: $('lock-text'), lockInput: $('lock-input'), lockHint: $('lock-hint'),
    subtitle: $('gallery-subtitle'), roomTitle: $('room-title'), capMeta: $('caption-meta'), pager: $('pager'), enlarge: $('enlarge'),
    helpToggle: $('help-toggle'), crosshair: $('crosshair'),
    music: $('music'), musicToggle: $('music-toggle'), musicTrack: $('music-track'),
    flat: $('flat'), flatImage: $('flat-image'), flatTitle: $('flat-title'), flatMeta: $('flat-meta'),
    flatCaption: $('flat-caption'), flatDescription: $('flat-description'), flatClose: $('flat-close'),
    flatPrev: $('flat-prev'), flatNext: $('flat-next'), flatCount: $('flat-count'),
    curtain: $('curtain'), curtainTitle: $('curtain-title'), curtainBar: $('curtain-bar'), curtainFill: $('curtain-fill'),
  };
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarsePointer = matchMedia('(pointer: coarse)').matches;

  const FONT = (CONFIG.font ? '"' + CONFIG.font + '", ' : '') + CONFIG.fontFallback;
  document.documentElement.style.setProperty('--font', FONT);
  if (CONFIG.font && CONFIG.fontUrl) {
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = CONFIG.fontUrl;
    document.head.appendChild(link);
  }
  // canvases only get the web font once it has actually loaded, so wait for it (briefly) before building.
  // But "briefly" is capped — on a slow connection the cap can fire before the font truly arrives, and
  // since canvas text doesn't reflow like DOM text does, whatever font was active at draw time is what
  // stays baked into the texture forever. realFontLoad (uncapped) lets wall-text panels redraw themselves
  // once the font genuinely lands, even if that's after the cap already let building proceed.
  const realFontLoad = CONFIG.font && document.fonts
    ? Promise.all(['400 32px', '700 32px', 'italic 400 32px'].map((f) => document.fonts.load(f + ' "' + CONFIG.font + '"'))).catch(() => {})
    : Promise.resolve();
  const fontsReady = CONFIG.font && document.fonts
    ? Promise.race([
      realFontLoad,
      new Promise((r) => setTimeout(r, 6000)),
    ]).catch(() => {})
    : Promise.resolve();

  // Re-bakes a canvas text texture once the real font is confirmed loaded — unconditionally, not just
  // when the draw appeared to happen too early. document.fonts.load() resolving doesn't guarantee a
  // canvas painted in that same tick already sees the new font (that can lag a frame or two behind),
  // so an initial draw can look right by every check available yet still have used the fallback. Two
  // rAFs give the browser a couple of frames to actually catch up before this redraw locks it in.
  function refreshOnRealFont(tex, redraw) {
    realFontLoad.then(() => requestAnimationFrame(() => requestAnimationFrame(() => {
      const ctx = tex.image.getContext('2d');
      ctx.clearRect(0, 0, tex.image.width, tex.image.height);
      redraw(ctx);
      tex.needsUpdate = true;
    })));
  }

  const col = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  const v3 = (x, y, z) => new THREE.Vector3(x, y, z);

  /* ---------------------------------- renderer ---------------------------------- */
  const canvas = $('scene');
  let renderer = null;
  // ask for the fast GPU first, then anything; a page can be refused a context when the browser has
  // too many open (about sixteen), or when the graphics driver has just been reset
  for (const options of [{ antialias: true, powerPreference: 'high-performance' }, { antialias: true }, { antialias: false, failIfMajorPerformanceCaveat: false }]) {
    try { renderer = new THREE.WebGLRenderer(Object.assign({ canvas }, options)); break; } catch (err) { console.warn('WebGL:', err.message); }
  }
  if (!renderer) {
    $('fallback').style.display = 'grid';
    $('fallback').textContent = 'The browser would not give this page a WebGL context. That usually means too many WebGL tabs are open, or the graphics driver has just been reset: close other tabs of the gallery, or restart the browser, and reload.';
    return;
  }
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    $('fallback').style.display = 'grid';
    $('fallback').textContent = 'The graphics context was lost, most often because the GPU was overloaded or reset. Reload the page; if it keeps happening, add ?lite to the address for a lighter version.';
  });
  let pixelRatio = Math.min(window.devicePixelRatio || 1, CONFIG.maxPixelRatio);
  renderer.setPixelRatio(pixelRatio);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = CONFIG.exposure;
  renderer.shadowMap.enabled = !coarsePointer;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.shadowMap.autoUpdate = false;
  const maxAniso = renderer.capabilities.getMaxAnisotropy();

  const scene = new THREE.Scene();
  scene.background = col(COLORS.wall);
  scene.fog = new THREE.Fog(col(COLORS.wall), 24, 90);

  const camera = new THREE.PerspectiveCamera(58, 1, 0.05, 6000);
  camera.rotation.order = 'YXZ';

  // Image-based lighting: a small hidden room with a bright ceiling panel is rendered
  // into an environment map. Every matte surface is then lit from above, with soft
  // falloff and gentle reflections, instead of from a few point sources.
  (function lightTheRoom() {
    const env = new THREE.Scene();
    const grey = (v) => new THREE.MeshBasicMaterial({ color: new THREE.Color().setScalar(v * CONFIG.ambient), side: THREE.BackSide });
    env.add(new THREE.Mesh(new THREE.BoxGeometry(10, 6, 10),
      [grey(0.44), grey(0.44), grey(0.85), grey(0.16), grey(0.44), grey(0.44)]));
    const panel = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 6.5),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 3.05, 2.8).multiplyScalar(CONFIG.ambient) }));
    panel.rotation.x = Math.PI / 2;
    panel.position.y = 2.95;
    env.add(panel);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(env, 0.04).texture;
    pmrem.dispose();
  })();

  const loader = new THREE.TextureLoader();
  // one texture per file, however many times it is hung (the corridor repeats each dictate several times)
  const textures = new Map();
  function loadTexture(src, onLoad, onError) {
    const have = textures.get(src);
    if (have && have.tex) { setTimeout(() => onLoad(have.tex), 0); return; }
    if (have) { have.waiting.push([onLoad, onError]); return; }
    const entry = { tex: null, waiting: [] };
    textures.set(src, entry);
    loader.load(src, (tex) => {
      tex.encoding = THREE.sRGBEncoding;
      tex.anisotropy = maxAniso;
      entry.tex = tex;
      onLoad(tex);
      entry.waiting.forEach(([ok]) => ok(tex));
      entry.waiting = [];
    }, undefined, (err) => {
      textures.delete(src);
      onError(err);
      entry.waiting.forEach(([, bad]) => bad(err));
    });
  }
  const sharedTextures = new Set();

  // a picture's true aspect ratio, read from just the first bytes of its PNG header (width and height
  // sit at fixed offsets right after the signature) via a ranged request — typically resolving long
  // before the full multi-megabyte file does, so the frame can be sized correctly from the start
  // instead of guessing square and resizing once the real image lands. Best-effort only: if the host
  // doesn't honour Range requests, or the file isn't a PNG, or anything else goes wrong, this just
  // quietly does nothing and the existing square-then-resize fallback carries on as before
  function probePngAspect(src) {
    return fetch(src, { headers: { Range: 'bytes=0-33' } }).then((res) => {
      if (!res.ok) { console.warn('aspect probe: bad response', res.status, src); return null; }
      if (res.status !== 206) console.warn('aspect probe: host did not honour the Range request (got ' + res.status + ', not 206) for', src, '— probably still works, but fetched the whole file to do it');
      return res.arrayBuffer().then((buf) => {
        if (buf.byteLength < 24) { console.warn('aspect probe: response too short', buf.byteLength, src); return null; }
        const d = new DataView(buf);
        const isPng = d.getUint32(0) === 0x89504e47 && d.getUint32(4) === 0x0d0a1a0a;
        if (!isPng) { console.warn('aspect probe: not a PNG signature', src); return null; }
        const width = d.getUint32(16), height = d.getUint32(20);
        return width && height ? width / height : null;
      });
    }).catch((err) => { console.warn('aspect probe: fetch failed', src, err); return null; });
  }

  /* ------------------------------ procedural textures ----------------------------- */
  function canvasTexture(w, h, draw, shared) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = maxAniso;
    if (shared) sharedTextures.add(tex);
    return tex;
  }

  // darkening near edges, so corners and the floor line read as corners: a cheap ambient occlusion
  function edgeShade(ctx, w, h, sides, amount, fx, fy) {
    const fade = (x0, y0, x1, y1) => {
      const g = ctx.createLinearGradient(x0, y0, x1, y1);
      g.addColorStop(0, 'rgba(0,0,0,' + amount + ')');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    };
    if (sides.left) fade(0, 0, w * fx, 0);
    if (sides.right) fade(w, 0, w - w * fx, 0);
    if (sides.top) fade(0, 0, 0, h * fy);
    if (sides.bottom) fade(0, h, 0, h - h * fy);
  }

  function wallShade(len, height, sides) {
    return canvasTexture(512, 128, (ctx, w, h) => {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      const g = ctx.createLinearGradient(0, 0, 0, h);   // brighter where the skylight reaches
      g.addColorStop(0, 'rgba(0,0,0,0.06)');
      g.addColorStop(0.3, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0.14)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
      edgeShade(ctx, w, h, { left: sides.left !== false, right: sides.right !== false, bottom: sides.bottom !== false },
        0.28, Math.min(0.5, 0.75 / len), Math.min(0.5, 0.45 / height));
    });
  }

  // smooth darkening toward the walls, used as an ambient-occlusion map on floors and ceilings
  function edgeMap(W, D, amount) {
    const cw = W >= D ? 256 : Math.round(256 * W / D);
    const ch = W >= D ? Math.round(256 * D / W) : 256;
    return canvasTexture(cw, ch, (ctx, w, h) => {
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      edgeShade(ctx, w, h, { left: true, right: true, top: true, bottom: true }, amount, Math.min(0.5, 0.9 / W), Math.min(0.5, 0.9 / D));
    });
  }

  // a small tile of fine speckle, repeated every `tile` metres so it stays crisp underfoot
  // and averages away at a distance (polished concrete, limestone). amount 0 gives a smooth surface.
  function grainMap(W, D, amount, tile) {
    if (!amount) return null;
    const size = 256;
    const tex = canvasTexture(size, size, (ctx, w, h) => {
      const img = ctx.createImageData(w, h);
      for (let i = 0; i < img.data.length; i += 4) {
        const v = 255 - Math.random() * amount;
        img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(W / tile, D / tile);
    return tex;
  }

  // oak boards: a tile of eight planks with wandering grain, staggered end joints and seams,
  // laid along the room's long axis and repeated. Greyscale, so the material colour sets the wood.
  let woodTile = null;
  function woodMap(W, D) {
    const L = 2048, S = 512;   // a 4.8 m by 1.2 m tile, eight 15 cm boards across
    if (!woodTile) woodTile = drawWoodTile(L, S);
    const lengthwise = W >= D; // boards run the long way
    let c = woodTile;
    if (!lengthwise) {
      c = document.createElement('canvas');
      c.width = S; c.height = L;
      const r = c.getContext('2d');
      r.translate(S, 0); r.rotate(Math.PI / 2);
      r.drawImage(woodTile, 0, 0);
    }
    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = maxAniso;
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(W / (lengthwise ? 4.8 : 1.2), D / (lengthwise ? 1.2 : 4.8));
    return tex;
  }
  function drawWoodTile(L, S) {
    const planks = 8, plankH = S / planks;
    const seed = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    const tile = document.createElement('canvas');
    tile.width = L; tile.height = S;
    const ctx = tile.getContext('2d');
    const img = ctx.createImageData(L, S);
    const data = img.data;
    // value noise, sampled around a circle in x so the tile repeats without a seam
    const hash = (i, j) => {
      let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
    };
    const noise = (x, y) => {
      const i = Math.floor(x), j = Math.floor(y);
      let fx = x - i, fy = y - j;
      fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      const a = hash(i, j), b = hash(i + 1, j), c = hash(i, j + 1), d = hash(i + 1, j + 1);
      const top = a + (b - a) * fx, bottom = c + (d - c) * fx;
      return top + (bottom - top) * fy;
    };
    const cosT = new Float32Array(L), sinT = new Float32Array(L);
    for (let x = 0; x < L; x++) { cosT[x] = Math.cos(2 * Math.PI * x / L); sinT[x] = Math.sin(2 * Math.PI * x / L); }
    const alongRow = (x0) => { // periodic distance along the board from x0, for every x
      const a = new Float32Array(L);
      for (let x = 0; x < L; x++) a[x] = (L / Math.PI) * Math.sin(Math.PI * (x - x0) / L);
      return a;
    };
    const joints = [];
    for (let p = 0; p < planks; p++) {   // boards end every couple of metres, never in line with their neighbours
      const first = seed(p * 3 + 1) * L, list = [first];
      let x = first;
      for (let k = 0; k < 3; k++) { x += (0.35 + seed(p * 3 + 2 + k * 7) * 0.25) * L; if (x - first < L * 0.85) list.push(x % L); }
      joints.push(list);
    }
    for (let p = 0; p < planks; p++) {
      const tone = 0.86 + seed(p * 7 + 3) * 0.14;
      const cx = seed(p * 7 + 4) * L, cy = plankH * (seed(p * 7 + 5) * 1.6 - 0.3); // growth-ring centre, off the board so rings sweep across it as arches
      const elong = 0.045 + seed(p * 7 + 6) * 0.07;           // how stretched the arches are
      const ringFreq = 0.08 + seed(p * 7 + 7) * 0.06;         // rings per pixel
      const s1 = p * 31.7, s2 = p * 17.3 + 5, s3 = p * 43.1 + 9;
      // none, one or two knots per board, wherever they fall
      const nk = seed(p * 11 + 2) < 0.4 ? 0 : seed(p * 11 + 2) < 0.8 ? 1 : 2;
      const knots = [];
      for (let k = 0; k < nk; k++) {
        const kx = seed(p * 11 + 3 + k * 5) * L;
        knots.push({ x: kx, y: plankH * (0.2 + seed(p * 11 + 4 + k * 5) * 0.6), r: 4 + seed(p * 11 + 5 + k * 5) * 7, row: alongRow(kx) });
      }
      const dCentre = alongRow(cx);
      const isJoint = new Uint8Array(L);
      for (let x = 0; x < L; x++) isJoint[x] = joints[p].some((j) => Math.abs(((x - j + L / 2) % L + L) % L - L / 2) < 1.5) ? 1 : 0;
      for (let y = 0; y < plankH; y++) {
        for (let x = 0; x < L; x++) {
          const c = cosT[x], sn = sinT[x];
          // the grain wanders: two slow warps bend the ring pattern before it is read
          const wx = noise(c * 3 + s1, sn * 3 + y * 0.03) - 0.5;
          const wy = noise(c * 5 + s2, sn * 5 + y * 0.05) - 0.5;
          let ys = y + wy * 7 + wx * 3;
          let kdist = Infinity, knot = null;
          for (let k = 0; k < knots.length; k++) {
            const kn = knots[k], ky = (ys - kn.y) * 1.6;
            const dk = Math.sqrt(kn.row[x] * kn.row[x] + ky * ky);
            if (dk < kn.r * 3.5) ys += Math.sign(ys - kn.y || 1) * (kn.r * kn.r * 2.5) / (dk + 2); // grain flows round the knot
            if (dk < kdist) { kdist = dk; knot = kn; }
          }
          // rings as stretched ellipses about a centre off the board: cathedral figure of a flat-sawn plank
          const dy = ys - cy, dx = dCentre[x] * elong;
          const d = Math.sqrt(dy * dy + dx * dx);
          const ring = d * ringFreq + (noise(c * 4 + s3, sn * 4 + y * 0.03) - 0.5) * 0.7;
          const f = ring - Math.floor(ring);
          const f2 = f * f, late = f2 * f2 * f;                    // latewood: a narrow, sharp, dark band at the end of each ring
          const grain = 0.32 * late + 0.14 * f;
          const mottle = (noise(c * 2 + s1 + 100, sn * 2 + y * 0.012) - 0.5) * 0.09;
          let v = tone * (1 - 0.24 * grain + mottle) + (Math.random() - 0.5) * 0.035;
          if (knot && kdist < knot.r) v *= 0.5 + 0.22 * (0.5 + 0.5 * Math.sin(kdist * 1.6));
          else if (knot && kdist < knot.r * 3.5) v *= 1 - 0.16 * (1 - (kdist - knot.r) / (knot.r * 2.5)) * (0.5 + 0.5 * Math.sin(kdist * 1.1));
          if (y < 1.5) v *= 0.7;                                                                          // seam between boards
          if (isJoint[x]) v *= 0.72;                                                                   // end joints
          const i = ((p * plankH + y) * L + x) * 4;
          data[i] = data[i + 1] = data[i + 2] = v * 255;
          data[i + 3] = 255;
        }
      }
    }
    ctx.putImageData(img, 0, 0);
    return tile;
  }

  // a floor or ceiling: boards or fine grain in `map`, smooth edge shading in `aoMap` (separate uv set, so the two can differ in scale)
  function surface(hex, W, D, finish, extra) {
    const map = finish === 'wood' ? woodMap(W, D) : grainMap(W, D, finish, 0.5);
    return matte(hex, map, Object.assign({ aoMap: edgeMap(W, D, 0.34), aoMapIntensity: 1 }, extra || {}));
  }

  function glowPanel() {
    return canvasTexture(256, 64, (ctx, w, h) => {
      const g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.55);
      g.addColorStop(0, '#ffffff');
      g.addColorStop(0.7, '#e6e2da');
      g.addColorStop(1, '#a9a49b');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }, true);
  }

  // the scallop of light a ceiling spot throws down a wall
  function spotPool() {
    return canvasTexture(256, 256, (ctx, w, h) => {
      const g = ctx.createRadialGradient(w / 2, h * 0.2, h * 0.04, w / 2, h * 0.56, h * 0.52);
      g.addColorStop(0, 'rgba(255,244,224,1)');
      g.addColorStop(0.3, 'rgba(255,244,224,0.6)');
      g.addColorStop(0.7, 'rgba(255,244,224,0.15)');
      g.addColorStop(1, 'rgba(255,244,224,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, w, h);
    }, true);
  }

  // the soft shadow a frame drops on the wall under that spot
  function frameShadow(w, h, margin) {
    const S = 128;
    return canvasTexture(S, S, (ctx) => {
      const fx = margin / (w + 2 * margin), fy = margin / (h + 2 * margin);
      ctx.shadowColor = 'rgba(0,0,0,0.7)';
      ctx.shadowBlur = S * 0.09;
      ctx.shadowOffsetY = S * 0.05;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(S * fx, S * fy, S * (1 - 2 * fx), S * (1 - 2 * fy));
    });
  }

  // a soft contact shadow on the floor under something that stands on it
  function groundShadow(w, d, margin, strength, x, z, round) {
    const S = 128;
    const tex = canvasTexture(S, S, (ctx) => {
      const fx = margin / (w + 2 * margin), fz = margin / (d + 2 * margin);
      ctx.shadowColor = 'rgba(0,0,0,' + strength + ')';
      ctx.shadowBlur = S * 0.11;
      ctx.fillStyle = 'rgba(0,0,0,' + strength + ')';
      if (round) {
        ctx.beginPath();
        ctx.ellipse(S / 2, S / 2, S * (0.5 - fx), S * (0.5 - fz), 0, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(S * fx, S * fz, S * (1 - 2 * fx), S * (1 - 2 * fz));
      }
    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w + 2 * margin, d + 2 * margin),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, 0.003, z);
    m.renderOrder = 1;
    room.add(m);
    return m;
  }

  function convexHull(points) {
    const pts = points.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lower = [], upper = [];
    pts.forEach((p) => { while (lower.length >= 2 && cross(lower[lower.length - 2], lower[lower.length - 1], p) <= 0) lower.pop(); lower.push(p); });
    pts.reverse().forEach((p) => { while (upper.length >= 2 && cross(upper[upper.length - 2], upper[upper.length - 1], p) <= 0) upper.pop(); upper.push(p); });
    lower.pop(); upper.pop();
    return lower.concat(upper);
  }

  // the shadow a set of boxes throws on the floor from one small light: each box's corners are
  // projected along rays from the light onto the floor, hulled, and drawn softly onto a plane
  // covering the region x0..x1, z0..z1
  function castShadow(light, boxes, x0, x1, z0, z1, strength, blur) {
    const cw = 256, ch = Math.round(256 * (z1 - z0) / (x1 - x0));
    const off = 10000; // draw off-canvas and let the canvas shadow land on it, so any shape gets blurred
    const tex = canvasTexture(cw, ch, (ctx, w, h) => {
      ctx.shadowColor = 'rgba(0,0,0,' + strength + ')';
      ctx.shadowBlur = blur * w;
      ctx.shadowOffsetX = off;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      boxes.forEach((b) => {
        const pts = [];
        [-1, 1].forEach((sx) => [-1, 1].forEach((sy) => [-1, 1].forEach((sz) => {
          const px = b.x + sx * b.w / 2, py = b.y + sy * b.h / 2, pz = b.z + sz * b.d / 2;
          const t = light.y / (light.y - py);
          pts.push([light.x + t * (px - light.x), light.z + t * (pz - light.z)]);
        })));
        convexHull(pts).forEach((p, i) => {
          const cx = (p[0] - x0) / (x1 - x0) * w - off, cy = (p[1] - z0) / (z1 - z0) * h;
          if (i === 0) ctx.moveTo(cx, cy); else ctx.lineTo(cx, cy);
        });
        ctx.closePath();
      });
      ctx.fill();
    });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(x1 - x0, z1 - z0),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, toneMapped: false }));
    m.rotation.x = -Math.PI / 2;
    m.position.set((x0 + x1) / 2, 0.004, (z0 + z1) / 2);
    m.renderOrder = 2;
    room.add(m);
    return m;
  }

  // a wall label for a picture that is missing, so the problem is visible in the room
  function labelTexture(head, text) {
    const tex = canvasTexture(512, 640, (ctx, w, h) => {
      ctx.fillStyle = '#d9d4cb'; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = '#5a534b';
      ctx.font = '44px ' + FONT;
      ctx.fillText(head, 40, 100);
      ctx.font = '32px ' + FONT;
      const words = text.split(/(?=[\/_\-.])/), lines = [];
      let line = '';
      words.forEach((wd) => { if (ctx.measureText(line + wd).width > w - 80 && line) { lines.push(line); line = wd; } else line += wd; });
      lines.push(line);
      lines.forEach((l, i) => ctx.fillText(l, 40, 170 + i * 44));
    });
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  let missing = [];
  let pendingTextures = 0;
  let blocks = [];     // things you can't walk through: [{ x0, x1, z0, z1 }]
  let dictates = [];   // the corridor's pictures, kept apart from the tour

  function wrapLines(ctx, text, maxWidth) {
    const out = [];
    String(text).split(/\n/).forEach((para) => {
      let line = '';
      para.split(' ').forEach((word) => {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth && line) { out.push(line); line = word; } else line = test;
      });
      out.push(line);
    });
    return out;
  }

  // the printed card that hangs beside a picture: title, artist and year, the caption
  function labelCard(data) {
    const W = 512, pad = 40, font = FONT;
    const probe = document.createElement('canvas').getContext('2d');
    const blocks = [];
    probe.font = '700 34px ' + font;
    blocks.push({ lines: wrapLines(probe, data.title || 'untitled', W - 2 * pad), font: probe.font, size: 34, color: '#2b2622', gap: 8 });
    const meta = metaLine(data);
    if (meta) { probe.font = 'Italic 24px ' + font; blocks.push({ lines: wrapLines(probe, meta, W - 2 * pad), font: probe.font, size: 24, color: '#7a736b', gap: 10 }); }
    if (data.caption) { probe.font = '26px ' + font; blocks.push({ lines: wrapLines(probe, data.caption, W - 2 * pad), font: probe.font, size: 26, color: '#2b2622', gap: 0 }); }
    let H = pad * 2;
    blocks.forEach((b, i) => { H += b.lines.length * b.size * 1.3 + (i ? b.gap + 6 : 0); });
    H = Math.ceil(H);
    // the card is the wall's own colour lifted a little and warmed, so it reads as cream card on plaster
    const wall = new THREE.Color(COLORS.wall);
    const card = '#' + new THREE.Color(wall.r + (1 - wall.r) * 0.42, wall.g + (1 - wall.g) * 0.36, wall.b + (1 - wall.b) * 0.12).getHexString();
    const drawCard = (ctx) => {
      ctx.fillStyle = card;
      ctx.fillRect(0, 0, W, H);
      let y = pad;
      blocks.forEach((b, i) => {
        if (i) y += b.gap + 6;
        ctx.font = b.font; ctx.fillStyle = b.color; ctx.textBaseline = 'top';
        b.lines.forEach((l) => { ctx.fillText(l, pad, y); y += b.size * 1.3; });
      });
    };
    const tex = canvasTexture(W, H, drawCard);
    tex.encoding = THREE.sRGBEncoding;
    refreshOnRealFont(tex, drawCard);
    const width = 0.3;
    // lit like the wall it hangs on, so it sits in the same pool of light rather than glowing
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, width * H / W), matte('#ffffff', tex, { roughness: 0.9 }));
    mesh.userData.height = width * H / W;
    return mesh;
  }

  // exhibition text lettered straight onto a wall
  function wallText(title, subtitle, body, widthM) {
    const W = 1024, font = FONT;
    const probe = document.createElement('canvas').getContext('2d');
    const blocks = [];
    if (title) { probe.font = '700 78px ' + font; blocks.push({ lines: wrapLines(probe, title, W), font: probe.font, size: 78, color: '#2b2622', gap: 8 }); }
    if (subtitle) { probe.font = 'italic 40px ' + font; blocks.push({ lines: wrapLines(probe, subtitle, W), font: probe.font, size: 40, color: '#7a736b', gap: -2 }); }
    if (body) { probe.font = '34px ' + font; blocks.push({ lines: wrapLines(probe, body, W), font: probe.font, size: 34, color: '#3a342e', gap: 30 }); }
    let H = 0;
    blocks.forEach((b, i) => { H += b.lines.length * b.size * 1.42 + (i ? b.gap : 0); });
    H = Math.ceil(H) + 8;
    const drawPanel = (ctx) => {
      let y = 0;
      blocks.forEach((b, i) => {
        if (i) y += b.gap;
        ctx.font = b.font; ctx.fillStyle = b.color; ctx.textBaseline = 'top';
        b.lines.forEach((l) => { ctx.fillText(l, 0, y); y += b.size * 1.42; });
      });
    };
    const tex = canvasTexture(W, H, drawPanel);
    tex.encoding = THREE.sRGBEncoding;
    refreshOnRealFont(tex, drawPanel);
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(widthM, widthM * H / W),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false }));
    mesh.userData.height = widthM * H / W;
    return mesh;
  }

  const poolTex = spotPool();
  const glowTex = glowPanel();

  // a CPU twin of the cloud shader's own density function (same hash, same noise, same constants),
  // so the interior light can query exactly how much cloud sits between here and the sun right now,
  // rather than approximating weather with an arbitrary wobble. Evaluated at only a few points along
  // one ray, this costs nothing next to the shader doing the equivalent per pixel on the GPU.
  function cloudHash3(x, y, z) {
    x = x * 0.3183099 + 0.1; y = y * 0.3183099 + 0.2; z = z * 0.3183099 + 0.3;
    x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
    x *= 17; y *= 17; z *= 17;
    const v = x * y * z * (x + y + z);
    return v - Math.floor(v);
  }
  function cloudNoise3(x, y, z) {
    const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z);
    let fx = x - ix, fy = y - iy, fz = z - iz;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy); fz = fz * fz * (3 - 2 * fz);
    const h = (dx, dy, dz) => cloudHash3(ix + dx, iy + dy, iz + dz), lerp = (a, b, t) => a + (b - a) * t;
    return lerp(
      lerp(lerp(h(0, 0, 0), h(1, 0, 0), fx), lerp(h(0, 1, 0), h(1, 1, 0), fx), fy),
      lerp(lerp(h(0, 0, 1), h(1, 0, 1), fx), lerp(h(0, 1, 1), h(1, 1, 1), fx), fy), fz);
  }
  function cloudFbm3(x, y, z) {
    return 0.5 * cloudNoise3(x, y, z) + 0.25 * cloudNoise3(x * 2.03 + 3.1, y * 2.03 + 3.1, z * 2.03 + 3.1) + 0.125 * cloudNoise3(x * 4.1 + 7.7, y * 4.1 + 7.7, z * 4.1 + 7.7);

  function smoothstepJS(e0, e1, v) { const t = Math.min(1, Math.max(0, (v - e0) / (e1 - e0))); return t * t * (3 - 2 * t); }

  function cloudShapeAt(x, y, z, t) {
    const h = Math.min(1, Math.max(0, (y - CLOUD_BASE) / (CLOUD_TOP - CLOUD_BASE)));
    const wind = CONFIG.cloudSpeed * 1600;
    const qx = (x + t * wind) / CONFIG.cloudScale, qy = (y + t * 0.35) / CONFIG.cloudScale, qz = (z + t * wind * 0.5) / CONFIG.cloudScale;
    const lo = 0.60 - CONFIG.cloudCover * 0.30;

  }
  const sunDirCPU = new THREE.Vector3(0.32, 1, 0.2).normalize();
  let sunK = 1;   // smoothed sun-visibility factor, tracked frame to frame

  // the sky is drawn live on the GPU as a volume: for every pixel that can see it, a ray is marched
  // up through a layer of cloud a few hundred metres thick, gathering density from layered noise and
  // lighting each sample by marching a short way toward the sun through the same cloud. That is what
  // gives them bulk: lit crowns, shadowed undersides, edges that thin to nothing, and real parallax.
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      time: { value: 0 }, daylight: { value: 1 },
      scale: { value: CONFIG.cloudScale }, cover: { value: CONFIG.cloudCover },
      heavy: { value: CONFIG.cloudHeaviness },
      sunDir: { value: new THREE.Vector3(0.32, 1, 0.2).normalize() },
      steps: { value: Math.min(64, coarsePointer ? Math.round(CONFIG.cloudSteps / 2) : CONFIG.cloudSteps) },
      wind: { value: CONFIG.cloudSpeed * 1600 },
    },
    vertexShader: `
      varying vec3 vWorldPos;
      void main() { vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform float time, daylight, scale, cover, wind, heavy;
      uniform vec3 sunDir;
      uniform int steps;
      varying vec3 vWorldPos;
      const float BASE = 320.0, TOP = 760.0;   // the cloud layer, in metres above the floor
      float hash(vec3 p) { p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
      float noise(vec3 x) {
        vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
                   mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
      }
      float fbm3(vec3 p) { return 0.5 * noise(p) + 0.25 * noise(p * 2.03 + 3.1) + 0.125 * noise(p * 4.1 + 7.7); }
      float fbm2(vec3 p) { return 0.6 * noise(p) + 0.4 * noise(p * 2.2 + 1.3); }
      // the big shapes: flat-bottomed, rounded on top, drifting with the wind and slowly changing
      float shape(vec3 p) {
        float h = clamp((p.y - BASE) / (TOP - BASE), 0.0, 1.0);
        vec3 q = (p + vec3(time * wind, time * 0.35, time * wind * 0.5)) / scale;
        float lo = 0.60 - cover * 0.30;
        float d = smoothstep(lo, lo + 0.24, fbm3(q));
        return d * smoothstep(0.0, 0.14, h) * (1.0 - smoothstep(0.5, 1.0, h));
      }
      // the same, with finer noise eating into the edges so they billow instead of blobbing
      float cloud(vec3 p) {
        float d = shape(p);
        if (d <= 0.0) return 0.0;
        float e = fbm2((p + vec3(time * wind * 1.3, 0.0, 0.0)) / (scale * 0.18)) * 0.6 * (1.0 - d);
        return clamp((d - e) / max(1.0 - e, 0.001), 0.0, 1.0);
      }
      void main() {
        vec3 ro = cameraPosition, rd = normalize(vWorldPos - ro);
        float mu = clamp(rd.y, 0.0, 1.0);
        vec3 sky = mix(vec3(0.60, 0.72, 0.90), vec3(0.17, 0.39, 0.86), pow(mu, 0.55));   // pale at the horizon, deep overhead
        float sunDot = max(dot(rd, sunDir), 0.0);
        float disc = smoothstep(0.999750, 0.999925, sunDot);           // a small, sharp disc
        float glow = pow(sunDot, 1000.0) * 0.5 + pow(sunDot, 32.0) * 0.12;   // a tight bright ring plus a wide soft halo
        sky += vec3(1.0, 0.92, 0.75) * (disc * 3.5 + glow);
        vec3 col = sky;
        if (rd.y > 0.02) {
          float t0 = (BASE - ro.y) / rd.y, t1 = (TOP - ro.y) / rd.y;
          float n = float(steps), dt = (t1 - t0) / n;
          float t = t0 + dt * hash(vec3(gl_FragCoord.xy, 1.0));   // a little jitter hides the steps
          float T = 1.0;
          vec3 acc = vec3(0.0);
          vec3 sunCol = vec3(1.0, 0.95, 0.87) * 1.35;
          for (int i = 0; i < 64; i++) {
            if (i >= steps || T < 0.03) break;
            vec3 p = ro + rd * t;
            float d = cloud(p);
            if (d > 0.01) {
              float ld = 0.0;                                       // how much cloud lies between here and the sun
              for (int k = 1; k <= 4; k++) ld += shape(p + sunDir * (55.0 * float(k)));
              float Tl = exp(-ld * 55.0 * 0.014 * heavy);
              float h = clamp((p.y - BASE) / (TOP - BASE), 0.0, 1.0);
              vec3 ambient = mix(vec3(0.40, 0.48, 0.64), vec3(0.78, 0.84, 0.96), h) * 0.5;   // skylight from above, blue-grey below
              float powder = 1.0 - exp(-d * 3.0);                     // thin edges catch more light than a solid wall would
              vec3 light = sunCol * Tl * mix(0.65, 1.0, powder) + ambient;
              float a = 1.0 - exp(-d * dt * 0.022);
              acc += T * a * light;
              T *= 1.0 - a;
            }
            t += dt;
          }
          col = sky * T + acc;
          col = mix(col, sky, smoothstep(0.3, 0.02, rd.y) * 0.6);   // haze thickens toward the horizon
        }
        gl_FragColor = vec4(col * 0.95 * daylight, 1.0);
        #include <tonemapping_fragment>
        #include <encodings_fragment>
      }`,
  });
  skyMat.toneMapped = true;

  /* -------------------------------- placeholders --------------------------------- */
  let placeholderCache = null;
  const placeholders = () => placeholderCache || (placeholderCache = placeholderWorks());
  function placeholderWorks() {
    const specs = [
      ['circle', 0.8, '#d8d2c6', '#3b434c'], ['triangle', 1.25, '#4d5661', '#e6e1d7'],
      ['band', 1.0, '#8c8378', '#ece8e1'], ['arc', 0.75, '#2e3640', '#c9c2b6'],
      ['square', 1.4, '#c2b9a9', '#4d5661'], ['line', 0.8, '#5f6b77', '#ece8e1'],
      ['ring', 1.0, '#e1dbd0', '#2e3640'], ['crescent', 1.2, '#3a3f47', '#d8d2c6'],
    ];
    return specs.map(([shape, aspect, bg, fg], i) => {
      const w = 900, h = Math.round(900 / aspect);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = fg; ctx.strokeStyle = fg;
      const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.28;
      ctx.lineWidth = Math.min(w, h) * 0.06;
      ctx.beginPath();
      if (shape === 'circle') { ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill(); }
      else if (shape === 'triangle') { ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy + r * 0.8); ctx.lineTo(cx - r, cy + r * 0.8); ctx.closePath(); ctx.fill(); }
      else if (shape === 'band') { ctx.fillRect(0, cy - r * 0.35, w, r * 0.7); }
      else if (shape === 'arc') { ctx.arc(cx, cy + r * 0.3, r, Math.PI, Math.PI * 2); ctx.stroke(); }
      else if (shape === 'square') { ctx.fillRect(cx - r, cy - r, r * 2, r * 2); }
      else if (shape === 'line') { ctx.moveTo(cx, cy - r * 1.4); ctx.lineTo(cx, cy + r * 1.4); ctx.stroke(); }
      else if (shape === 'ring') { ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke(); }
      else if (shape === 'crescent') {
        ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx + r * 0.45, cy - r * 0.2, r * 0.9, 0, Math.PI * 2); ctx.fill();
      }
      const grain = ctx.getImageData(0, 0, w, h);
      for (let p = 0; p < grain.data.length; p += 4) {
        const n = (Math.random() - 0.5) * 14;
        grain.data[p] += n; grain.data[p + 1] += n; grain.data[p + 2] += n;
      }
      ctx.putImageData(grain, 0, 0);
      return { src: c.toDataURL('image/jpeg', 0.9), title: 'placeholder ' + (i + 1), caption: i === 0 ? 'replace these with your own pictures' : '' };
    });
  }

  /* ------------------------------------ room ------------------------------------- */
  let room = null;
  let works = [];
  let fadingWorks = [];  // every picture mid-fade-in, tracked independently of works/dictates so foyer pictures and the like (never added to either) still brighten up properly
  let behindCurtain = true;  // true until the loading curtain actually lifts — pictures that arrive while it's up skip the fade-in (no one's there to see it), so everything's simply present by the time the curtain's gone
  let rooms = [];      // [{ cx, W, D, x0, x1, z0, z1, frontInset, title, works }]
  let doorways = [];   // openings in the walls between rooms: [{ x, z, w }]
  let originX = 0;     // where the room being built sits along x

  function disposeGroup(g) {
    g.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach((m) => {
          if (m.map && !sharedTextures.has(m.map)) m.map.dispose();
          if (m.aoMap) m.aoMap.dispose();
          m.dispose();
        });
      }
    });
    scene.remove(g);
  }

  const daylit = [];   // every surface lit by the skylight, so it can breathe with the weather
  const skyMats = [];  // the emissive panels that stand in for daylight
  const matte = (hex, map, extra) => {
    const m = new THREE.MeshStandardMaterial(Object.assign({ color: col(hex), map: map || null, roughness: 1 }, extra || {}));
    daylit.push({ mat: m, base: m.envMapIntensity });
    return m;
  };
  const sky = (r, g, b, map) => {
    const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(r, g, b), map: map || null });
    skyMats.push({ mat: m, base: m.color.clone() });
    return m;
  };
  function box(w, h, d, material, x, y, z) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
    m.position.set(x + originX, y, z);
    m.castShadow = m.receiveShadow = true;
    room.add(m);
    return m;
  }
  function slab(w, h, material, x, y, z, rotY, rotX) {
    const geo = new THREE.PlaneGeometry(w, h);
    if (material.aoMap) geo.setAttribute('uv2', geo.attributes.uv);
    const m = new THREE.Mesh(geo, material);
    m.position.set(x + originX, y, z);
    if (rotY) m.rotation.y = rotY;
    if (rotX) m.rotation.x = rotX;
    m.receiveShadow = true;
    m.castShadow = true;  // walls and ceilings block the sun; only the sky and the glass are excused
    room.add(m);
    return m;
  }

  function buildShell(W, D, opts) {
    const H = CONFIG.wallHeight;
    const trimMat = matte(COLORS.trim, null, { roughness: 0.6 });
    const skirtMat = matte(COLORS.skirting, null, { roughness: 0.7 });
    const wallMat = (len, sides) => matte(COLORS.wall, wallShade(len, H, sides || {}));
    const dw = CONFIG.door.width, dh = CONFIG.door.height;

    const floor = slab(W, D, surface(COLORS.floor, W, D, CONFIG.floor, { roughness: CONFIG.floorGloss, envMapIntensity: 0.72,
      transparent: CONFIG.floorReflection > 0, opacity: 1 - CONFIG.floorReflection }), 0, 0, 0, 0, -Math.PI / 2);
    floor.renderOrder = -1; // under the shadows and pools painted on it
    // ceiling in four pieces around the skylight opening
    const sl = W - CONFIG.skylightMargin, sw = Math.min(1.5, D * 0.2);
    const ox = sl, oz = sw;   // always the long way along x (the corridor's own direction), so every room's skylight lines up regardless of that room's own width-to-depth ratio
    const ceilMat = matte(COLORS.ceiling, null, { emissive: col(COLORS.ceiling), emissiveIntensity: 0.2 });
    if (opts.skylight === false) {
      slab(W, D, ceilMat, 0, H, 0, 0, Math.PI / 2);                     // a small room, or one asked to do without: a plain ceiling
    } else {
      slab((W - ox) / 2, D, ceilMat, -(W + ox) / 4, H, 0, 0, Math.PI / 2);
      slab((W - ox) / 2, D, ceilMat, (W + ox) / 4, H, 0, 0, Math.PI / 2);
      slab(ox, (D - oz) / 2, ceilMat, 0, H, -(D + oz) / 4, 0, Math.PI / 2);
      slab(ox, (D - oz) / 2, ceilMat, 0, H, (D + oz) / 4, 0, Math.PI / 2);
    }

    // the back wall, plain
    slab(W, H, wallMat(W), 0, H / 2, -D / 2, 0);
    box(W, 0.1, 0.03, skirtMat, 0, 0.05, -D / 2 + 0.015);

    // a wall with a doorway in the middle: two segments, a lintel, its skirting, and (once) the frame
    const lintelMat = (len) => {
      const m = wallMat(len, { left: false, right: false, bottom: false });
      m.map.repeat.set(1, (H - dh) / H);
      m.map.offset.set(0, dh / H);
      return m;
    };
    const doorFrame = (x, z, rotY) => {
      [box(0.08, dh + 0.04, 0.24, trimMat, 0, (dh + 0.04) / 2, 0), box(0.08, dh + 0.04, 0.24, trimMat, 0, (dh + 0.04) / 2, 0), box(dw + 0.16, 0.08, 0.24, trimMat, 0, dh + 0.04, 0)]
        .forEach((b, i) => {
          const off = i === 0 ? -(dw / 2 + 0.04) : i === 1 ? dw / 2 + 0.04 : 0;
          b.position.set(x + originX + (rotY ? 0 : off), b.position.y, z + (rotY ? off : 0));
          b.rotation.y = rotY;
          b.castShadow = false;   // thin trim right above an open doorway; its shadow otherwise hangs as a dark bar in the passage below
        });
    };
    // side walls, with a doorway through to the neighbouring room where there is one
    [{ x: -W / 2, rot: Math.PI / 2, door: opts.doorLeft, outerRight: true }, { x: W / 2, rot: -Math.PI / 2, door: opts.doorRight, outerRight: false }].forEach((d) => {
      if (!d.door && opts.smallDoor && d.x > 0) { smallDoor(W, D, H, wallMat, skirtMat); return; }
      if (!d.door) {
        slab(D, H, wallMat(D), d.x, H / 2, 0, d.rot);
        box(D, 0.1, 0.03, skirtMat, d.x, 0.05, 0).rotation.y = d.rot;
        return;
      }
      const segD = (D - dw) / 2;
      [-1, 1].forEach((side) => {
        const z = side * (dw / 2 + segD / 2);
        // the segment's outer end is the room corner; which end that is in texture space depends on the wall's facing
        const cornerOnRight = (side < 0) === d.outerRight;
        slab(segD, H, wallMat(segD, cornerOnRight ? { left: false } : { right: false }), d.x, H / 2, z, d.rot);
        box(segD - 0.1, 0.1, 0.03, skirtMat, d.x, 0.05, z + side * 0.05).rotation.y = d.rot;   // stops inside the door frame
      });
      slab(dw, H - dh, lintelMat(dw), d.x, dh + (H - dh) / 2, 0, d.rot).castShadow = false;   // same reasoning as the frame trim: it would otherwise hang a dark bar in the doorway below
      if (d.x > 0) doorFrame(d.x, 0, Math.PI / 2); // the frame is shared, so only the room on its left builds it
    });

    // the front wall: with the foyer door in the first room, plain elsewhere
    if (opts.foyer) {
      const segW = (W - dw) / 2;
      [1, -1].forEach((side) => {
        const x = side * (dw / 2 + segW / 2);
        const mat = wallMat(segW, side > 0 ? { right: false } : { left: false });
        mat.side = THREE.DoubleSide;
        slab(segW, H, mat, x, H / 2, D / 2, Math.PI);
        box(segW - 0.1, 0.1, 0.03, skirtMat, x + side * 0.05, 0.05, D / 2 - 0.015).rotation.y = Math.PI;
      });
      const lintel = lintelMat(dw);
      lintel.side = THREE.DoubleSide;
      slab(dw, H - dh, lintel, 0, dh + (H - dh) / 2, D / 2, Math.PI).castShadow = false;
      doorFrame(0, D / 2, 0);
    } else {
      slab(W, H, wallMat(W), 0, H / 2, D / 2, Math.PI);
      box(W, 0.1, 0.03, skirtMat, 0, 0.05, D / 2 - 0.015);
    }

    // skylight: a light well up through the roof, glazed, with the sky drifting past above it
    if (opts.skylight !== false) {
    const wellH = 0.5;
    const fixMat = matte(COLORS.fixture, null, { roughness: 0.5, emissive: col(COLORS.fixture), emissiveIntensity: 0.55 });
    box(ox + 0.1, 0.012, 0.05, fixMat, 0, H - 0.006, -(oz / 2 + 0.025));   // trim around the opening
    box(ox + 0.1, 0.012, 0.05, fixMat, 0, H - 0.006, oz / 2 + 0.025);
    box(0.05, 0.012, oz, fixMat, -(ox / 2 + 0.025), H - 0.006, 0);
    box(0.05, 0.012, oz, fixMat, ox / 2 + 0.025, H - 0.006, 0);
    const wellMat = matte('#f4f1ea', null, { emissive: col('#f4f1ea'), emissiveIntensity: 0.45 });
    slab(oz, wellH, wellMat, -ox / 2, H + wellH / 2, 0, Math.PI / 2);      // the reveal, facing in
    slab(oz, wellH, wellMat, ox / 2, H + wellH / 2, 0, -Math.PI / 2);
    slab(ox, wellH, wellMat, 0, H + wellH / 2, -oz / 2, 0);
    slab(ox, wellH, wellMat, 0, H + wellH / 2, oz / 2, Math.PI);
    const glass = slab(ox, oz, new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, roughness: 0.04, metalness: 0, depthWrite: false }),
      0, H + wellH, 0, 0, Math.PI / 2);
    glass.castShadow = false;
    const barMat = matte(COLORS.skylightBars, null, { roughness: 0.5, emissive: col(COLORS.skylightBars), emissiveIntensity: 0.5 });
    const bars = Math.max(1, Math.round(sl / 1.2));
    for (let i = 1; i < bars; i++) {                                         // glazing bars across the length
      const t = -sl / 2 + (sl / bars) * i;
      box(0.04, 0.04, sw, barMat, t, H + wellH - 0.03, 0);
    }
    box(sl, 0.04, 0.04, barMat, 0, H + wellH - 0.03, 0); // and one down the middle
    }

    if (opts.foyer) {
      buildFoyer(W, D);
      buildBarrier(D / 2 - 0.55);
    }
    if (CONFIG.floorReflection > 0) mirrorWalls(W, D, opts);
  }

  // a small door, low in the right-hand wall, that only opens to the right colour and only admits
  // you crouched. Behind it, a corridor no taller than the door, which does not end
  const SMALL = { w: 0.72, h: 1.15 };
  // one small door: an opening in a wall at world x, facing the visitor who comes from -x, its leaf
  // hung on the far jamb so it swings away to +x. Returns the door for the lock to work with
  function hangSmallDoor(xw, zc, code, swing, base) {
    base = base || 0;
    const sw = SMALL.w + 0.08, sh = SMALL.h + 0.04;
    const trim = matte(COLORS.trim, null, { roughness: 0.6 });
    const DOOR_T = 0.07;                                         // leaf and frame thickness — thinner than a full-size door's, to match how small it is
    [-1, 1].forEach((side) => { const j = box(DOOR_T, sh, 0.05, trim, 0, sh / 2, 0); j.position.set(xw, base + sh / 2, zc + side * (sw / 2 + 0.025)); });
    const head = box(DOOR_T, 0.05, sw + 0.1, trim, 0, sh + 0.025, 0); head.position.set(xw, base + sh + 0.025, zc);
    const hinge = new THREE.Group();
    const lw = sw + 0.01, lh = sh + 0.01;                      // overlaps the frame by a centimetre, like a real door's rebate — a leaf that fell short of the opening left a genuine gap for the corridor's own daylight to leak through when shut
    hinge.position.set(xw, base, zc - lw / 2);
    if (swing < 0) hinge.scale.x = -1;                           // mirrored: opens away toward -x instead
    const doorFace = matte(COLORS.smallDoor || '#d4cfc6', null, { roughness: 0.95 });
    const leaf = new THREE.Mesh(new THREE.BoxGeometry(DOOR_T, lh, lw), doorFace);
    leaf.position.set(0, lh / 2, lw / 2);
    leaf.castShadow = leaf.receiveShadow = true;
    hinge.add(leaf);
    const brass = matte('#b08d57', null, { metalness: 0.8, roughness: 0.35 });
    const faceX = -DOOR_T / 2;                                    // the leaf's front face — hardware sits just proud of it, whatever the leaf's thickness
    const knob = new THREE.Mesh(new THREE.SphereGeometry(0.025, 16, 12), brass);
    knob.position.set(faceX - 0.015, lh * 0.5, lw - 0.08);
    hinge.add(knob);
    // the lock: six little dials in a brass rail, one per figure of the colour
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.03, 0.2), brass);
    rail.position.set(faceX - 0.002, lh * 0.5 - 0.09, lw - 0.15);
    hinge.add(rail);
    const dials = [];
    const dialGeo = new THREE.CylinderGeometry(0.011, 0.011, 0.014, 20);
    dialGeo.rotateZ(Math.PI / 2);                                             // axis through the door
    const mark = new THREE.BoxGeometry(0.002, 0.002, 0.008);
    for (let i = 0; i < 6; i++) {
      const dial = new THREE.Mesh(dialGeo, brass);
      dial.position.set(faceX - 0.014, lh * 0.5 - 0.09, lw - 0.15 - 0.075 + i * 0.03);
      const m = new THREE.Mesh(mark, matte('#2a2320', null, { roughness: 0.6 }));
      m.position.set(-0.008, 0.007, 0);
      dial.add(m);
      dial.rotation.x = Math.random() * Math.PI * 2;
      hinge.add(dial);
      dials.push(dial);
    }
    room.add(hinge);
    return { x: xw, z: zc, hinge, dials, leaf, spin: 0, open: false, unlocked: code == null, code, swing: swing || 1, sealed: false };
  }

  function smallDoor(W, D, H, wallMat, skirtMat) {
    const x = W / 2, rot = -Math.PI / 2, sw = SMALL.w + 0.08, sh = SMALL.h + 0.04;
    const segD = (D - sw) / 2;
    // the wall, seen from inside as plaster; and its outside, seen from the corridor, as a limewashed
    // exterior that the sun actually reaches, lit and shadowed by the corridor's own roof and skylight
    const outside = matte(COLORS.outside || '#eee4d0', null, { roughness: 1, envMapIntensity: 1.1 });
    [-1, 1].forEach((side) => {
      slab(segD, H, wallMat(segD, side < 0 ? { right: false } : { left: false }), x, H / 2, side * (sw / 2 + segD / 2), rot);
      slab(segD, H, outside, x + 0.012, H / 2, side * (sw / 2 + segD / 2), -rot);
      box(segD - 0.1, 0.1, 0.03, skirtMat, x, 0.05, side * (sw / 2 + segD / 2 + 0.05)).rotation.y = rot;
    });
    const lintel = wallMat(sw, { left: false, right: false, bottom: false });
    lintel.map.repeat.set(1, (H - sh) / H); lintel.map.offset.set(0, sh / H);
    slab(sw, H - sh, lintel, x, sh + (H - sh) / 2, 0, rot);                 // the wall above the door casts like the rest, or the sun comes through it
    slab(sw, H - sh, outside, x + 0.012, sh + (H - sh) / 2, 0, -rot);
    secret.door = hangSmallDoor(x + originX, 0, secret.code, 1);

    // the corridor: a gallery in miniature, with boards underfoot, plaster walls, and a skylight
    // running its whole length, barred every metre
    const cw = 0.9, ch = SMALL.h + 0.08, ox = 0.44, wellH = 0.3;
    const list = secret.dictates, gap = 1.0, sets = Math.max(1, secret.corridor.repeat | 0), span = list.length * gap;
    const x0 = x + 0.05;                                        // begins just behind the wall, inside the door's frame
    const lead = 1.05;                                          // the first picture hangs past where the open leaf lies
    const L = lead + sets * span + 0.9;                         // the same dictates, laid out `repeat` times over, then the door
    secret.corridor.length = L + 0.05;
    const cx = x0 + L / 2;
    slab(L, cw, surface(COLORS.floor, L, cw, CONFIG.floor, { roughness: CONFIG.floorGloss, envMapIntensity: 0.72 }), cx, 0.001, 0, 0, -Math.PI / 2);
    slab(L, ch, matte(COLORS.wall, wallShade(L, ch, {})), cx, ch / 2, -cw / 2, 0);
    slab(L, ch, matte(COLORS.wall, wallShade(L, ch, {})), cx, ch / 2, cw / 2, Math.PI);
    box(L, 0.06, 0.02, skirtMat, cx, 0.03, -cw / 2 + 0.01);
    box(L, 0.06, 0.02, skirtMat, cx, 0.03, cw / 2 - 0.01);
    const ceilMat = matte(COLORS.ceiling, null, { emissive: col(COLORS.ceiling), emissiveIntensity: 0.2 });
    slab(L, (cw - ox) / 2, ceilMat, cx, ch, -(cw + ox) / 4, 0, Math.PI / 2);
    slab(L, (cw - ox) / 2, ceilMat, cx, ch, (cw + ox) / 4, 0, Math.PI / 2);
    const fixMat = matte(COLORS.fixture, null, { roughness: 0.5, emissive: col(COLORS.fixture), emissiveIntensity: 0.55 });
    box(L, 0.012, 0.04, fixMat, cx, ch - 0.006, -(ox / 2 + 0.02));
    box(L, 0.012, 0.04, fixMat, cx, ch - 0.006, ox / 2 + 0.02);
    const wellMat = matte('#f4f1ea', null, { emissive: col('#f4f1ea'), emissiveIntensity: 0.45 });
    slab(L, wellH, wellMat, cx, ch + wellH / 2, -ox / 2, 0);
    slab(L, wellH, wellMat, cx, ch + wellH / 2, ox / 2, Math.PI);
    const glass = slab(L, ox, new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.1, roughness: 0.04, metalness: 0, depthWrite: false }), cx, ch + wellH, 0, 0, Math.PI / 2);
    glass.castShadow = false;
    const barMat = matte(COLORS.skylightBars, null, { roughness: 0.5, emissive: col(COLORS.skylightBars), emissiveIntensity: 0.5 });
    for (let d = 1; d < L; d += 1) box(0.035, 0.035, ox, barMat, x + d, ch + wellH - 0.025, 0);
    box(L, 0.035, 0.035, barMat, cx, ch + wellH - 0.025, 0);
    [x0, x0 + L].forEach((xEnd, i) => {                                       // closed at both ends
      slab(ox, wellH, wellMat, xEnd, ch + wellH / 2, 0, i ? -Math.PI / 2 : Math.PI / 2);
      box(0.04, 0.012, ox + 0.08, fixMat, xEnd + (i ? -0.02 : 0.02), ch - 0.006, 0);
      box(0.035, 0.035, ox, barMat, xEnd + (i ? -0.02 : 0.02), ch + wellH - 0.025, 0);
    });

    // the far end: a second small door with its own lock, and for now a dark cell behind it
    const xe = x0 + L;
    const endMat = matte(COLORS.wall, wallShade(cw, ch, {}));
    [-1, 1].forEach((side) => slab((cw - sw) / 2, ch, endMat, xe, ch / 2, side * (sw / 2 + (cw - sw) / 4), -Math.PI / 2));
    slab(sw, ch - sh, endMat, xe, sh + (ch - sh) / 2, 0, -Math.PI / 2);
    secret.door2 = hangSmallDoor(xe + originX, 0, secret.exitCode, 1);
    // behind the second door: a large room that is entirely black, floor, walls and ceiling, unlit and
    // unlightable, so that once inside there is nothing to see but the doorway you came in by
    const BW = 6, BH = 1.53, bx = xe + 0.05 + BW / 2;
    const black = new THREE.MeshBasicMaterial({ color: 0x000000 });
    [[BW, BW, bx, 0.001, 0, 0, -Math.PI / 2], [BW, BW, bx, BH, 0, 0, Math.PI / 2],
      [BW, BH, bx, BH / 2, -BW / 2, 0, 0], [BW, BH, bx, BH / 2, BW / 2, Math.PI, 0],
      [BW, BH, xe + 0.05 + BW, BH / 2, 0, -Math.PI / 2, 0]].forEach(([w, h, px, py, pz, rotY, rotX]) => {
      const m = slab(w, h, black, px, py, pz, rotY, rotX);
      m.castShadow = m.receiveShadow = false;
    });
    // the wall you came through, black on this side too, save for the doorway
    [-1, 1].forEach((side) => { const m = slab((BW - sw) / 2, BH, black, xe + 0.05, BH / 2, side * (sw / 2 + (BW - sw) / 4), Math.PI / 2); m.castShadow = m.receiveShadow = false; });
    { const m = slab(sw, BH - sh, black, xe + 0.05, sh + (BH - sh) / 2, 0, Math.PI / 2); m.castShadow = m.receiveShadow = false; }
    secret.black = { x0: xe + originX + 0.05, x1: xe + originX + 0.05 + BW, half: BW / 2 };

    // a mask, not a material trick: a plain black plate just inside the room, one-sided so it renders
    // only for someone looking back at the doorway from further in, and invisible from the corridor —
    // it hides the whole door and its frame at once, from any angle, rather than chasing individual
    // faces the way painting the door itself required. Sized with real margin around the frame's
    // silhouette (previously flush with the floor on one edge, which a grazing angle could see past)
    const doorMask = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 1.7), new THREE.MeshBasicMaterial({ color: 0x000000 }));
    doorMask.position.set(xe + 0.25 + originX, 0.8, 0);
    doorMask.rotation.y = Math.PI / 2;
    room.add(doorMask);

    // a small monument waiting in the dark: Anthropic's little crab, and the site's own address,
    // both invisible until the door is shut behind you. Kept hidden by more than the room's own
    // blackness — the sun's shadow camera doesn't reach out this far, so a lit material here could
    // otherwise show faintly from the very start; .visible is the real gate, the light is what it's for
    const crabX = xe + 0.05 + 2.4;
    const plinthH = 0.35, plinthW = 1.0, plinthD = 0.55;
    const plinthMat = new THREE.MeshStandardMaterial({ color: 0xe9e5dd, roughness: 0.85 });
    const crabOrange = new THREE.MeshStandardMaterial({ color: 0xd9764f, roughness: 0.8 });
    const crabPale = new THREE.MeshStandardMaterial({ color: 0xf4ece0, roughness: 0.5 });
    // the credit line, facing back toward the door so it's the first thing read on approach
    const drawLabel = (ctx) => {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = 'italic 700 56px ' + FONT;
      ctx.fillStyle = '#3a342e';
      ctx.fillText('By Claude,\nMidjourney', 256, 66);
    };
    const labelTex = canvasTexture(512, 128, drawLabel);
    refreshOnRealFont(labelTex, drawLabel);
    const labelW = 0.55, labelH = labelW * 128 / 512;
    const plinthLabel = new THREE.Mesh(new THREE.PlaneGeometry(labelW, labelH),
      new THREE.MeshStandardMaterial({ map: labelTex, transparent: true, roughness: 0.6 }));
    plinthLabel.position.set(crabX - plinthW / 2 - 0.005 + originX, plinthH / 2, 0);
    plinthLabel.rotation.y = -Math.PI / 2;
    room.add(plinthLabel);
    const crabParts = [
      box(plinthW, plinthH, plinthD, plinthMat, crabX, plinthH / 2, 0),
      plinthLabel,
      box(0.09, 0.15, 0.09, crabOrange, crabX - 0.30, plinthH + 0.075, 0),
      box(0.09, 0.15, 0.09, crabOrange, crabX - 0.12, plinthH + 0.075, 0),
      box(0.09, 0.15, 0.09, crabOrange, crabX + 0.12, plinthH + 0.075, 0),
      box(0.09, 0.15, 0.09, crabOrange, crabX + 0.30, plinthH + 0.075, 0),
      box(0.62, 0.14, 0.30, crabOrange, crabX, plinthH + 0.22, 0),
      box(0.90, 0.10, 0.32, crabOrange, crabX, plinthH + 0.34, 0),
      box(0.62, 0.22, 0.30, crabOrange, crabX, plinthH + 0.50, 0),
      box(0.05, 0.11, 0.02, crabPale, crabX - 0.15, plinthH + 0.50, 0.16),
      box(0.05, 0.11, 0.02, crabPale, crabX + 0.15, plinthH + 0.50, 0.16),
    ];
    crabParts.forEach((m) => { m.visible = false; });
    blocks.push({ x0: crabX + originX - plinthW / 2, x1: crabX + originX + plinthW / 2, z0: -plinthD / 2, z1: plinthD / 2 });
    const crabLight = new THREE.PointLight(0xfff0da, 0, 5, 2);
    crabLight.position.set(crabX + originX, 1.35, 0);
    room.add(crabLight);

    // the sign on the far wall: self-lit, so it reads clearly the length of the room regardless
    // of how far the crab's own light actually reaches
    const drawSign = (ctx) => {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '700 128px ' + FONT;
      ctx.fillStyle = '#f4ece0';
      ctx.fillText('& heptar.ch', 512, 118);
    };
    const signTex = canvasTexture(1024, 224, drawSign);
    refreshOnRealFont(signTex, drawSign);
    const signW = 3.2, signH = signW * 224 / 1024;
    const signMat = new THREE.MeshBasicMaterial({ map: signTex, transparent: true, depthWrite: false, toneMapped: false, opacity: 0 });
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(signW, signH), signMat);
    sign.position.set(xe + 0.05 + BW - 0.03 + originX, 0.85, 0);
    sign.rotation.y = -Math.PI / 2;
    sign.visible = false;
    room.add(sign);

    secret.reveal = { crabParts, light: crabLight, sign, revealed: false, timer: -1, prevOpen: false };

    // the dictates: small pictures on the left wall only, one every half metre, the whole
    // set repeated end to end as many times as asked. No labels, no numbers, no place in the tour;
    // a caption on approach, and the large view on a click
    for (let k = 0; k < sets; k++) {
      // each repeat hangs the set in a fresh order, so the corridor never quite repeats itself
      const order = list.slice();
      if (k > 0) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
      order.forEach((d, i) => {
        const xi = x0 + originX + lead + k * span + i * gap;   // world x: makeWork places by world coordinates
        const left = true;
        const w = makeWork(Object.assign({ size: 0.42, frame: 'float' }, d), v3(xi, 0.7, left ? -cw / 2 : cw / 2), v3(0, 0, left ? 1 : -1), left ? 0 : Math.PI, -1);
        w.pool.visible = false;
        w.dictate = true;
        w.room = -1;
        dictates.push(w);
      });
    }
  }

  // the walls again, hung upside down beneath the floor, so the reflection has a room around it and
  // the pictures' reflections in the next room stay behind their own mirrored wall
  function mirrorWalls(W, D, opts) {
    const H = CONFIG.wallHeight, dw = CONFIG.door.width, dh = CONFIG.door.height;
    const mat = matte(COLORS.wall);
    const under = (len, height, x, yTop, z, rot) => {
      const m = slab(len, height, mat, x, yTop - height / 2, z, rot);
      m.castShadow = m.receiveShadow = false;
      return m;
    };
    under(W, H, 0, 0, -D / 2, 0);
    [{ x: -W / 2, rot: Math.PI / 2, door: opts.doorLeft }, { x: W / 2, rot: -Math.PI / 2, door: opts.doorRight }].forEach((d) => {
      if (!d.door) { under(D, H, d.x, 0, 0, d.rot); return; }
      const segD = (D - dw) / 2;
      [-1, 1].forEach((side) => under(segD, H, d.x, 0, side * (dw / 2 + segD / 2), d.rot));
      under(dw, H - dh, d.x, -dh, 0, d.rot);               // the lintel, below the mirrored opening
      if (d.x > 0) frameBelow(d.x, 0, Math.PI / 2);
    });
    if (opts.foyer) {
      const segW = (W - dw) / 2;
      [-1, 1].forEach((side) => under(segW, H, side * (dw / 2 + segW / 2), 0, D / 2, Math.PI));
      under(dw, H - dh, 0, -dh, D / 2, Math.PI);
      frameBelow(0, D / 2, 0);
    } else {
      under(W, H, 0, 0, D / 2, Math.PI);
    }

    // the door frame, hung upside down with the rest
    function frameBelow(x, z, rotY) {
      const trim = matte(COLORS.trim, null, { roughness: 0.6 });
      [[0.08, dh + 0.04, -(dw / 2 + 0.04), -(dh + 0.04) / 2], [0.08, dh + 0.04, dw / 2 + 0.04, -(dh + 0.04) / 2], [dw + 0.16, 0.08, 0, -(dh + 0.04)]].forEach(([bw, bh, off, y]) => {
        const b = box(bw, bh, 0.24, trim, 0, y, 0);
        b.position.set(x + originX + (rotY ? 0 : off), y, z + (rotY ? off : 0));
        b.rotation.y = rotY;
        b.castShadow = b.receiveShadow = false;
      });
    }
  }

  // one sky over all the rooms
  function buildSky(x0, x1, maxD) {
    // a dome far out; the shader does the rest from the direction of each ray, so its size is immaterial
    const dome = new THREE.Mesh(new THREE.SphereGeometry(2500, 48, 24), skyMat);
    dome.renderOrder = 5;   // drawn after the room, so the depth test discards it behind walls before the cloud shader runs
    dome.position.set((x0 + x1) / 2, 0, 0);
    dome.castShadow = dome.receiveShadow = false;
    dome.frustumCulled = false;
    room.add(dome);
  }

  function buildFoyer(W, D) {
    const { width: FW, depth: FD, height: FH } = CONFIG.foyer;
    const z0 = D / 2 + 0.03, zc = z0 + FD / 2, z1 = z0 + FD;
    const trimMat = matte(COLORS.foyerTrim, null, { roughness: 0.6 });
    const skirtMat = matte(COLORS.foyerSkirting, null, { roughness: 0.7 });
    const wallMat = (len) => matte(COLORS.foyerWall, wallShade(len, FH, {}));

    slab(FW, FD, surface(COLORS.foyerFloor, FW, FD, CONFIG.floor === 'wood' ? 'wood' : CONFIG.floor * 1.5, { roughness: CONFIG.floorGloss + 0.1, envMapIntensity: 0.8 }), 0, 0, zc, 0, -Math.PI / 2);
    slab(FW, FD, surface(COLORS.foyerCeiling, FW, FD, 0, { emissive: col(COLORS.foyerCeiling), emissiveIntensity: 0.3 }), 0, FH, zc, 0, Math.PI / 2);
    slab(FD, FH, wallMat(FD), -FW / 2, FH / 2, zc, Math.PI / 2);
    slab(FD, FH, wallMat(FD), FW / 2, FH / 2, zc, -Math.PI / 2);
    box(FD, 0.1, 0.03, skirtMat, -FW / 2 + 0.015, 0.05, zc).rotation.y = Math.PI / 2;
