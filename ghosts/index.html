    stick.x = dx / STICK_R; stick.y = dy / STICK_R;
  });
  function endStick(e) {
    if (e.pointerId !== stickPointer) return;
    stickPointer = null;
    stick.x = stick.y = 0;
    ui.knob.style.transform = '';
  }
  ui.stick.addEventListener('pointerup', endStick);
  ui.stick.addEventListener('pointercancel', endStick);

  /* ----------------------------- previewing local images ------------------------- */
  function readFile(file) {
    return new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => resolve({ src: r.result, title: file.name.replace(/\.[^.]+$/, '') });
      r.readAsDataURL(file);
    });
  }
  /* ----------------------------------- music -------------------------------------- */
  // A playlist from the manifest ("music": [...]) plays through and starts again. Browsers only
  // allow sound after the visitor has done something, so it begins on their first click or key.
  // A second playlist, "secret.music", takes over inside the corridor and hands back on the way out.
  let soundOn = true;
  const trackName = (m) => m.title || decodeURIComponent(m.src.split('/').pop().replace(/\.[^.]+$/, '').replace(/[-_]+/g, ' '));
  function makePlayer() {
    const p = { list: [], index: 0, audio: null, volume: 0.5, fade: null, live: false };
    p.set = (list, volume) => {
      p.list = (list || []).map((m) => (typeof m === 'string' ? { src: m } : m)).filter((m) => m && m.src);
      p.index = 0;
      p.volume = volume || 0.5;
      if (p.audio) { p.audio.pause(); p.audio = null; }
      p.live = false;
    };
    p.fadeTo = (target, seconds, then) => {
      clearInterval(p.fade);
      const a = p.audio;
      if (!a) return;
      const start = Math.max(a.volume, 0.0001), goal = Math.max(target, 0.0001), t0 = performance.now();
      p.fade = setInterval(() => {
        const k = Math.min(1, (performance.now() - t0) / (seconds * 1000));
        const e = 0.5 - 0.5 * Math.cos(Math.PI * k);                 // eased, so the ends of the fade are gentle
        // exponential, not linear — loudness is perceived logarithmically, so a linear volume ramp
        // sounds like most of the drop happens in the first instant, then a long near-silent tail
        a.volume = k >= 1 ? target : start * Math.pow(goal / start, e);
        if (k >= 1) { clearInterval(p.fade); if (then) then(); }
      }, 50);
    };
    p.play = (i) => {
      const track = p.list[i];
      if (!track) return;
      p.index = i;
      if (!p.audio) {
        p.audio = new Audio();
        p.audio.preload = 'auto';
        p.audio.addEventListener('ended', () => { if (soundOn && p.live) p.play((p.index + 1) % p.list.length); });
        p.audio.addEventListener('error', () => { ui.musicTrack.textContent = 'could not play ' + trackName(track); });
      }
      p.audio.loop = p.list.length === 1;
      if (!p.audio.src.endsWith(track.src)) p.audio.src = track.src;
      p.audio.volume = 0;
      if (p.live) ui.musicTrack.textContent = CONFIG.showTrackName ? trackName(track) : '';
      const pr = p.audio.play();
      if (pr && pr.catch) pr.catch(() => { p.wanted = true; /* refused: the next gesture tries again */ });
      p.fadeTo(p.volume, 2.5);
    };
    p.start = () => {                                             // begin, or resume where it left off
      if (!soundOn || !p.list.length) return;
      p.live = true;
      if (!p.audio) { p.play(0); return; }
      if (p.audio.paused) { const pr = p.audio.play(); if (pr && pr.catch) pr.catch(() => {}); }
      p.fadeTo(p.volume, 1.5);   // unconditional, like stop() — cancels and reverses any fade-out still in flight
    };
    p.stop = (seconds, then) => {                                 // fade down and hold, ready to resume
      p.live = false;
      if (!p.audio) { if (then) then(); return; }
      p.fadeTo(0, seconds, () => { if (!p.live && p.audio) p.audio.pause(); if (then) then(); });
    };
    // Safari only lets a sound element play if it first played inside a real gesture. The corridor's
    // player starts from the walk, not a gesture, so on the first gesture it is woken silently and put
    // back to sleep: after that it may be started from anywhere
    p.prime = () => {
      if (p.primed || !p.list.length || p.live) return;
      p.primed = true;
      if (!p.audio) {
        p.audio = new Audio();
        p.audio.preload = 'auto';
        p.audio.addEventListener('ended', () => { if (soundOn && p.live) p.play((p.index + 1) % p.list.length); });
        p.audio.addEventListener('error', () => { ui.musicTrack.textContent = 'could not play ' + trackName(p.list[p.index]); });
        p.audio.src = p.list[0].src;
      }
      p.audio.volume = 0;
      const pr = p.audio.play();
      if (pr && pr.then) pr.then(() => { if (!p.live) p.audio.pause(); }).catch(() => { p.primed = false; });
    };
    return p;
  }
  const music = makePlayer(), secretMusic = makePlayer();
  let musicZone = 'gallery';
  const activePlayer = () => (musicZone === 'secret' ? secretMusic : music);

  function setMusic(list, volume) {
    music.set(list, volume);
    ui.music.classList.toggle('hidden', !music.list.length && !secretMusic.list.length);
    ui.musicTrack.textContent = '';
    ui.musicToggle.textContent = soundOn ? '' : '';
  }
  function startMusic() { activePlayer().start(); }
  // each frame: is the visitor in the corridor or the dark beyond it, and does that change the music
  let zoneCandidate = 'gallery', zoneCandidateSince = 0;
  function updateMusicZone() {
    const zone = secret && (inCorridor(pos.x, pos.z) || inBlack(pos.x, pos.z)) ? 'secret' : 'gallery';
    if (zone !== zoneCandidate) { zoneCandidate = zone; zoneCandidateSince = performance.now(); }
    if (zone === musicZone) return;
    if (performance.now() - zoneCandidateSince < 250) return;      // ignore a brief flicker right at the doorway
    if (zone === 'secret' && !secretMusic.list.length) return;         // no corridor playlist: the gallery's carries on
    const from = activePlayer();
    musicZone = zone;
    // sequenced, not a crossfade: silence first, then the new track, so the two never overlap and
    // audibly collide; the zone is checked again on arrival in case it changed back in the meantime
    from.stop(zone === 'secret' ? 4.0 : 2.0, () => {
      setTimeout(() => { if (musicZone === zone) activePlayer().start(); }, zone === 'secret' ? 900 : 300);
    });
  }
  ui.musicToggle.addEventListener('click', () => {
    soundOn = !soundOn;
    ui.musicToggle.textContent = soundOn ? '' : '';
    if (soundOn) activePlayer().start();
    else [music, secretMusic].forEach((p) => p.stop(0.8));
  });
  // sound may only begin inside a real gesture, so these hooks call it directly, and wake the other player too
  let audioUnlocked = false;
  ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => window.addEventListener(ev, () => {
    if (!audioUnlocked) { audioUnlocked = true; startMusic(); }
    [music, secretMusic].forEach((p) => p.prime());
  }, { passive: true }));

  function previewFiles(fileList) {
    const all = Array.from(fileList);
    const audio = all.filter((f) => f.type.startsWith('audio/'));
    if (audio.length) {
      setMusic(audio.map((f) => ({ src: URL.createObjectURL(f), title: f.name.replace(/\.[^.]+$/, '') })), music.volume);
      musicZone = 'gallery';
      startMusic();
    }
    const files = all.filter((f) => f.type.startsWith('image/'));
    if (!files.length) return;
    Promise.all(files.map(readFile)).then((list) => {
      build([{ works: list }], ui.title.textContent);
      showNote('previewing ' + list.length + (list.length === 1 ? ' picture' : ' pictures') + ' from this device. nothing has been uploaded; to publish them, put them in a folder beside this page and list them in images.json.');
    });
  }
  window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragover'); });
  window.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dragover'); });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove('dragover');
    previewFiles(e.dataTransfer.files);
  });
  ui.picker.addEventListener('change', () => { previewFiles(ui.picker.files); ui.picker.value = ''; });
  ui.picker.setAttribute('accept', 'image/*,audio/*');

  function showNote(text, withPicker) {
    ui.note.textContent = text;
    if (withPicker) {
      ui.note.append(' ');
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = 'choose pictures';
      b.addEventListener('click', () => ui.picker.click());
      ui.note.append(b, ' to preview them here.');
    }
    ui.note.classList.remove('hidden');
  }

  /* ---------------------------------- startup ------------------------------------ */
  ui.help.textContent = coarsePointer
    ? 'walk with the stick\nlook by dragging\ntap a picture to approach it, again to see it large'
    : 'Move: WASD\nLook: drag/click\nCycle pictures: [ ]\nToggle music: m\nCrouch: _';

  // find the manifest, trying each name in turn; keep the reason if none works
  function loadManifest(names) {
    const name = names[0];
    if (location.protocol === 'file:') return Promise.reject(new Error('this page was opened straight from disk, so it cannot read ' + name + '. serve the folder instead: run  python -m http.server  in it and open http://localhost:8000/'));
    return fetch(name, { cache: 'no-cache' })
      .then((r) => {
        if (r.status === 404) { if (names.length > 1) return loadManifest(names.slice(1)); throw new Error('no ' + name + ' beside this page'); }
        if (!r.ok) throw new Error(name + ' came back with status ' + r.status);
        return r.text().then((text) => {
          try { return { m: JSON.parse(text), name }; }
          catch (err) { throw new Error(name + ' is not valid JSON: ' + err.message.replace(/^JSON\.parse: ?/, '').replace(/ is not valid JSON$/, '')); }
        });
      });
  }

  fontsReady.then(() => loadManifest(CONFIG.manifest))
    .then(({ m, name }) => {
      // accept the field names an earlier version of this gallery used
      const framing = (r) => ({ frame: r.frame || m.frame, mount: r.mount != null ? r.mount : m.mount, frameColor: r.frameColor || m.frameColor });
      const norm = (arr, defaults) => (arr || []).map((d) => Object.assign({}, defaults || {}, d, { src: d.src || d.image || d.url || d.file }));
      const roomSpecs = Array.isArray(m) ? [{ works: norm(m) }]
        : Array.isArray(m.rooms) ? m.rooms.map((r) => ({ title: r.title, colors: r.colors, skylight: r.skylight, works: norm(r.works || r.artworks || r.images || r.pictures, framing(r)), sculptures: r.sculptures || [] }))
        : [{ works: norm(m.works || m.artworks || m.images || m.pictures, framing(m)), sculptures: m.sculptures || [] }];
      const all = roomSpecs.reduce((a, r) => a.concat(r.works), []);
      if (!all.length) throw new Error(name + ' lists no works');
      const bad = all.filter((d) => !d.src);
      if (bad.length) throw new Error(name + ': ' + bad.length + (bad.length === 1 ? ' work has' : ' works have') + ' no "src"');
      if (m.colors) Object.assign(COLORS, m.colors);
      foyerSpec = (!Array.isArray(m) && m.foyer) ? {
        works: norm(m.foyer.works || m.foyer.artworks || m.foyer.images || m.foyer.pictures, framing(m.foyer)).filter((d) => d.src),
        sculptures: m.foyer.sculptures || [],
      } : null;
      if (!Array.isArray(m) && m.secret) {
        const sc = typeof m.secret === 'string' ? { code: m.secret } : m.secret;
        const cd = sc.corridor || {};
        const rawD = cd.dictates || sc.dictates || m.dictates || [];
        let dl = Array.isArray(rawD) ? rawD.map((d) => (typeof d === 'string' ? { src: d } : Object.assign({}, d, { src: d.src || d.image || d.url || d.file }))).filter((d) => d.src) : [];
        if (!dl.length) dl = placeholders().concat(placeholders()).map((d, i) => Object.assign({}, d, { title: '', caption: 'placeholder dictate ' + (i + 1) }));
        const ex = sc.exit && typeof sc.exit === 'object' ? sc.exit : { code: sc.exit != null ? sc.exit : cd.code };
        secret = { code: String(sc.code || '').replace(/^#/, '').toLowerCase(), door: null, door2: null, dictates: dl,
          exitCode: String(ex.code != null ? ex.code : '#000000').replace(/^#/, '').toLowerCase(),
          corridor: { repeat: cd.repeat != null ? cd.repeat : (sc.repeat != null ? sc.repeat : 1), length: 0 } };
      } else secret = null;
      build(roomSpecs, Array.isArray(m) ? null : m.title, Array.isArray(m) ? null : m.subtitle, Array.isArray(m) ? null : m.intro, Array.isArray(m) ? null : m.note);
      setMusic(m.music, m.musicVolume);
      secretMusic.set(secret && (m.secret.music || (m.secret.corridor && m.secret.corridor.music)) || [], secret && (m.secret.musicVolume || (m.secret.corridor && m.secret.corridor.musicVolume)));
      musicZone = 'gallery';
      ui.music.classList.toggle('hidden', !music.list.length && !secretMusic.list.length);
      setGhost(!!(m.ghost != null ? m.ghost : CONFIG.ghost), true);
    })
    .catch((err) => {
      build([{ works: placeholders(), sculptures: [{ title: 'placeholder form', caption: 'a sculpture goes here' }] }], CONFIG.title);
      showNote('showing placeholders: ' + err.message + '. fix that to hang your own pictures, or', true);
    });

  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight;
    camera.fov = camera.aspect < 1 ? 72 : 58;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // if frames keep falling behind, render fewer pixels; the geometry and lighting stay as they are
  let slowFor = 0, fpsAcc = 0, fpsN = 0;
  function watchFrameRate(dt) {
    if (params.has('fps')) { fpsAcc += dt; fpsN++; if (fpsAcc > 1) { ui.note.classList.remove('hidden'); ui.note.textContent = Math.round(fpsN / fpsAcc) + ' fps at ×' + pixelRatio.toFixed(2); fpsAcc = 0; fpsN = 0; } }
    if (dt > 1 / 40) slowFor += dt; else slowFor = Math.max(0, slowFor - dt * 0.5);
    if (slowFor > 3 && pixelRatio > 1) {
      pixelRatio = Math.max(1, pixelRatio - 0.25);
      renderer.setPixelRatio(pixelRatio);
      slowFor = 0;
    }
  }

  // a picture gains its true colour gradually once its texture arrives, rather than snapping in.
  // Starts well below the idle placeholder's own brightness (81%), or the swing is too small to see —
  // same warm hue, just genuinely dim at the moment of arrival, blooming up from there
  const fadeFromCol = col(COLORS.placeholder).multiplyScalar(0.16), fadeToCol = new THREE.Color(1, 1, 1);
  function updateFades(dt) {
    for (let i = fadingWorks.length - 1; i >= 0; i--) {
      const w = fadingWorks[i];
      w.fadeIn = Math.min(1, w.fadeIn + dt / 2.5);
      const eased = 1 - (1 - w.fadeIn) * (1 - w.fadeIn);   // quick at first, settling in
      w.img.material.color.copy(fadeFromCol).lerp(fadeToCol, eased);
      if (w.mirror) w.mirror.img.material.color.copy(fadeFromCol).lerp(fadeToCol, eased);
      if (w.fadeIn >= 1) fadingWorks.splice(i, 1);   // done — stop tracking it
    }
  }

  let last = performance.now();
  function frame(now) {
    const raw = (now - last) / 1000;
    last = now;
    if (focus) stepFocus(raw); else if (!flatOpen) walk(Math.min(0.05, raw));
    eyeH += ((crouching ? CONFIG.crouchHeight : CONFIG.eyeHeight) - eyeH) * Math.min(1, raw * 7);
    pos.y = eyeH;
    stepDoor(raw);
    updateReveal(raw);
    updateLock();
    updateMusicZone();
    updateFades(raw);
    camera.position.copy(pos);
    camera.rotation.set(pitch, yaw, 0);
    updateLighting(Math.min(0.1, raw), now / 1000);
    haunt(raw);
    updateCaption();
    renderer.render(scene, camera);
    watchFrameRate(raw);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
