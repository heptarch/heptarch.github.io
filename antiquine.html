<style>
/* Layout: one handheld, centred; the game screen is the only lit thing on the page. */
:root{
  --room:#1e1e1d;        /* the dark around the device */
  --bezel:#474745;
  --bezel-hi:#5c5c59;
  --bezel-lo:#2a2a29;
  --etch:#8e8e89;        /* moulded lettering on the case */
  --glass:#0c0c0c;
  --paper:#ececea;       /* readout card, phone widths */
  --paper-ink:#111111;
  --ui: Geneva, Verdana, "DejaVu Sans", sans-serif;
  color-scheme: dark;
}
html,body{height:100%}
body{
  margin:0; background:var(--room); color:var(--etch); font-family:var(--ui);
  box-sizing:border-box; min-height:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
  padding-block:24px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.device{
  max-width:100%; box-sizing:border-box;
  padding:16px 24px 22px; border-radius:28px;
  background:linear-gradient(180deg, var(--bezel-hi), var(--bezel) 18%, var(--bezel) 82%, var(--bezel-lo));
  box-shadow: inset 0 1px 0 var(--bezel-hi), inset 0 -2px 0 var(--bezel-lo), 0 24px 60px #000000;
}
.case-top{
  display:flex; justify-content:space-between; align-items:center;
  padding:0 2px 12px; font-size:10px; letter-spacing:.24em; text-transform:uppercase; color:var(--etch);
}
.led{ width:6px; height:6px; border-radius:50%; background:var(--bezel-lo); box-shadow:inset 0 1px 1px #000000, 0 1px 0 var(--bezel-hi); }
#screen{
  display:block; max-width:100%;
  image-rendering:crisp-edges; image-rendering:pixelated;
  border:3px solid var(--glass); border-radius:3px; background:#ffffff;
  touch-action:manipulation; outline:none;
}
#screen:focus-visible{ outline:2px solid var(--etch); outline-offset:4px; }
.hint{ font-size:11px; letter-spacing:.06em; color:var(--etch); text-align:center; max-width:60ch; }
.hint kbd{ font-family:var(--ui); border:1px solid var(--bezel-hi); border-radius:3px; padding:0 4px; }
#readout{ position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
@media (max-width:620px){
  .device{ padding:10px 10px 14px; border-radius:18px; }
  .case-top{ padding-bottom:8px; }
  #readout{
    position:static; width:auto; height:auto; overflow:visible; clip-path:none; white-space:normal;
    box-sizing:border-box; width:100%; max-width:420px; min-height:5.6em;
    background:var(--paper); color:var(--paper-ink); border:2px solid #000000; border-radius:4px;
    box-shadow:3px 3px 0 #000000; padding:10px 12px; font-size:15px; line-height:1.45;
  }
  #readout b{ display:block; margin-bottom:2px; }
  .hint .keys{ display:none; }
}
</style>
<div class="device">

<script>
// font.js — a small proportional bitmap face in the Geneva/Chicago lineage.
// Each glyph: "top row0 row1 ...". Cell is 11 rows: accents 0-1, caps 2-8, descenders 9-10.
const FONT = {
  'A':'2 01110 10001 10001 11111 10001 10001 10001',
  'B':'2 11110 10001 10001 11110 10001 10001 11110',
  'C':'2 01110 10001 10000 10000 10000 10001 01110',

  'Q':'2 01110 10001 10001 10001 10101 10010 01101',
  'R':'2 11110 10001 10001 11110 10100 10010 10001',
  'S':'2 01110 10001 10000 01110 00001 10001 01110',
  'T':'2 11111 00100 00100 00100 00100 00100 00100',
  'U':'2 10001 10001 10001 10001 10001 10001 01110',
  'V':'2 10001 10001 10001 10001 01010 01010 00100',

  'X':'2 10001 10001 01010 00100 01010 10001 10001',
  'Y':'2 10001 10001 01010 00100 00100 00100 00100',
  'Z':'2 11111 00001 00010 00100 01000 10000 11111',
  'a':'4 0110 0001 0111 1001 0111',
  'b':'2 1000 1000 1110 1001 1001 1001 1110',
  'c':'4 0111 1000 1000 1000 0111',
  'd':'2 0001 0001 0111 1001 1001 1001 0111',
  'e':'4 0110 1001 1111 1000 0111',
  'f':'2 011 100 111 100 100 100 100',
  'g':'4 0111 1001 1001 1001 0111 0001 0110',
  'h':'2 1000 1000 1110 1001 1001 1001 1001',
  'i':'2 1 0 1 1 1 1 1',
  'j':'2 01 00 01 01 01 01 01 01 10',
  'k':'2 1000 1000 1001 1010 1100 1010 1001',
  'l':'2 1 1 1 1 1 1 1',
  'm':'4 1110110 1001001 1001001 1001001 1001001',
  'n':'4 1110 1001 1001 1001 1001',
  'o':'4 0110 1001 1001 1001 0110',
  'p':'4 1110 1001 1001 1001 1110 1000 1000',
  'q':'4 0111 1001 1001 1001 0111 0001 0001',
  'r':'4 101 110 100 100 100',
  's':'4 0111 1000 0110 0001 1110',
  't':'3 100 111 100 100 100 011',
  'u':'4 1001 1001 1001 1001 0111',
  'v':'4 10001 10001 01010 01010 00100',
  'w':'4 1000001 1000001 1001001 1010101 0100010',
  'x':'4 10001 01010 00100 01010 10001',
  'y':'4 1001 1001 1001 1001 0111 0001 0110',
  'z':'4 1111 0001 0110 1000 1111',
  '0':'2 0110 1001 1011 1101 1001 1001 0110',
  '1':'2 010 110 010 010 010 010 111',
  '2':'2 0110 1001 0001 0010 0100 1000 1111',
  '3':'2 1110 0001 0001 0110 0001 0001 1110',
  '4':'2 0010 0110 1010 1010 1111 0010 0010',
  '5':'2 1111 1000 1110 0001 0001 1001 0110',
  '6':'2 0110 1000 1000 1110 1001 1001 0110',
  '7':'2 1111 0001 0010 0010 0100 0100 0100',
  '8':'2 0110 1001 1001 0110 1001 1001 0110',
  '9':'2 0110 1001 1001 0111 0001 0001 0110',
  '.':'8 1',
  ',':'8 01 01 10',
  ':':'5 1 0 0 1',
  ';':'5 01 00 00 01 01 10',

  '?':'2 0110 1001 0001 0010 0100 0000 0100',
  "'":'2 1 1',
  '"':'2 101 101',
  '-':'6 111',
  '(':'2 01 10 10 10 10 10 10 10 01',
  ')':'2 10 01 01 01 01 01 01 01 10',
  '/':'2 001 001 010 010 010 100 100',
  '&':'2 01100 10010 10100 01000 10101 10010 01101',
  '+':'4 00100 00100 11111 00100 00100',
  '=':'5 1111 0000 1111',
  '*':'3 101 010 101',
  'ä':'2 1001 0000 0110 0001 0111 1001 0111',
  'ö':'2 1001 0000 0110 1001 1001 1001 0110',
  'ü':'2 1001 0000 1001 1001 1001 1001 0111',
  'é':'2 0010 0100 0110 1001 1111 1000 0111',
  'Ö':'0 01010 00000 01110 10001 10001 10001 10001 10001 01110',
  'Ü':'0 01010 00000 10001 10001 10001 10001 10001 10001 01110',
  'ß':'2 0110 1001 1010 1010 1001 1001 1010',
  '>':'4 1000 0110 0001 0110 1000',
  '⊥':'2 00100 00100 00100 00100 00100 00100 11111',
  '⊤':'2 11111 00100 00100 00100 00100 00100 00100',
  '→':'4 000100 000010 111111 000010 000100',
  '□':'4 11111 10001 10001 10001 11111',
  '¬':'5 1111 0001 0001'
};
// gfx.js — pixel primitives on a 384x256 logical screen, five greys plus black.
const W = 384, H = 256;
const C = { K:'#000000', D:'#565656', G:'#8d8d8d', L:'#c3c3c3', P:'#e3e3e3', W:'#ffffff' };
let g, curFill = null;
function use(c){ g = c; curFill = null; }
function setc(c){ if (c !== curFill){ g.fillStyle = c; curFill = c; } }
function px(x,y,c){ setc(c); g.fillRect(x,y,1,1); }
function rect(x,y,w,h,c){ if (w>0 && h>0 && c){ setc(c); g.fillRect(x,y,w,h); } }
function frame(x,y,w,h,c=C.K){ rect(x,y,w,1,c); rect(x,y+h-1,w,1,c); rect(x,y,1,h,c); rect(x+w-1,y,1,h,c); }
function fillFn(x,y,w,h,fn){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++){ const c=fn(i,j); if(c) px(i,j,c); } }
function box(x,y,w,h,f,l=C.K){ if (typeof f==='function') fillFn(x,y,w,h,f); else rect(x,y,w,h,f); if (l) frame(x,y,w,h,l); }

// ordered dither: b replaces a at `lvl` of 16
const BAYER = [0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const bay = (x,y) => BAYER[(y&3)*4+(x&3)];
const dith = (a,b,lvl) => (x,y) => bay(x,y) < lvl ? b : a;
const chk  = (a,b) => (x,y) => ((x+y)&1) ? b : a;

// any shape from a pixel-centre test: fill inside, 1px outline on the rim
function shape(bx,by,bw,bh,test,f,l=C.K){
  bx=Math.floor(bx); by=Math.floor(by); bw=Math.ceil(bw); bh=Math.ceil(bh);
  const m = new Uint8Array(bw*bh);
  for(let j=0;j<bh;j++) for(let i=0;i<bw;i++) if(test(bx+i+.5,by+j+.5)) m[j*bw+i]=1;
  const at=(i,j)=> i>=0 && j>=0 && i<bw && j<bh && m[j*bw+i]===1;
  for(let j=0;j<bh;j++) for(let i=0;i<bw;i++){
    if(!m[j*bw+i]) continue;
    const x=bx+i, y=by+j;
    const edge = !at(i-1,j) || !at(i+1,j) || !at(i,j-1) || !at(i,j+1);
    const c = (edge && l) ? l : (typeof f==='function' ? f(x,y) : f);
    if (c) px(x,y,c);
  }
}
function oval(x,y,w,h,f,l=C.K){
  const cx=x+w/2, cy=y+h/2, rx=w/2, ry=h/2;
  shape(x,y,w,h,(X,Y)=>((X-cx)/rx)**2+((Y-cy)/ry)**2<=1,f,l);
}
function inPoly(p,x,y){
  let c=false;
  for(let i=0,j=p.length-1;i<p.length;j=i++){
    const [xi,yi]=p[i],[xj,yj]=p[j];
    if(((yi>y)!==(yj>y)) && (x<(xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c;
  }
  return c;
}
function poly(p,f,l=C.K){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const [a,b] of p){ x0=Math.min(x0,a); y0=Math.min(y0,b); x1=Math.max(x1,a); y1=Math.max(y1,b); }
  shape(x0,y0,x1-x0+1,y1-y0+1,(X,Y)=>inPoly(p,X,Y),f,l);
}
function rrect(x,y,w,h,r,f,l=C.K){
  shape(x,y,w,h,(X,Y)=>{
    const dx=Math.max(x+r-X, X-(x+w-r), 0), dy=Math.max(y+r-Y, Y-(y+h-r), 0);
    return dx*dx+dy*dy <= r*r;
  },f,l);
}
function line(x0,y0,x1,y1,c=C.K){
  x0|=0; y0|=0; x1|=0; y1|=0;
  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1;
  let e=dx+dy;
  for(;;){
    px(x0,y0,c);
    if(x0===x1 && y0===y1) break;
    const e2=2*e;
    if(e2>=dy){ e+=dy; x0+=sx; }
    if(e2<=dx){ e+=dx; y0+=sy; }
  }
}
// darken everything in a region by `base` steps of grey, one more where the dither says so
const GREYS=[0,86,141,195,227,255];
function darken(base,lvl,y0=16,y1=224,x0=0,x1=W){
  const im=g.getImageData(x0,y0,x1-x0,y1-y0), d=im.data, w=x1-x0;
  for(let i=0;i<d.length;i+=4){
    const p=i>>2, x=x0+p%w, y=y0+((p/w)|0);
    let k=GREYS.indexOf(d[i]); if(k<0) continue;
    k=Math.max(0,k-base-(bay(x,y)<lvl?1:0));
    d[i]=d[i+1]=d[i+2]=GREYS[k];
  }
  g.putImageData(im,x0,y0);
}
function path(pts,c=C.K){ for(let i=1;i<pts.length;i++) line(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1],c); }

// sprites: k=black d=dark g=grey l=light p=pale w=white, '.'=clear
const SPR_C = { k:C.K, d:C.D, g:C.G, l:C.L, p:C.P, w:C.W };
function spr(rows,x,y){ rows.forEach((r,j)=>{ for(let i=0;i<r.length;i++){ const c=SPR_C[r[i]]; if(c) px(x+i,y+j,c); } }); }

// bitmap text
const GL = {};
for (const [ch,s] of Object.entries(FONT)){ const t=s.split(' '); GL[ch]={ top:+t[0], rows:t.slice(1), w:t[1].length }; }
const ALIAS = { '’':"'", '‘':"'", '“':'"', '”':'"', '—':'-', '–':'-' };
const glyph = ch => GL[ALIAS[ch] || ch];
function measure(s,bold=false){
  let w=0;
  for(const ch of s){ if(ch===' '){ w+=3; continue; } const gl=glyph(ch); if(gl) w+=gl.w+1+(bold?1:0); }
  return Math.max(0,w-1);
}
function text(s,x,y,c=C.K,bold=false,sc=1){
  setc(c);
  for(const ch of s){
    if(ch===' '){ x+=3*sc; continue; }
    const gl=glyph(ch); if(!gl) continue;
    gl.rows.forEach((r,j)=>{
      for(let i=0;i<r.length;i++) if(r[i]==='1'){
        g.fillRect(x+i*sc, y+(gl.top+j)*sc, sc, sc);
        if(bold) g.fillRect(x+(i+1)*sc, y+(gl.top+j)*sc, sc, sc);
      }
    });
    x += (gl.w+1+(bold?1:0))*sc;
  }
  return x;
}
function itext(s,x,y,c=C.K){
  setc(c);
  for(const ch of s){
    if(ch===' '){ x+=3; continue; }
    const gl=glyph(ch); if(!gl) continue;
    gl.rows.forEach((r,j)=>{ const dx=(10-(gl.top+j))>>2; for(let i=0;i<r.length;i++) if(r[i]==='1') g.fillRect(x+i+dx,y+gl.top+j,1,1); });
    x+=gl.w+1;
  }
}
function wrap(s,maxW,bold=false){
  const out=[];
  for(const para of s.split('\n')){
    let line='';
    for(const word of para.split(' ')){
      const t = line ? line+' '+word : word;
      if(measure(t,bold)<=maxW || !line) line=t; else { out.push(line); line=word; }
    }
    out.push(line);
  }
  return out;
}
// rooms1.js — shared scenery, the study, the kitchen.
const SY = 16, FLOOR = 178;
let SPOTS = [];
function hs(id,x,y,w,h){ SPOTS.push({id,x,y,w,h}); }

function wallMotif(base,dot,step,y0=SY,y1=FLOOR){
  rect(0,y0,W,y1-y0,base);
  for(let r=0,y=y0+step/2;y<y1;y+=step,r++) for(let x=(r%2)*(step/2)+2;x<W;x+=step){ px(x,y,dot); px(x+1,y,dot); }
}
function planks(y0=FLOOR,y1=224){
  rect(0,y0,W,y1-y0,C.L);
  for(let r=0,y=y0;y<y1;y+=7,r++){
    rect(0,y+6,W,1,C.G);
    for(let x=(r*23)%47;x<W;x+=47) rect(x,y,1,6,C.G);
  }
}
function baseboard(y=FLOOR-4){ box(-1,y,W+2,5,C.W); }

function bookRow(x,base,list){
  const u={};
  for(const [w,h,f,s,id] of list){
    if(!h){ x+=w; continue; }
    const y=base-h;
    box(x,y,w,h,f);
    const inv=(f===C.D||f===C.G)?C.L:C.D;
    if(s==='band'){ rect(x+1,y+3,w-2,1,inv); rect(x+1,y+h-4,w-2,1,inv); }
    if(s==='label' && w>6) box(x+2,y+5,w-4,7,f===C.W?C.P:C.W);
    if(s==='roman'){ box(x+2,y+5,w-4,7,C.W); rect(x+(w>>1),y+7,1,3,C.K); }
    if(s==='anti'){ rect(x+2,y+6,3,1,C.W); rect(x+4,y+7,1,2,C.W); }
    if(s==='pm'){ rect(x+1,y+3,w-2,1,C.L); rect(x+1,y+5,w-2,1,C.L); box(x+2,y+9,w-4,6,C.L); rect(x+1,y+h-5,w-2,1,C.L); }
    if(id){
      const r=u[id];
      if(!r) u[id]=[x,y,w,h];
      else { const x0=Math.min(r[0],x), y0=Math.min(r[1],y), x1=Math.max(r[0]+r[2],x+w), y1=Math.max(r[1]+r[3],y+h); u[id]=[x0,y0,x1-x0,y1-y0]; }
    }
    x+=w;
  }
  for(const [id,r] of Object.entries(u)) hs(id,r[0],r[1]-2,r[2],r[3]+2);
}

/* ---------------- STUDY ---------------- */
function drawStudy(){
  wallMotif(C.P,C.L,8);
  planks(); baseboard();

  // bookshelf
  hs('shelves',8,24,108,158);
  fillFn(13,31,94,142,chk(C.G,C.D));
  box(12,30,5,148,C.L); box(107,30,5,148,C.L);
  box(8,26,108,5,C.L);
  [66,104,142].forEach(y=>box(12,y,100,4,C.L));
  box(10,172,104,8,C.L);
  const {D,G,L,W:Wh} = C;
  const R=(n,b)=>Array(n).fill(b);
  bookRow(17,66,[...R(3,[10,31,D,'pm','principia']),...R(2,[9,30,G,'band','frege']),[11,28,L,'label','cantor'],...R(2,[8,29,Wh,'band','hilbert']),[7,25,G,null,'quine'],[7,26,L,'band','weyl']]);
  bookRow(17,104,[[15,31,L,'label','schilpp'],[8,24,Wh,'band','relativity'],[9,27,D,'band','vonneumann'],...R(3,[7,32,G,'band','leibniz']),[9,29,Wh,'label','kant'],[7,27,D,'band','plato'],[8,28,L,'label','husserl'],[7,25,G,'band','carnap'],[6,22,Wh,null,'wittgenstein']]);
  bookRow(17,142,[[9,24,Wh,'label','dissertation'],[9,26,L,'roman','incompleteness'],[2],[8,27,G,'label','ch1940'],[8,26,Wh,'band','cohen'],[7,25,L,'band','dialectica'],[11,31,D,'label','games'],[6,20,Wh,null,'constitution'],...R(3,[8,29,G,'band','menger'])]);
  bookRow(17,172,[[12,24,D,'band','bible'],[11,25,G,'label','grimm'],[8,21,Wh,null,'novel'],[9,23,D,'band','psychical'],[13,25,L,'band','medical'],[14,24,G,'label','dictionary'],[16,22,Wh,'band','album'],[7,25,C.K,'anti','antiquine']]);

  // clock: ten past four
  oval(137,39,27,27,C.G); oval(140,42,21,21,C.W);
  px(150,43,C.K); px(150,61,C.K); px(141,52,C.K); px(159,52,C.K);
  line(150,52,157,48); line(150,52,154,55); line(151,52,154,54);
  hs('clock',136,38,29,29);

  // window, night
  box(186,36,80,86,C.W);
  fillFn(190,40,72,78,(x,y)=> bay(x,y) < Math.round(1+(y-40)/78*5) ? C.G : C.D);
  oval(238,45,13,13,C.P,null);
  [[190,113,200,100],[191,113,201,100],[200,100,206,88],[201,100,207,88],[206,88,216,76],[216,76,230,68],[230,68,246,66],
   [206,88,197,80],[216,76,214,62],[214,62,220,52],[230,68,236,57],[200,100,191,95],[246,66,256,70]].forEach(b=>line(...b));

// state.js — the things in the house that change.
// DYN[id]() may replace an object's pages and give its balloon a button; null keeps text.js.
// USE(item, target) is what happens when something from the pocket is used on something.
const lampOn = () => S.flags.lamp !== 'dead';
const ITEMS = ['bulb','matches','vletter','tin','apronItem','key','noteItem','hatItem'];
const IN_POCKET = {
  bulb:      f => f.bulb==='pocket',
  matches:   f => f.matches==='pocket',
  vletter:   f => f.letter==='pocket',
  tin:       f => f.tin==='pocket',
  apronItem: f => f.apron==='pocket',
  key:       f => f.key==='pocket',
  noteItem:  f => f.note==='pocket',
  hatItem:   f => f.hat==='pocket'
};
function goOut(){ S.flags.hat='worn'; S.held=null; S.dialog=null; S.mode='walk'; S.walk=0; save(); return null; }
const take = (label, fn) => ({ label, run(){ const r=fn(S.flags); refresh(); return r; } });

const DYN = {
  lamp(){
    const f=S.flags;
    if (f.lamp==='on') return null;
    if (f.lamp==='fixed') return { pages:['The lamp, with the refrigerator bulb in it. The refrigerator has not complained.'] };
    if (f.bulb==='pocket') return { pages:['The lamp is still dark. There is a bulb in his pocket.'] };
    return { pages:[
      'He works the switch. Nothing. The bulb has gone, which he had not known it was allowed to do.',
      'There are no spare bulbs; Adele kept those. He thinks of every light in the house, and of the one he has never seen go out.' ] };
  },
  light(){
    const f=S.flags;
    if (f.bulb==='fridge' && f.lamp==='dead') return { act: take('Take bulb', f=>{ f.bulb='pocket';
      return ['He unscrews the bulb. It is warm. For the first time, he is certain that the light in the refrigerator is off.']; }) };
    if (f.bulb!=='fridge') return { pages:['An empty socket. The light is off. He has seen it for himself.'] };
    return null;
  },
  basket(){
    const f=S.flags;
    if (f.matches==='basket') return { act: take('Take matches', f=>{ f.matches='pocket';
      return ['He takes the matches back out of the basket. It is the first time he has changed his mind about anything since July.']; }) };
    return { pages:['Empty now. He throws nothing away, and he has taken back the one thing he did.'] };
  },
  mail(){
    const f=S.flags;
    if (f.clasp==='unseen') return null;
    if (f.letter==='mat') return {
      pages:[ TEXT.mail.pages[0],
        "He is sure who sent the one from Vienna. It is addressed in his mother's hand, and the postmark is from this week. She died in 1966." ],
      act: take('Take letter', f=>{ f.letter='pocket'; f.tin='pocket';
        return ['He opens it there on the mat. Folded inside the letter is a small flat tin, and something in the tin rattles.']; }) };
    return { pages:['Letters on the mat: the Institute, the hospital, a bill. He will open them once he is sure who sent them.'] };
  },
  apron(){
    const f=S.flags;
    if (f.apron==='hook' && f.tin==='oven') return { act: take('Take apron', f=>{ f.apron='pocket';

    if (f.apron==='hung') return { pages:["Adele's apron, back on its hook. He could not get the bow right."] };

  },
  note(){
    const f=S.flags;
    if (f.thresh==='seen' && f.note==='fridge') return { act: take('Take note', f=>{ f.note='pocket';
      return ['He slides the note out from under the magnet. The magnet stays where it is, holding nothing.']; }) };
    return null;
  },
  door(){
    const f=S.flags;
    if (f.door!=='open') return null;
    return { pages:['The door is open. He did not open it. The night outside is mild, and someone is waiting at the gate.'],
      act:{ label:'Go out', run(){ return S.flags.hat==='pocket' ? goOut() : ['Not without his hat.']; } } };
  },
  hat(){
    const f=S.flags;
    if (f.door==='open' && f.hat==='rack') return { act: take('Take hat', f=>{ f.hat='pocket';
      return ['He takes his hat from the rack. He leaves the overcoat where it is.']; }) };

  },
  coat(){ return S.flags.hat!=='rack' ? { pages:['His winter overcoat. He is leaving it here.'] } : null; },
  stove(){
    const f=S.flags;
    if (f.tin==='oven') return { pages:['The tin sits open on the oven rack, the solder run out of its seams. The key inside is far too hot to touch.'] };
    if (f.oven==='lit') return { pages:['The oven is lit. He stands well back from it. The gas is doing what gas does, and he is watching to make sure that is all it does.'] };

const FOODISH = ['fridge','light','soup','butter','milk','oj','eggs','babyfood','lemon','crisper'];
const isBook = id => TEXT[id] && TEXT[id].book && id!=='antiquine';
function USE(item, t){
  const f=S.flags;
  switch (item){
    case 'bulb':
      if (t==='lamp' && f.lamp==='dead'){ f.lamp='fixed'; f.bulb='lamp'; refresh();
        return 'He fits the refrigerator bulb and works the switch. The lamp comes on, a little dimmer than before. It is enough to read by.'; }
      if (t==='light') return 'He is not putting it back. That question is settled.';
      return 'It does not go there.';
    case 'matches':
      if (t==='stove'){
        if (f.oven!=='cold') return 'The oven is already lit.';
        f.oven='lit'; f.matches='stove'; refresh();
        return ['He turns the oven dial, strikes a match and holds it to the burner, the way he watched Adele do it a thousand times. It catches with a soft thump.',
                'He puts the matches on the stove, where she kept them.'];
      }
      if (t==='kettle') return 'The kettle does not need a match. The stove underneath it does.';
      if (t==='vletter') return 'He is not going to burn a letter from his mother.';
      if (t==='letter' || t==='mail') return 'He is not going to burn a letter.';
      if (t==='lamp') return 'The lamp is electric. He knows that perfectly well.';
      if (t==='tin') return 'He holds a match under the seam until it reaches his fingers. Solder needs far more heat than a match.';
      if (isBook(t) || t==='shelves' || t==='proof' || t==='notebooks' || t==='antiquine') return 'Not a book. Never a book.';
      if (FOODISH.includes(t)) return 'There is nothing in there that needs lighting.';
      return 'He is not going to set fire to that.';
    case 'tin':
      if (t==='stove'){
        if (f.oven!=='lit') return 'The oven is cold.';
        f.tin='oven'; refresh();
        return ['He sets the tin on the oven rack and shuts the door. After a while there is a smell of hot metal, and then a small tick.', 'The solder has let go.'];
      }
      if (t==='lamp') return lampOn() ? 'The lamp is warm, but nowhere near warm enough.' : 'The lamp is cold.';
      if (t==='kettle') return 'The kettle is cold. Everything in this kitchen is cold.';
      if (t==='butter') return "Prying it open would mean taking Adele's knife out of the butter. He will not do that.";
      if (FOODISH.includes(t)) return 'Cold would shrink the key and the pinhole together. Similarity again.';
      if (t==='matches') return 'A match is nowhere near hot enough for solder.';
      if (t==='desk' || t==='inkwell' || t==='notebooks') return 'There is nothing on the desk that will cut solder.';
      return 'That will not open it.';
    case 'apronItem':
      if (t==='stove'){
        if (f.tin!=='oven') return 'There is nothing in the oven to take out.';
        f.tin='done'; f.key='pocket'; f.apron='hung'; f.oven='off'; refresh();
        return ['He folds the apron into a cloth and lifts the tin out. The key slides into his palm, still warm. He turns the oven off and checks the dial twice.',
                'Then he hangs the apron back on its hook. He cannot get the bow right.'];
      }
      return 'He would rather not.';
    case 'key':
      if (t==='clasp' || t==='antiquine'){ f.key='used'; f.clasp='open'; refresh();
        return 'The key turns in the clasp with a small, exact click, and the clasp falls open.'; }
      if (t==='door') return 'Much too small for the front door.';
      if (t==='desk') return 'Too small for the desk. It is a key for something smaller.';
      if (t==='notebooks') return 'His notebooks do not lock. Nobody else can read them anyway.';
      if (isBook(t)) return 'This one has no lock.';
      return 'There is no lock there.';
    case 'noteItem':
      if (t==='slot'){ f.note='book'; refresh();
        return ['He lays the note in the empty space. It fits exactly. He notices this, and decides not to mind.',
                'It is not a sentence the book could ever prove. It is something she asked of him, and the book takes it as given.']; }
      if (FOODISH.includes(t) || t==='stove' || t==='plate' || t==='table') return 'He reads it again, there by the food, and still cannot.';
      if (t==='antiquine') return 'Not on the cover. Somewhere inside.';
      return 'He would rather keep it with him.';
    case 'hatItem':
      if (t==='door') return goOut();
      return 'It goes on his head, when it is time.';
    case 'vletter':
      if (t==='letter') return 'Two letters from the dead. He keeps them apart, in case they compare notes.';
      return 'He would rather keep it.';
  }
  return 'Nothing happens. He had not really expected anything to.';
}
// book.js — the Antiquine. Part I: Names. Part II: Numbers.
// Part I pages are lists of definitions: `A > (...)` names a sentence; inside a sentence
// `X > Y` says X and Y have the same value, `X → Y` is implication, ⊥ is false.
// Part II pages are a number machine: `rules` lists the digits that act, `check` settles the page.
// Fates and answers are computed, never stored: edit a page and the answer key follows.

/* ---------- the machine ---------- */
const LONG = { long:true };
function say(x,R){
  if (!x) return null;
  const h=x[0], r=x.slice(1);
  if (h==='2' && R.includes(2)) return r.length ? r : null;
  if (!r.length || !'345'.includes(h) || !R.includes(+h)) return null;
  const y=say(r,R); if (y==null || y===LONG) return y;
  const o = h==='3' ? y+'2'+y : h==='4' ? '¬'+y : [...y].reverse().join('');
  return o.length>160 ? LONG : o;
}
const rev = s => [...s].reverse().join('');
const isNum = s => typeof s==='string' && /^[1-9]+$/.test(s);
function deny(x,R){ const a=say(x,R); return (typeof a==='string' && a[0]==='¬' && isNum(a.slice(1))) ? a.slice(1) : null; }

const PAGES = [
  { title:true },
  /* ---- I. Names ---- */
  { defs:['A > (⊥ > ⊥)','B > (A > ⊥)'], gloss:'⊥ > ⊥ says that the false is false.',
    after:'Two easy ones. He is grateful for them.' },
  { defs:['T > T'],
    after:'It says only that it is true. Nothing outside it decides, so it may be whatever it likes.' },
  { defs:['L > (L > ⊥)'],
    after:'It can be neither. The book gives it the only thing left, which is peace.' },
  { defs:['A > (B > ⊥)','B > (A > ⊥)'],
    after:'Each says the other lies. Either could be right, but not both. He thinks of the two chairs in the kitchen.' },
  { defs:['A > (B > ⊥)','B > (C > ⊥)','C > (A > ⊥)'], gloss:'Count.',
    after:'Three in a ring is one too many. An odd number of denials never comes round to agreement.' },
  { defs:['A > (A → (B > ⊥))','B > (A > ⊥)'], gloss:'X → Y is false only when X is true and Y is false.',
    after:'It comes out cleanly. Not every page is a trap.' },
  { defs:['C > (C → H)'], notes:['H: there is an afterlife.'],
    after:'If C were false, C → H would be true, and so would C. So C is true, and so is H. It is so simple. He reads it four times, looking for the trick.' },

function parseDef(src){
  const toks = src.match(/[A-Z]|⊥|⊤|□|→|>|\(|\)/g); let i=0;
  const peek=()=>toks[i], next=()=>toks[i++];
  const prim=()=>{ const t=next(); if(t==='('){ const e=imp(); next(); return e; }
    if(t==='□') return {k:'box',a:prim()};
    if(t==='⊥') return {k:'c',v:false}; if(t==='⊤') return {k:'c',v:true}; return {k:'n',n:t}; };
  const eq=()=>{ const a=prim(); if(peek()==='>'){ next(); return {k:'eq',a,b:eq()}; } return a; };
  const imp=()=>{ const a=eq(); if(peek()==='→'){ next(); return {k:'imp',a,b:imp()}; } return a; };
  const name=next(); next();
  return { name, e:imp() };
}
function ev(e,v){ switch(e.k){ case 'c': return e.v; case 'n': return v[e.n];
  case 'eq': return ev(e.a,v)===ev(e.b,v); case 'imp': return !ev(e.a,v)||ev(e.b,v); } }
function namesIn(e,out=new Set()){ if(e.k==='n') out.add(e.n); else if(e.a){ namesIn(e.a,out); namesIn(e.b,out); } return out; }
/* ---------- Part III logic: the ladder. □φ holds on rung n when φ holds on every rung below. ---------- */
const VNAME = ['proved','refuted','true','false'];
const VDESC = ['the book proves it','it proves it false','true, but unprovable','false, but irrefutable'];
const VERD = [
  ['kkkkkkkkk','k.......k','k.kkkkk.k','k.kkkkk.k','k.kkkkk.k','k.kkkkk.k','k.kkkkk.k','k.......k','kkkkkkkkk'],
  ['kkkkkkkkk','kk.....kk','k.k...k.k','k..k.k..k','k...k...k','k..k.k..k','k.k...k.k','kk.....kk','kkkkkkkkk'],
  FATE[0], FATE[1]
];
const RUNGS = 24;
function evL(e,n,V){ switch(e.k){
  case 'c': return e.v;
  case 'n': { const v=V[e.n][n]; if (v===undefined) throw 0; return v; }
  case 'eq': return evL(e.a,n,V)===evL(e.b,n,V);
  case 'imp': return !evL(e.a,n,V)||evL(e.b,n,V);
  case 'box': for(let m=0;m<n;m++) if(!evL(e.a,m,V)) return false; return true; } }
function climb(defs){
  const ds=defs.map(parseDef), V={}; ds.forEach(d=>V[d.name]=[]);
  for (let n=0;n<=RUNGS;n++){ let left=ds;
    for (let pass=0; left.length && pass<=ds.length; pass++) left=left.filter(d=>{ try{ V[d.name][n]=evL(d.e,n,V); return false; }catch(_){ return true; } });
  }
  return V;
}
function solveProof(i){
  const p=PAGES[i], V=climb([...(p.hidden||[]), ...p.defs]), order=p.defs.map(d=>parseDef(d).name), fate={};
  order.forEach(n=>{ const s=V[n]; fate[n] = s.every(x=>x) ? 0 : s.every(x=>!x) ? 1 : s[RUNGS] ? 2 : 3; });
  return { order, fate };
}
const SOLVED = {};
function solve(i){
  if (SOLVED[i]) return SOLVED[i];
  if (PAGES[i].proof) return SOLVED[i] = solveProof(i);
  const defs = PAGES[i].defs.map(parseDef), order=[];
  const add=n=>{ if(!order.includes(n)) order.push(n); };
  defs.forEach(d=>{ add(d.name); namesIn(d.e).forEach(add); });
  const par={}; order.forEach(n=>par[n]=n);
  const f=n=>par[n]===n?n:(par[n]=f(par[n]));
  defs.forEach(d=>namesIn(d.e).forEach(n=>{ par[f(n)]=f(d.name); }));
  const comps={}; order.forEach(n=>(comps[f(n)]=comps[f(n)]||[]).push(n));
  const fate={};
  for (const ns of Object.values(comps)){
    const ds=defs.filter(d=>ns.includes(d.name)), sols=[];
    for (let m=0;m<(1<<ns.length);m++){
      const v={}; ns.forEach((n,j)=>v[n]=!!((m>>j)&1));
      if (ds.every(d=>ev(d.e,v)===v[d.name])) sols.push(v);
    }
    ns.forEach(n=>{
      if (!sols.length) fate[n]=3;
      else { const t=sols.some(s=>s[n]), fl=sols.some(s=>!s[n]); fate[n] = t&&fl ? 2 : (t ? 0 : 1); }
    });
  }
  return SOLVED[i] = { order, fate };
}

function clip(s){ if (measure(s)<=150) return s; while (s.length && measure(s+'...')>150) s=s.slice(0,-1); return s+'...'; }
function said(a){ return a==null ? ['→ nothing',C.G] : a===LONG ? ['→ more than the page will hold',C.G] : [clip('→ '+a),C.K]; }
function machineLines(i){
  const p=PAGES[i], x=inputOf(i), R=p.rules, out=[];
  if (!x) return out;
  if (p.back){ const r=rev(x); out.push([clip('backwards: '+r),C.D]); out.push(said(say(r,R))); return out; }
  let curr=x;
  for (let k=0;k<(p.steps||1);k++){
    const a=say(curr,R); out.push(said(a));
    if (typeof a!=='string') break;
    const nx=a.replace(/^¬+/,''); if (!isNum(nx)) break;
    curr=nx;
  }
  return out;
}

function cellAt(x,y){

  const {order}=solve(i);

    const c={x:(PAGES[i].proof?COLX3:COLX)[j]-4,y:ROW0+r*ROWH-4,w:17,h:17,name:''};
    if (hit(c,x,y)) return {r,j,n:order[r],rect:c};

}

const ladRect = (r,k) => ({ x:RX+38+k*18, y:LAD_Y+12+r*12-1, w:14, h:11, name:'' });

function ladderAt(x,y){

function bookKey(e){
  if (!lampOn()) return false;
  const i=S.book.page, p=PAGES[i];
  if (e.key==='ArrowLeft'){ turn(-1); return true; }
  if (e.key==='ArrowRight'){ turn(1); return true; }
  if (p.rules){
    if (/^[1-9]$/.test(e.key)){ typeKey(i,e.key); return true; }
    if (e.key==='Backspace'){ typeKey(i,'del'); return true; }
    if (e.key==='Delete'){ typeKey(i,'C'); return true; }
    return false;
  }
  if (!p.defs) return false;
  const {order}=solve(i);
  if (e.key==='ArrowUp'||e.key==='ArrowDown'){
    S.bookKb=true; S.book.row=((S.book.row||0)+(e.key==='ArrowDown'?1:-1)+order.length)%order.length; return true;
  }
  if (['1','2','3','4'].includes(e.key)){ S.bookKb=true; const r=Math.min(S.book.row||0,order.length-1); mark(i,order[r],+e.key-1); return true; }

}

  if (p.threshold) return ['Antiquine', 'III. Proof. Box X implies X. '+THRESH_L+' '+(S.flags.note==='book' ? 'In the space, in her hand: Kurt, iss was. Eat something. '+THRESH_DONE : THRESH_R)];

    [[3,'If X says Y, 3X says Y2Y.'],[4,'If X says Y, 4X says not Y.'],[5,'If X says Y, 5X says Y backwards.']].forEach(([r,s])=>{ if(p.rules.includes(r)) rules.push(s); });
    let b=rules.join(' ')+' Task: '+p.task.replace(/¬/g,'not ')+' Typed: '+(inputOf(i)||'nothing')+'. '+machineLines(i).map(l=>l[0].replace('→','says').replace(/¬/g,'not ')).join('; ')+'.';
    if (settled(i)) b+=' The page settles. '+p.after;

  const NAMES = p.proof ? VNAME : FNAME;
  let b=p.defs.join('; ').replace(/□/g,'box ')+'. '+(p.notes||[]).join(' ')+' Marks: '+order.map(n=>n+' '+(m[n]!=null?NAMES[m[n]]:'unmarked')).join(', ')+'.';
  if (settled(i)) b+=' The page settles. '+p.after; else if (complete(i)) b+=' The page will not settle.';

}

const SND = { ctx:null, master:null, send:null, muted:false, players:[], cue:null, noise:null, w25:null, w12:null, timer:null };

/* ---------- the graph ---------- */
function buildGraph(ctx){
  const master=ctx.createGain(); master.gain.value=0.55;
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
  master.connect(comp); comp.connect(ctx.destination);
  const send=ctx.createGain(); send.gain.value=1;
  const delay=ctx.createDelay(1), fb=ctx.createGain(), lp=ctx.createBiquadFilter(), eg=ctx.createGain();
  delay.delayTime.value=0.31; fb.gain.value=0.32; lp.type='lowpass'; lp.frequency.value=2200; eg.gain.value=0.22;
  send.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(eg); eg.connect(master);
  const n=Math.floor(ctx.sampleRate*2.4), ir=ctx.createBuffer(2,n,ctx.sampleRate);
  for (let c=0;c<2;c++){ const d=ir.getChannelData(c); for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2); }
  const conv=ctx.createConvolver(), rg=ctx.createGain(); conv.buffer=ir; rg.gain.value=0.3;
  send.connect(conv); conv.connect(rg); rg.connect(master);
  const nb=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate), nd=nb.getChannelData(0);
  for (let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
  const pw=duty=>{ const N=48, re=new Float32Array(N), im=new Float32Array(N);
    for (let k=1;k<N;k++) re[k]=(2/(k*Math.PI))*Math.sin(k*Math.PI*duty); return ctx.createPeriodicWave(re,im); };
  Object.assign(SND,{ ctx, master, send, noise:nb, w25:pw(0.25), w12:pw(0.125) });
}

// Numbers: a crab canon. The chords are a palindrome, so the tune and the same tune backwards
// can be played together. First alone, then with itself reversed underneath.
function songNumbers(){

  const roots=[45,41,48,43,43,48,41,45];

// Proof: one long held breath. A low A, the dominant of D, pulses under chords that never land
// (Asus4, A7, Bb over A, A7b9). A Shepard voice climbs A, C#, D, E and round again, an octave every
// four bars, forever. The music box starts the waltz in D minor and, the second time, stops one note
// short. The walk, in D major, is the resolution this has been waiting for.
function songProof(){
  const ev=[], CH=[[57,62,64],[57,61,64,67],[58,62,65],[55,61,64,70]];
  for (let b=0;b<32;b++){ const t=b*3, c=b%4;
    ev.push({t,m:45,d:0.8,v:0.16,i:'tri'}); ev.push({t:t+1,m:45,d:0.5,v:0.08,i:'tri'});
    if (b>=16) ev.push({t:t+2,m:45,d:0.5,v:0.06,i:'tri'});          // the pulse quickens in the second half
    for (const m of CH[c]) ev.push({t,m,d:2.8,v:0.026,i:'pad'});
  }
  // The climbing voice, in four-bar shapes. Every step goes up, every shape ends where the next can rise
  // from, so it never stops climbing: plain (a), with passing notes (b), long and held (c), and urgent,
  // two octaves in four bars (d). Entries are [bar, beat, pitch class]; all fall on chord tones of their bar.
  const SHEP = {
    a: [[0,0,9],[1,0,1],[2,0,2],[3,0,4]],
    b: [[0,0,9],[0,2,11],[1,0,1],[1,2,4],[2,0,5],[3,0,7]],
    c: [[0,0,9],[2,0,2],[3,0,4],[3,2,7]],
    d: [[0,0,9],[0,2,2],[1,0,4],[1,2,7],[2,0,10],[2,2,2],[3,0,4],[3,2,7]]
  };
  const climb=[]; ['a','b','c','a','d','b','d','c'].forEach((g,k)=>SHEP[g].forEach(([bar,beat,pc])=>climb.push({t:(k*4+bar)*3+beat,pc})));
  climb.forEach((n,i)=>{ const next = i+1<climb.length ? climb[i+1].t : 96; ev.push({t:n.t,m:60+n.pc,d:next-n.t+0.4,v:0.12,i:'shep'}); });
  const A=[['D5',2],['A4',1],['F4',2],['A4',1],['G4',1],['F4',1],['E4',1],['E4',3]];
  ev.push(...phrase(A,0,'bell',0.15));                                // the opening, whole
  ev.push(...phrase(A.slice(0,6),24,'bell',0.15));                    // one note short
  ev.push(...phrase([['E5',2],['Bb4',1],['G4',2],['Bb4',1],['A4',1],['G4',1],['F4',1],['F4',3]],48,'bell',0.15)); // a step higher, against the chords
  ev.push(...phrase(A.slice(0,3),72,'bell',0.15));                    // barely begun
  for (const t of [72,84]) ev.push({t,m:81,d:11.5,v:0.02,i:'pad'});   // a high A held over the last eight bars
  return { bpm:66, loop:96, wet:0.85, ev };
}

function musicCue(){
  const f=S.flags;
  if (S.mode==='walk') return 'walk';
  if (S.mode==='end' || (S.mode==='title' && f.ended)) return 'end';
  if (S.mode==='title') return 'house';

}
function corners(s){
  const x0=Math.max(0,s.x-1), y0=Math.max(16,s.y-1), x1=Math.min(W-1,s.x+s.w), y1=Math.min(255,s.y+s.h);
  const pc=(x,y)=>px(x,y,((x+y)&1)?C.K:C.W);
  for(let i=0;i<4;i++){ pc(x0+i,y0); pc(x0,y0+i); pc(x1-i,y0); pc(x1,y0+i); pc(x0+i,y1); pc(x0,y1-i); pc(x1-i,y1); pc(x1,y1-i); }
}

// ---- balloon, with an optional button (Eat, Take, Use)
const showAct = d => d.act && !d.used && d.page===d.pages.length-1;
function layout(){
  const d=S.dialog, t=TEXT[d.id];
  const lines=wrap(d.pages[d.page],200);
  const act = showAct(d), aw = act ? measure(d.act.label)+16 : 0;
  const bw = Math.max(measure(t.name,true), ...lines.map(l=>measure(l)), aw) + 16;
  const bh = 22 + lines.length*12 + (act?18:0) + 2;
  const sp=d.spot, scx=sp.x+sp.w/2;
  const bx = Math.max(6, Math.min(W-6-bw, Math.round(scx-bw/2)));
  const below = sp.y+sp.h/2 < 110;
  let by = below ? sp.y+sp.h+9 : sp.y-bh-9;
  by = Math.max(20, Math.min(218-bh, by));
  const tx = Math.max(bx+8, Math.min(bx+bw-9, Math.round(scx)));
  return { lines, bx, by, bw, bh, below, tx, actRect: act ? {x:bx+8,y:by+bh-19,w:aw,h:13} : null };
}
function drawDialog(){
  const d=S.dialog, t=TEXT[d.id], L=layout();
  d.actRect = L.actRect;
  const {bx,by,bw,bh,tx}=L;
  fillFn(bx+3,by+3,bw,bh,(x,y)=>((x+y)&1)?C.K:null);
  rrect(bx,by,bw,bh,3,C.W);
  if (L.below){ poly([[tx-5,by+1],[tx+5,by+1],[tx,by-7]],C.W); rect(tx-3,by,7,1,C.W); }
  else { poly([[tx-5,by+bh-1],[tx+5,by+bh-1],[tx,by+bh+7]],C.W); rect(tx-3,by+bh-1,7,1,C.W); }
  text(t.name,bx+8,by+4,C.K,true);
  L.lines.forEach((l,i)=>text(l,bx+8,by+18+i*12));
  if (d.page < d.pages.length-1){ const x=bx+bw-11, y=by+bh-8; rect(x,y,5,1,C.K); rect(x+1,y+1,3,1,C.K); px(x+2,y+2,C.K); }
  if (L.actRect){
    const e=L.actRect, off=d.act.off;
    if (!off){ rect(e.x+2,e.y+e.h,e.w-2,1,C.K); rect(e.x+e.w,e.y+2,1,e.h-2,C.K); }
    rrect(e.x,e.y,e.w,e.h,3,C.W,off?C.G:C.K);
    text(d.act.label,e.x+8,e.y+1,off?C.G:C.K);
  }
}

// ---- other screens
function drawTitle(){
  rect(0,0,W,H,C.W); frame(5,5,W-10,H-10); frame(8,8,W-16,H-16,C.L);
  const t='Antiquine', tw=measure(t,true)*3;
  text(t,(W-tw)>>1,52,C.K,true,3);
  const s='Princeton, 1977'; text(s,(W-measure(s))>>1,102,C.D);
  box(170,134,44,28,C.W); line(170,134,192,150); line(213,134,192,150); box(203,137,7,8,C.L);
  fillFn(173,163,44,2,chk(C.D,null));
  const p='Tap anywhere to begin'; text(p,(W-measure(p))>>1,192,C.G);
  const q=SND.muted ? 'Sound is off. Press M to turn it on.' : 'With sound. Press M to mute.'; text(q,(W-measure(q))>>1,208,C.L);
}
function drawNotes(){
  rect(0,16,W,208,C.W);
  for(let y=40;y<224;y+=12) rect(0,y,W,1,C.P);
  rect(26,16,1,208,C.L);
  text('Things he has looked at',34,20,C.K,true);
  const ids=ALL.filter(id=>S.seen.has(id));
  const books=ALL.filter(id=>TEXT[id].book), nb=books.filter(id=>S.seen.has(id)).length;
  const rows=ids.filter(id=>!TEXT[id].book).map(id=>TEXT[id].name);
  if (nb) rows.unshift('Books, '+nb+' of '+books.filter(id=>id!=='antiquine').length);
  const s=ids.length+' of '+ALL.length; text(s,W-10-measure(s),20,C.D);
  if (!rows.length) text('Nothing yet.',34,31,C.G);
  rows.forEach((n,i)=>text(n,34+Math.floor(i/16)*118,31+(i%16)*12));
}

// ---- render
function render(){
  use(ctx);
  if (S.mode==='title'){ drawTitle(); readout(); return; }
  if (S.mode==='walk'){ drawWalk(); readout(); return; }
  if (S.mode==='end'){ drawEnd(); readout(); return; }
  if (S.mode==='notes') { rect(0,0,W,H,C.W); drawNotes(); } else { ctx.drawImage(room(S.room).cv,0,0); if (S.room==='book') drawBookPage(); }
  drawBar(); drawTray();
  if (S.hover && !S.dialog && S.hover.name!=='') corners(S.hover);
  if (S.dialog) drawDialog();
  readout();
}
function readout(){
  let head='', body='';
  if (S.mode==='title'){ head='Antiquine'; body='Princeton, 1977. Tap the screen to begin.'; }
  else if (S.mode==='walk'){ head='Antiquine'; body=WALK[S.walk]+' Tap to continue.'; }
  else if (S.mode==='end'){ head='Antiquine'; body='Princeton, 1977. '+CODA+(S.resetArm?' Tap Start over again, or press R, to forget everything.':' Start over: press R twice.'); }
  else if (S.dialog){
    const d=S.dialog; head=TEXT[d.id].name; body=d.pages[d.page].replace(/\n/g,' ');
    if (showAct(d)) body += ' Button: '+d.act.label+(d.act.off?', greyed out':'')+'. Press '+d.act.label[0]+'.';
  }
  else if (S.room==='book' && S.mode==='room'){ [head,body]=bookReadout(); }
  else { head=LABEL[cur()]; body = S.mode==='notes' ? 'Things he has looked at.' : 'Tap anything to look at it.'; }
  if (!S.dialog && S.mode!=='title' && S.mode!=='walk' && S.mode!=='end'){
    const items=pocketItems();
    if (items.length) body += ' In his pocket: '+items.map(it=>shortOf(it.id)).join(', ')+'. Press P to choose one.';
    if (S.held) body += ' Holding the '+shortOf(S.held)+': tap something to use it on, or tap it again to put it away.';
  }
  const s=head+'|'+body;
  if (ro.dataset.s!==s){ ro.dataset.s=s; ro.querySelector('b').textContent=head; ro.querySelector('span').textContent=body; }
}

// ---- actions
function save(){ try{ localStorage.setItem('antiquine.v1', JSON.stringify({ seen:[...S.seen], room:S.room, book:S.book, flags:S.flags })); }catch(e){} }
function openDialog(id,spot){
  const t=TEXT[id]; if(!t) return;
  S.seen.add(id); save();
  const dyn = DYN[id] ? DYN[id]() : null;
  let act = t.food ? { label:'Eat', off:true, refuse:t.refuse } : (dyn && dyn.act) || null;
  if (ITEMS.includes(id)) act = { label:'Use', run(){ S.held=id; return null; } };
  S.dialog={ id, spot, pages:(dyn && dyn.pages) || t.pages, page:0, act, used:false };
}
function useOn(item,target,spot){
  const res=USE(item,target);
  S.held=null;
  if (res==null) return;
  S.dialog={ id:target, spot, pages:Array.isArray(res)?res:[res], page:0, act:null, used:false };
  save();
}
function pocketClick(it){
  if (S.held===it.id) S.held=null;
  else if (S.held) useOn(S.held,it.id,it);
  else openDialog(it.id,it);
}
function go(to){
  S.dialog=null; S.hover=null; S.kb=-1;
  if (to==='notes') S.mode = S.mode==='notes' ? 'room' : 'notes';
  else { S.mode='room'; S.room=to; }
  save();
  if (to==='book') arrive();
}
function spotAt(x,y){
  if (S.mode!=='room') return null;
  const sp=room(S.room).spots;
  for(let i=sp.length-1;i>=0;i--) if(hit(sp[i],x,y)) return sp[i];
  return null;
}
function activate(sp){
  if (S.held) return useOn(S.held,sp.id,sp);
  const t=TEXT[sp.id];
  if (t.go){ S.seen.add(sp.id); go(t.go); } else openDialog(sp.id,sp);
}
function click(x,y){
  if (S.mode==='title'){ S.mode = S.flags.ended ? 'end' : 'room'; render(); return; }
  if (S.mode==='walk'){ if (++S.walk>=WALK.length){ S.mode='end'; S.flags.ended=true; save(); } render(); return; }
  if (S.mode==='end'){
    if (hit(START_R,x,y)){ if (S.resetArm) resetAll(); else S.resetArm=true; }
    else S.resetArm=false;
    render(); return;
  }
  if (S.dialog){
    const d=S.dialog;
    if (hit(d.actRect,x,y)){
      const res = d.act.off ? [d.act.refuse || 'Nobody has tasted it.'] : d.act.run();
      if (res==null) S.dialog=null; else { d.pages=res; d.used=true; d.page=0; }
    }
    else if (d.page < d.pages.length-1) d.page++;
    else S.dialog=null;
    render(); return;
  }
  if (hit(soundRect(),x,y)){ toggleMute(); render(); return; }
  if (hit(navRect(),x,y)){ go(navTarget()); render(); return; }
  if (hit(helpRect(),x,y)){ openDialog('help',{x:0,y:0,w:16,h:15}); render(); return; }
  if (y>=224){
    const it=pocketItems().find(it=>hit(it,x,y)); if (it){ pocketClick(it); render(); return; }
    if (hit(POCKET,x,y)){ S.held=null; render(); return; }
    const t=TRAY.find(t=>x>=t.x && x<t.x+48); if(t){ go(t.to); render(); }
    return;
  }
  if (S.room==='book' && S.mode==='room'){ bookClick(x,y); render(); return; }
  const sp=spotAt(x,y); if(sp){ activate(sp); render(); }
}
function hoverAt(x,y){
  if (S.mode==='title' || S.mode==='walk' || S.mode==='end' || S.dialog) return null;
  if (hit(soundRect(),x,y)) return soundRect();
  if (hit(navRect(),x,y) || hit(helpRect(),x,y)) return { x:0,y:0,w:0,h:0,name:'' };
  if (y>=224){
    const it=pocketItems().find(it=>hit(it,x,y)); if (it) return it;
    const t=TRAY.find(t=>x>=t.x && x<t.x+48); return t ? { x:t.x, y:228, w:48, h:25, name:LABEL[t.to], nav:true } : null;
  }
  if (S.room==='book' && S.mode==='room') return bookHover(x,y);
  return spotAt(x,y);
}

// ---- input
function toLogical(e){ const r=cv.getBoundingClientRect(); return [ Math.floor((e.clientX-r.left)*W/r.width), Math.floor((e.clientY-r.top)*H/r.height) ]; }
cv.addEventListener('click', e=>{ audioInit(); const [x,y]=toLogical(e); click(x,y); S.hover=hoverAt(x,y); render(); });
cv.addEventListener('pointermove', e=>{
  if (e.pointerType==='touch') return;
  const [x,y]=toLogical(e), h=hoverAt(x,y);
  cv.style.cursor = h || S.mode==='title' || S.mode==='walk' || S.dialog || (S.mode==='end' && hit(START_R,x,y)) ? 'pointer' : 'default';
  if (h!==S.hover && !(h && S.hover && h.name===S.hover.name && h.id===S.hover.id && h.x===S.hover.x && h.y===S.hover.y)){ S.hover=h; render(); }
});
cv.addEventListener('pointerleave', ()=>{ if(S.hover){ S.hover=null; render(); } });
cv.addEventListener('keydown', e=>{
  if (e.key==='m'||e.key==='M'){ toggleMute(); render(); return; }
  audioInit();
  if (S.mode==='title' || S.mode==='walk'){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); click(0,0); } return; }
  if (S.mode==='end'){ if (e.key==='r'||e.key==='R') click(START_R.x+1,START_R.y+1); return; }
  if (S.dialog){
    const d=S.dialog;
    if (['Enter',' ','Escape'].includes(e.key)){ e.preventDefault(); if(e.key==='Escape') S.dialog=null; else click(-1,-1); render(); }
    else if (d.actRect && e.key.toLowerCase()===d.act.label[0].toLowerCase()){ const r=d.actRect; click(r.x+1,r.y+1); }
    return;
  }
  if (e.key==='Escape' && S.held){ S.held=null; render(); return; }
  if (e.key==='p'){
    const items=pocketItems(); if (!items.length) return;
    S.pk=(S.pk+1)%items.length; S.hover=items[S.pk]; render(); return;
  }
  if ((e.key==='Enter'||e.key===' ') && S.hover && S.hover.pocket){ e.preventDefault(); pocketClick(S.hover); render(); return; }
  if (S.room==='book' && S.mode==='room' && bookKey(e)){ e.preventDefault(); render(); return; }
  const sp = S.mode==='room' ? room(S.room).spots : [];
  if (['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key) && sp.length){
    e.preventDefault();
    const dir = (e.key==='ArrowRight'||e.key==='ArrowDown') ? 1 : -1;
    S.kb = (S.kb + dir + sp.length) % sp.length; S.hover=sp[S.kb]; render();
  } else if ((e.key==='Enter'||e.key===' ') && S.hover && S.hover.id && !S.hover.name){ e.preventDefault(); activate(S.hover); render(); }
  else if (e.key==='n'){ go(navTarget()); render(); }
});

function resetAll(){
  try{ localStorage.removeItem('antiquine.v1'); }catch(e){}
  S.seen.clear(); S.book={ page:0, max:0, row:0, marks:{}, inputs:{} }; S.flags={ ...FLAGS0 };
  S.room='study'; S.mode='title'; S.held=null; S.dialog=null; S.hover=null; S.walk=0; S.resetArm=false;
  invalidate();
}

// ---- sizing
function fit(){
  const narrow = innerWidth < 620;
  const availW = document.documentElement.clientWidth - 32 - (narrow ? 24 : 48);
  const availH = innerHeight - (narrow ? 230 : 150);
  let s = Math.min(availW/W, availH/H);
  if (s >= 2) s = Math.floor(s);
  s = Math.max(s, Math.min(1, availW/W));
  cv.style.width = Math.round(W*s)+'px';
  cv.style.height = Math.round(H*s)+'px';
}
addEventListener('resize', fit);

// ---- boot
function start(data){
  let saved={};
  try{ saved = JSON.parse(localStorage.getItem('antiquine.v1')||'{}') || {}; }catch(e){}
  const src = (data && data.seen) ? data : saved;
  (src.seen||[]).forEach(id=>S.seen.add(id));
  if (src.room && DRAW[src.room]) S.room = src.room;
  if (src.book && typeof src.book==='object') Object.assign(S.book, src.book);
  if (src.flags && typeof src.flags==='object') Object.assign(S.flags, src.flags);
  if (data && data.held && ITEMS.includes(data.held)) S.held = data.held;
  if (data && data.mode && data.mode!=='title') S.mode = data.mode;
  if (data && typeof data.walk==='number') S.walk = Math.min(data.walk, WALK.length-1);
  invalidate(); fit(); render();
}
window.claude?.hot?.snapshot?.(()=>({ room:S.room, mode:S.mode, seen:[...S.seen], book:S.book, flags:S.flags, held:S.held, walk:S.walk }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body></html>
